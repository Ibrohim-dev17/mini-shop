<!DOCTYPE html>
<html lang="uz" data-page="index">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uzum Market</title>
    <!-- tungi rejim yonib-o'chmasligi uchun -->
    <script>try{if(localStorage.getItem('site_theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="prefetch" href="categories.html">
    <link rel="prefetch" href="cart.html">
    <link rel="prefetch" href="heart.html">
    <link rel="prefetch" href="profil.html">
    <link rel="prefetch" href="product.html">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="search-backdrop" id="searchBackdrop" onclick="closeSearchDropdown()"></div>

    <div class="sticky-header">
        <div class="search-box-wrapper">
            <div class="search-box" id="searchBoxContainer">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Mahsulotlar va turkumlar izlash..." data-i18n-placeholder="search_placeholder" onfocus="showSearchHistory()" oninput="handleLiveSearch(event)" onkeypress="handleSearch(event)" autocomplete="off">
            </div>
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>
    </div>

    <div class="stories-container" id="storiesContainer"></div>

    <div class="banner-carousel-container" id="bannerContainer">
        <div class="banner-track" id="bannerTrack"></div>
    </div>
    <div class="banner-dots" id="bannerDots"></div>

    <div id="weeklySaleContainer"></div>

    <div class="categories-scroll-wrapper">
        <div class="categories-track" id="categoriesTrack"></div>
    </div>

    <div id="subcatsRowContainer"></div>

    <div class="products-grid" id="productsGrid"></div>

    <h2 class="section-title" id="recentTitle" style="display:none; padding: 0 16px; margin: 16px 0 10px 0; max-width:1300px; margin-left:auto; margin-right:auto; font-size:16px; font-weight:700;" data-i18n="recent_title">Siz ko'rgansiz</h2>
    <div class="products-grid" id="recentProductsGrid"></div>

    <!-- Storis Modal Oynasi -->
    <div id="storyModal" style="touch-action: none; user-select: none; -webkit-user-select: none; display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 9999; flex-direction: column; justify-content: space-between;">
        <div style="position: absolute; top: 55px; left: 16px; right: 16px; z-index: 100; display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; gap: 4px; width: 100%;" id="modalProgressBars"></div>
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <button onclick="closeStoryModal()" style="background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(4px);">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"></polyline></svg>
                </button>
            </div>
        </div>

        <div id="modalPauseIcon" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 72px; height: 72px; border-radius: 50%; background: rgba(0,0,0,0.45); backdrop-filter: blur(4px); align-items: center; justify-content: center; z-index: 50; pointer-events: none;">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
        </div>

        <button id="modalSoundBtn" onclick="toggleStorySound(event)" style="display: none; position: absolute; top: 122px; right: 16px; z-index: 100; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 38px; height: 38px; border-radius: 50%; align-items: center; justify-content: center; cursor: pointer; backdrop-filter: blur(4px);"></button>

        <div id="modalSeekInfo" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 60; pointer-events: none; background: rgba(0,0,0,0.55); color: #fff; font-size: 22px; font-weight: 700; padding: 10px 18px; border-radius: 14px; font-variant-numeric: tabular-nums;"></div>

        <div id="modalMediaContainer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #000; z-index: 1;"></div>

        <div id="modalStoryFooter" style="position: absolute; bottom: calc(30px + var(--nav-extra, 0px)); left: 16px; right: 16px; z-index: 100; display: none;">
            <div id="modalProductCard" style="background: rgba(28, 29, 34, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer;">
                <img id="modalPrevImg" src="" style="width: 56px; height: 56px; border-radius: 10px; object-fit: cover; background: #fff;">
                <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
                    <div id="modalPrevTitle" style="font-size: 13px; font-weight: 600; color: #fff; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;"></div>
                    <div id="modalPrevPrice" style="font-size: 15px; font-weight: 800; color: #fff;"></div>
                </div>
                <button id="modalBtnText" style="background: #7000ff; color: #fff; border: none; padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer;">Ko'rish</button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
            <span data-i18n="nav_home">Bosh sahifa</span>
        </a>
        <a href="categories.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg></div>
            <span data-i18n="nav_catalog">Katalog</span>
        </a>
        <a href="cart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><div class="badge-count" id="cartBadge">0</div></div>
            <span data-i18n="nav_cart">Savatcha</span>
        </a>
        <a href="heart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><div class="badge-count" id="favBadge">0</div></div>
            <span data-i18n="nav_fav">Saralangan</span>
        </a>
        <a href="profil.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
            <span data-i18n="nav_profile">Profil</span>
        </a>
    </nav>

    <script src="script.js"></script>
</body>
</html>
