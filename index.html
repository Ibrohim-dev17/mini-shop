<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uzum Market - Bosh sahifa</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
            --discount-bg: #f1e5ff;
            --discount-text: #7000ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        /* STICKY HEADER (Qidiruv o'rtada, Telegram tugmalariga tegmaydi) */
        .sticky-header {
            position: sticky;
            top: 0;
            background: var(--card);
            z-index: 999;
            padding: 50px 16px 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: center;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 14px;
            padding: 10px 14px;
            gap: 10px;
            border: 1px solid transparent;
            width: 100%;
            max-width: 420px;
        }

        .search-box:focus-within {
            border-color: var(--primary);
            background: #ffffff;
        }

        .search-box svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 2;
            flex-shrink: 0;
        }

        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            width: 100%;
            color: var(--text);
        }

        /* BANNER */
        .banner-container {
            padding: 12px 16px;
        }

        .banner {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, #7000ff, #9c4dff);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(112, 0, 255, 0.2);
        }

        /* KATEGORIYALAR BO'LIMI */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            padding: 0 16px;
            margin: 16px 0 10px 0;
        }

        .categories-slider {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 0 16px;
            scrollbar-width: none;
        }

        .categories-slider::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            color: var(--text);
            flex-shrink: 0;
            width: 70px;
        }

        .cat-chip img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--border);
            background: #fff;
        }

        .cat-chip span {
            font-size: 11px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }

        /* PRODUCTS GRID (Siz uchun tanladik) */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 0 16px;
        }

        .product-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .heart-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255,255,255,0.8);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }

        .heart-icon svg {
            width: 20px;
            height: 20px;
            fill: #d1d5db;
            stroke: #ffffff;
            stroke-width: 1.5;
        }

        .heart-icon.active svg {
            fill: #ff3b30;
            stroke: #ff3b30;
        }

        .product-img-box {
            width: 100%;
            height: 190px;
            background: #f8f9fa;
            position: relative;
            overflow: hidden;
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .product-title {
            font-size: 12px;
            line-height: 1.3;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            height: 32px;
        }

        .rating-row {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: var(--muted);
            margin: 4px 0;
        }

        .rating-row svg {
            width: 13px;
            height: 13px;
            fill: #ffbc0d;
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .main-price {
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
        }

        .discount-tag {
            background: var(--discount-bg);
            color: var(--discount-text);
            font-size: 11px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .old-prices {
            font-size: 11px;
            color: var(--muted);
            text-decoration: line-through;
        }

        .cart-btn {
            width: 100%;
            height: 36px;
            background: var(--primary-bg);
            color: var(--primary);
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: calc(22px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            height: 64px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #808080;
            font-size: 10px;
            font-weight: 500;
            width: 20%;
            position: relative;
        }

        .nav-icon-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #808080;
            stroke-width: 1.8;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        .nav-item.active svg {
            stroke: var(--primary);
            fill: var(--primary-bg);
            transform: scale(1.05);
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -8px;
            background: #000;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 17px;
            height: 17px;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .badge-count.show {
            display: flex !important;
        }
    </style>
</head>
<body>

    <div class="sticky-header">
        <div class="search-box">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Mahsulotlar va turkumlar izlash..." onkeypress="handleSearch(event)">
        </div>
    </div>

    <div class="banner-container">
        <div class="banner">Uzum Market - Chegirmalar haftaligi!</div>
    </div>

    <div class="section-title">Kategoriyalar</div>
    <div class="categories-slider" id="homeCategories"></div>

    <div class="section-title">Siz uchun tanladik</div>
    <div class="products-grid" id="homeProducts"></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
            <span>Bosh sahifa</span>
        </a>
        <a href="categories.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg></div>
            <span>Katalog</span>
        </a>
        <a href="cart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><div class="badge-count" id="cartBadge">0</div></div>
            <span>Savatcha</span>
        </a>
        <a href="heart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><div class="badge-count" id="favBadge">0</div></div>
            <span>Saralangan</span>
        </a>
        <a href="profil.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
            <span>Profil</span>
        </a>
    </nav>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const DEFAULT_CATEGORIES = [
            { id: 1, name: "Kurtkalar", img: "https://picsum.photos/100/100?random=1" },
            { id: 2, name: "Tapichka", img: "https://picsum.photos/100/100?random=2" },
            { id: 3, name: "Shapkalar", img: "https://picsum.photos/100/100?random=3" },
            { id: 4, name: "Ko'ylaklar", img: "https://picsum.photos/100/100?random=4" },
            { id: 5, name: "Ichki kiyimlar", img: "https://picsum.photos/100/100?random=5" }
        ];

        const ALL_PRODUCTS = [
            { id: 1, category_id: 1, name: "Qishki issiq qora kurtka", price: "450 000 so'm", oldPrice: "680 000 so'm", discount: "↓ 33%", rating: "4.9", reviews: "124", img: "https://picsum.photos/300/300?random=1" },
            { id: 2, category_id: 1, name: "Sportivniy stilimdagi kurtka", price: "380 000 so'm", oldPrice: "500 000 so'm", discount: "↓ 24%", rating: "4.8", reviews: "92", img: "https://picsum.photos/300/300?random=2" },
            { id: 3, category_id: 2, name: "Uy uchun yumshoq tapichka", price: "45 000 so'm", oldPrice: "80 000 so'm", discount: "↓ 43%", rating: "5.0", reviews: "310", img: "https://picsum.photos/300/300?random=3" },
            { id: 4, category_id: 3, name: "Bahorgi qora shapka", price: "35 000 so'm", oldPrice: "60 000 so'm", discount: "↓ 41%", rating: "4.7", reviews: "45", img: "https://picsum.photos/300/300?random=4" },
            { id: 5, category_id: 4, name: "Ayollar uchun zamonaviy ko'ylak", price: "220 000 so'm", oldPrice: "350 000 so'm", discount: "↓ 37%", rating: "4.9", reviews: "178", img: "https://picsum.photos/300/300?random=5" },
            { id: 6, category_id: 5, name: "Paxtadan tayyorlangan ichki kiyimlar to'plami", price: "90 000 so'm", oldPrice: "150 000 so'm", discount: "↓ 40%", rating: "4.8", reviews: "89", img: "https://picsum.photos/300/300?random=6" }
        ];

        let favs = JSON.parse(localStorage.getItem('fav_products')) || [];
        let cart = JSON.parse(localStorage.getItem('cart_products')) || [];

        // Kategoriyalarni yuklash (categories.html bilan bog'langan)
        function renderCategories() {
            const container = document.getElementById('homeCategories');
            let categories = JSON.parse(localStorage.getItem('categories')) || DEFAULT_CATEGORIES;

            container.innerHTML = categories.map(c => `
                <a href="products.html?cat_id=${c.id}&cat_name=${encodeURIComponent(c.name)}" class="cat-chip">
                    <img src="${c.img}" alt="${c.name}">
                    <span>${c.name}</span>
                </a>
            `).join('');
        }

        // Random mahsulotlarni chiqarish (Siz uchun tanladik)
        function renderRandomProducts() {
            const grid = document.getElementById('homeProducts');
            let products = JSON.parse(localStorage.getItem('products')) || ALL_PRODUCTS;
            
            // Har safar sahifaga kirganda tasodifiy tartibda aralashtirish (Random)
            let shuffled = [...products].sort(() => 0.5 - Math.random());

            grid.innerHTML = shuffled.map(p => {
                const isFav = favs.includes(p.id);
                return `
                    <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'">
                        <button class="heart-icon ${isFav ? 'active' : ''}" onclick="toggleFav(event, ${p.id})">
                            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        </button>
                        <div class="product-img-box">
                            <img src="${p.img}" alt="${p.name}">
                        </div>
                        <div class="product-info">
                            <div class="product-title">${p.name}</div>
                            <div class="rating-row">
                                <svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                                <span>${p.rating || '4.8'} (${p.reviews || '50'} sharh)</span>
                            </div>
                            <div class="price-row">
                                <span class="main-price">${p.price}</span>
                                <span class="discount-tag">${p.discount}</span>
                            </div>
                            <div class="old-prices">${p.oldPrice}</div>
                            <button class="cart-btn" onclick="addToCart(event, ${p.id})">Savatga qo'shish</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleFav(e, id) {
            e.stopPropagation();
            if (favs.includes(id)) {
                favs = favs.filter(i => i !== id);
            } else {
                favs.push(id);
            }
            localStorage.setItem('fav_products', JSON.stringify(favs));
            renderRandomProducts();
            updateBadges();
        }

        function addToCart(e, id) {
            e.stopPropagation();
            let products = JSON.parse(localStorage.getItem('products')) || ALL_PRODUCTS;
            const prod = products.find(p => p.id === id);
            if(prod) {
                cart.push(prod);
                localStorage.setItem('cart_products', JSON.stringify(cart));
                updateBadges();
                alert("Mahsulot savatchaga qo'shildi!");
            }
        }

        function updateBadges() {
            const favBadge = document.getElementById('favBadge');
            const cartBadge = document.getElementById('cartBadge');
            if (favs.length > 0) { favBadge.textContent = favs.length; favBadge.classList.add('show'); } else { favBadge.classList.remove('show'); }
            if (cart.length > 0) { cartBadge.textContent = cart.length; cartBadge.classList.add('show'); } else { cartBadge.classList.remove('show'); }
        }

        function handleSearch(e) {
            if (e.key === 'Enter') {
                const query = document.getElementById('searchInput').value.trim();
                if (query) window.location.href = `search.html?q=${encodeURIComponent(query)}`;
            }
        }

        renderCategories();
        renderRandomProducts();
        updateBadges();
    </script>
</body>
</html>
