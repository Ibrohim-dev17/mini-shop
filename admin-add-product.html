<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangi mahsulot qo'shish</title>
    <style>
        body { font-family: sans-serif; background: #f4f5f7; padding: 16px; color: #1f2026; margin: 0; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .back-link { font-size: 14px; color: #7000ff; text-decoration: none; font-weight: bold; }
        h2 { font-size: 18px; margin: 0; }
        form { background: #fff; padding: 16px; border-radius: 12px; border: 1px solid #e2e5eb; }
        label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-bottom: 6px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #e2e5eb; border-radius: 8px; box-sizing: border-box; margin-bottom: 14px; font-size: 14px; }
        .btn-submit { background: #7000ff; color: #fff; width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 15px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="admin.html" class="back-link">‹ Orqaga</a>
        <h2>Mahsulot qo'shish</h2>
        <div></div>
    </div>

    <!-- enctype="multipart/form-data" galereyadan rasm yuklash uchun shart! -->
    <form action="/add-product" method="POST" enctype="multipart/form-data">
        <label>Kategoriya</label>
        <select name="cat_id" id="catSelect" onchange="checkNewCategory(this)" required>
            <option value="">Yuklanmoqda...</option>
        </select>

        <div id="newCatDiv" style="display:none; margin-bottom:14px;">
            <label>Yangi kategoriya nomi</label>
            <input type="text" name="new_cat_name" placeholder="Kategoriya nomini kiriting...">
        </div>

        <label>Mahsulot nomi</label>
        <input type="text" name="name" placeholder="Masalan: Smartfon" required>

        <label>Narxi</label>
        <input type="text" name="price" placeholder="Masalan: 1 500 000 so'm" required>

        <label>Eski narxi (ixtiyoriy)</label>
        <input type="text" name="old_price" placeholder="Masalan: 1 800 000 so'm">

        <label>Chegirma (ixtiyoriy)</label>
        <input type="text" name="discount" placeholder="Masalan: ↓ 20%">

        <label>Rasmni galereyadan tanlash</label>
        <input type="file" name="image" accept="image/*" required>

        <button class="btn-submit" type="submit">Mahsulotni saqlash</button>
    </form>

    <script>
        async function loadCategories() {
            let res = await fetch('/api/categories');
            let categories = await res.json();
            let select = document.getElementById('catSelect');
            select.innerHTML = '<option value="">Kategoriyani tanlang</option>' + 
                categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('') + 
                '<option value="new">+ Yangi kategoriya ochish</option>';
        }

        function checkNewCategory(select) {
            let newCatDiv = document.getElementById('newCatDiv');
            newCatDiv.style.display = (select.value === 'new') ? 'block' : 'none';
        }

        loadCategories();
    </script>
</body>
</html>
