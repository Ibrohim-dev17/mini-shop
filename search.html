<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qidiruv natijalari - Uzum Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
            --star: #ffb800;
            --discount-bg: #f1e5ff;
            --discount-text: #7000ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 999;
            padding: 50px 16px 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            flex-shrink: 0;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--text);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-title-info {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            padding: 16px 16px 0 16px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .product-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .product-img-box {
            width: 100%;
            height: 210px;
            background: #f8f9fa;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
        }

        .product-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge-original {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: #00c853;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .product-info {
            padding: 10px 4px 6px 4px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .main-price {
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
        }

        .discount-tag {
            background: var(--discount-bg);
            color: var(--discount-text);
            font-size: 11px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .old-prices {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .price-old {
            text-decoration: line-through;
        }

        .product-title {
            font-size: 12px;
            line-height: 1.3;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 6px;
            height: 32px;
        }

        .cart-btn {
            width: 100%;
            height: 36px;
            background: var(--primary-bg);
            color: var(--primary);
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <div class="sticky-header">
        <a href="categories.html" class="back-btn">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </a>
        <div style="font-size: 16px; font-weight: 700;" id="headerSearchText">Qidiruv natijalari</div>
    </div>

    <div class="search-title-info" id="searchInfoText"></div>
    <div class="products-grid" id="searchResultsGrid"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const query = (urlParams.get('q') || '').toLowerCase().trim();

        document.getElementById('searchInfoText').textContent = `"${query}" bo'yicha natijalar:`;

        const PRODUCTS = [
            { id: 1, category_id: 1, name: "Qishki issiq qora kurtka", price: "450 000 so'm", oldPrice: "680 000 so'm", discount: "↓ 33%", img: "https://picsum.photos/300/300?random=1" },
            { id: 2, category_id: 1, name: "Sportivniy stilimdagi kurtka", price: "380 000 so'm", oldPrice: "500 000 so'm", discount: "↓ 24%", img: "https://picsum.photos/300/300?random=2" },
            { id: 3, category_id: 2, name: "Uy uchun yumshoq tapichka", price: "45 000 so'm", oldPrice: "80 000 so'm", discount: "↓ 43%", img: "https://picsum.photos/300/300?random=3" },
            { id: 4, category_id: 3, name: "Bahorgi qora shapka", price: "35 000 so'm", oldPrice: "60 000 so'm", discount: "↓ 41%", img: "https://picsum.photos/300/300?random=4" },
            { id: 5, category_id: 4, name: "Ayollar uchun zamonaviy ko'ylak", price: "220 000 so'm", oldPrice: "350 000 so'm", discount: "↓ 37%", img: "https://picsum.photos/300/300?random=5" },
            { id: 6, category_id: 5, name: "Paxtadan tayyorlangan ichki kiyimlar to'plami", price: "90 000 so'm", oldPrice: "150 000 so'm", discount: "↓ 40%", img: "https://picsum.photos/300/300?random=6" }
        ];

        let allProducts = JSON.parse(localStorage.getItem('products')) || PRODUCTS;

        // Saralash: Birinchi aynan mos kelganlar (masalan, "acer klaviatura"), ulardan keyin boshqa o'xshash muqobillar
        let exactMatches = allProducts.filter(p => p.name.toLowerCase().includes(query));
        let alternativeMatches = allProducts.filter(p => !p.name.toLowerCase().includes(query));

        let sortedResults = [...exactMatches, ...alternativeMatches];

        const grid = document.getElementById('searchResultsGrid');
        if (sortedResults.length === 0) {
            grid.innerHTML = `<div style="grid-column: span 2; text-align: center; padding: 40px; color: var(--muted);">Hech qanday mahsulot topilmadi.</div>`;
        } else {
            grid.innerHTML = sortedResults.map(p => `
                <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'">
                    <div class="product-img-box">
                        <img src="${p.img}" alt="${p.name}">
                        <div class="badge-original">✓ ORIGINAL</div>
                    </div>
                    <div class="product-info">
                        <div class="price-row">
                            <span class="main-price">${p.price}</span>
                            <span class="discount-tag">${p.discount}</span>
                        </div>
                        <div class="old-prices">
                            <span class="price-old">${p.oldPrice}</span>
                        </div>
                        <div class="product-title">${p.name}</div>
                        <button class="cart-btn" style="margin-top:8px;">Savatga</button>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
