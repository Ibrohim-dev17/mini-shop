<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahsulotlar - Uzum Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="data.js"></script>
    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
            --star: #ffb800;
            --discount-bg: #f1e5ff;
            --discount-text: #7000ff;
            --danger: #ff3b30;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        /* Telegram header ostida qolib ketmasligi uchun yuqoridan joy tashlaymiz */
        .sticky-header {
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 999;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 1300px;
            margin: 0 auto;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            flex-shrink: 0;
            cursor: pointer;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--text);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 10px;
            padding: 8px 12px;
            gap: 8px;
            border: 1px solid transparent;
            width: 100%;
            transition: border-color 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--primary);
            background: #ffffff;
        }

        .search-box svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 2;
            flex-shrink: 0;
        }

        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            width: 100%;
            color: var(--text);
        }

        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-height: 300px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .search-dropdown.show {
            display: block;
        }

        .search-suggestion-item {
            padding: 12px 14px;
            font-size: 13px;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .search-suggestion-item:hover {
            background: var(--primary-bg);
            color: var(--primary);
        }

        .suggestion-type {
            font-size: 11px;
            color: var(--muted);
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .page-title-bar {
            padding: 20px 16px 10px 16px;
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
            max-width: 1300px;
            margin: 0 auto;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px 16px;
            max-width: 1300px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .products-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
        }
        @media (min-width: 1024px) {
            .products-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
        }
        @media (min-width: 1280px) {
            .products-grid { grid-template-columns: repeat(5, 1fr); }
        }

        .product-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .heart-icon-sm {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .heart-icon-sm svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #1f2026;
            stroke-width: 1.8;
            transition: all 0.2s;
        }

        .heart-icon-sm.liked svg {
            fill: #ff3b30;
            stroke: #ff3b30;
        }

        /* Planshet va kompyuterlarda rasmlar uzunroq (vertikal) ko'rinishi uchun */
        .product-img-box {
            width: 100%;
            height: 230px;
            background: #f8f9fa;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .product-img-box {
                height: 270px;
            }
        }

        .card-slider-container {
            width: 100%;
            height: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .card-slider-container::-webkit-scrollbar { display: none; }

        .card-slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
        }

        .card-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-dots {
            position: absolute;
            bottom: 8px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            z-index: 4;
            pointer-events: none;
        }

        .card-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transition: all 0.2s;
        }

        .card-dot.active {
            width: 14px;
            border-radius: 3px;
            background: #ffffff;
        }

        .badge-dynamic-sm {
            position: absolute;
            bottom: 8px;
            left: 8px;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            z-index: 4;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .product-info {
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            flex: 1;
            cursor: pointer;
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .main-price {
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
        }

        .main-price.out-of-stock {
            color: var(--danger);
            font-size: 14px;
        }

        .discount-tag {
            background: var(--discount-bg);
            color: var(--discount-text);
            font-size: 11px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .old-prices {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .price-old { text-decoration: line-through; }

        .product-title {
            font-size: 13px;
            line-height: 1.3;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 6px;
            height: 34px;
        }

        .product-rating {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--muted);
            margin: 8px 0;
        }

        .rating-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rating-box, .comment-box {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .rating-box svg { width: 13px; height: 13px; fill: var(--star); }
        .comment-box svg { width: 14px; height: 14px; fill: none; stroke: #8b8e99; stroke-width: 2; }
        .rating-num { font-weight: 700; color: var(--text); }

        .last-item-badge {
            display: flex;
            align-items: center;
            gap: 3px;
            color: #ff6b00;
            font-weight: 700;
            font-size: 11px;
            background: #fff3ed;
            padding: 2px 6px;
            border-radius: 6px;
        }
        .last-item-badge svg { width: 12px; height: 12px; fill: #ff6b00; }

        .cart-btn-sm {
            width: 100%;
            height: 36px;
            background: var(--primary-bg);
            color: var(--primary);
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            margin-top: auto;
        }
        .cart-btn-sm svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }

        .notify-btn-sm {
            width: 100%;
            height: 36px;
            background: #f4f5f7;
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            margin-top: auto;
        }
        .notify-btn-sm:hover { border-color: var(--primary); color: var(--primary); }

        .cart-counter-box-sm {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 36px;
            background: var(--bg);
            border-radius: 10px;
            padding: 0 6px;
            margin-top: auto;
            border: 1px solid var(--border);
        }

        .counter-btn-sm {
            background: #fff;
            border: 1px solid var(--border);
            width: 26px;
            height: 26px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .counter-btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }
        .counter-val-sm { font-size: 14px; font-weight: 700; }

        .bottom-nav {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            height: 64px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        @media (min-width: 1024px) { .bottom-nav { max-width: 550px; } }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #808080;
            font-size: 10px;
            font-weight: 500;
            width: 20%;
            position: relative;
            cursor: pointer;
            padding: 8px 0;
        }

        .nav-icon-wrap { position: relative; display: flex; align-items: center; justify-content: center; }
        .nav-item svg { width: 24px; height: 24px; fill: none; stroke: #808080; stroke-width: 1.8; transition: all 0.2s ease; }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-item.active svg { stroke: var(--primary); fill: var(--primary-bg); transform: scale(1.05); }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -8px;
            background: #000;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 17px;
            height: 17px;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        .badge-count.show { display: flex; }
    </style>
</head>
<body>

    <!-- Telegram headeri ostida qolmasligi uchun ustki qism sozlandi -->
    <div class="sticky-header">
        <a href="categories.html" class="back-btn" title="Orqaga">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </a>
        <div class="search-box-wrapper">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Mahsulot nomidan izlash..." onfocus="showSearchHistory()" oninput="handleLiveSearch(event)" onkeypress="handleSearch(event)">
            </div>
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>
    </div>

    <div class="page-title-bar" id="pageTitle">Mahsulotlar</div>
    <div class="products-grid" id="productsGrid"></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
            <span>Bosh sahifa</span>
        </a>
        <a href="categories.html" class="nav-item active">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg></div>
            <span>Katalog</span>
        </a>
        <a href="cart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><div class="badge-count" id="cartBadge">0</div></div>
            <span>Savatcha</span>
        </a>
        <a href="heart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><div class="badge-count" id="favBadge">0</div></div>
            <span>Saralangan</span>
        </a>
        <a href="profil.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
            <span>Profil</span>
        </a>
    </nav>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const catId = urlParams.get('cat_id') || '';
        const subName = urlParams.get('sub') || '';
        const searchQueryParam = urlParams.get('q') || '';

        let favs = JSON.parse(localStorage.getItem('fav_products')) || [];
        let cart = JSON.parse(localStorage.getItem('cart_products')) || [];

        function initPage() {
            if (typeof allProducts === 'undefined' || allProducts.length === 0) {
                setTimeout(initPage, 100);
                return;
            }

            cart = cart.map(item => {
                let liveProd = allProducts.find(p => p.id === item.id);
                let stock = liveProd && liveProd.stock !== undefined ? liveProd.stock : 99;
                if (item.qty > stock) item.qty = stock;
                return item;
            }).filter(item => item.qty > 0);
            localStorage.setItem('cart_products', JSON.stringify(cart));

            let list = [];
            if (searchQueryParam) {
                let q = searchQueryParam.toLowerCase();
                document.getElementById('searchInput').value = searchQueryParam;
                document.getElementById('pageTitle').textContent = `Qidiruv: "${searchQueryParam}"`;
                list = allProducts.filter(p => p.name.toLowerCase().includes(q) || (p.subcat && p.subcat.toLowerCase().includes(q)));
            } else if (subName) {
                let decodedSub = decodeURIComponent(subName).trim().toLowerCase();
                document.getElementById('pageTitle').textContent = decodeURIComponent(subName);
                list = allProducts.filter(p => p.subcat && p.subcat.trim().toLowerCase() === decodedSub);
            } else if (catId) {
                list = allProducts.filter(p => String(p.category_id) === String(catId));
                document.getElementById('pageTitle').textContent = "Bo'lim mahsulotlari";
            } else {
                list = allProducts;
            }

            renderProducts(list);
            updateBadges();
        }

        function renderProducts(list) {
            const grid = document.getElementById('productsGrid');

            if (list.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--muted);">Hech qanday mahsulot topilmadi...</div>`;
                return;
            }

            grid.innerHTML = list.map(p => {
                const isLiked = favs.includes(p.id) ? 'liked' : '';
                const pImages = p.images && p.images.length > 0 ? p.images : ["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80"];
                const hasMultipleImages = pImages.length > 1;
                const loopedImages = hasMultipleImages ? [pImages[pImages.length - 1], ...pImages, pImages[0]] : pImages;
                const defaultSize = p.sizes ? p.sizes[0] : null;
                const cartItem = cart.find(item => item.id === p.id && item.selectedSize === defaultSize);

                let stock = p.stock !== undefined ? p.stock : 10;
                let isOut = stock <= 0;
                let isLast = stock === 1;

                let badgeHtml = '';
                if (p.badgeType === 'original') {
                    badgeHtml = `<div class="badge-dynamic-sm" style="background: #00c853;">✓ ORIGINAL</div>`;
                } else if (p.badgeType === 'chegirma') {
                    badgeHtml = `<div class="badge-dynamic-sm" style="background: #ff3b30;">Chegirmada</div>`;
                } else if (p.badgeType === 'arzonlashdi') {
                    badgeHtml = `<div class="badge-dynamic-sm" style="background: #7000ff;">Arzonlashdi</div>`;
                }

                let priceHtml = '';
                if (isOut) {
                    priceHtml = `<span class="main-price out-of-stock">Qolmadi</span>`;
                } else {
                    priceHtml = `
                        <span class="main-price">${p.price}</span>
                        ${p.badgeType === 'chegirma' || p.badgeType === 'arzonlashdi' ? `<span class="discount-tag">${p.discount}</span>` : ''}
                    `;
                }

                let btnHtml = '';
                if (isOut) {
                    btnHtml = `<button class="notify-btn-sm" onclick="event.stopPropagation(); alert('Mahsulot kelganda sizga xabar beriladi!')">Kelganda xabar qilish</button>`;
                } else if (!cartItem) {
                    btnHtml = `
                        <button class="cart-btn-sm" onclick="event.stopPropagation(); addSimilarToCart(${p.id})">
                            <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                            <span>Savatga</span>
                        </button>
                    `;
                } else {
                    let maxReached = cartItem.qty >= stock;
                    btnHtml = `
                        <div class="cart-counter-box-sm" onclick="event.stopPropagation()">
                            <button class="counter-btn-sm" onclick="changeSimilarQty(${p.id}, -1)">-</button>
                            <span class="counter-val-sm">${cartItem.qty || 1}</span>
                            <button class="counter-btn-sm" onclick="changeSimilarQty(${p.id}, 1)" ${maxReached ? 'disabled' : ''}>+</button>
                        </div>
                    `;
                }

                return `
                    <div class="product-card" id="product-card-${p.id}">
                        <button class="heart-icon-sm ${isLiked}" onclick="toggleHeart(event, ${p.id})">
                            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        </button>
                        <div class="product-img-box" onclick="goToProduct(${p.id})">
                            <div class="card-slider-container" ${hasMultipleImages ? `data-original-length="${pImages.length}" onscroll="handleCardScroll(event, ${pImages.length})"` : ''}>
                                ${loopedImages.map(imgUrl => `
                                    <div class="card-slide"><img src="${imgUrl}" alt="${p.name}"></div>
                                `).join('')}
                            </div>
                            ${hasMultipleImages ? `
                                <div class="card-dots">
                                    ${pImages.map((_, idx) => `<div class="card-dot ${idx === 0 ? 'active' : ''}"></div>`).join('')}
                                </div>
                            ` : ''}
                            ${badgeHtml}
                        </div>
                        <div class="product-info" onclick="goToProduct(${p.id})">
                            <div class="price-row">
                                ${priceHtml}
                            </div>
                            ${!isOut ? `
                                <div class="old-prices">
                                    <span class="price-old">${p.oldPrice}</span>
                                </div>
                            ` : ''}
                            <div class="product-title" title="${p.name}">${p.name}</div>
                            
                            <div class="product-rating">
                                <div class="rating-left">
                                    <div class="rating-box">
                                        <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                                        <span class="rating-num">${p.rating || 4.8}</span>
                                    </div>
                                    <div class="comment-box">
                                        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                                        <span>${p.comments || 50}</span>
                                    </div>
                                </div>
                                ${isLast ? `
                                    <div class="last-item-badge">
                                        <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
                                        <span>Oxirgisi</span>
                                    </div>
                                ` : ''}
                            </div>

                            <div class="card-action-container-${p.id}">
                                ${btnHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            setTimeout(() => {
                document.querySelectorAll('.card-slider-container').forEach(container => {
                    if (container.dataset.originalLength) {
                        const slideWidth = container.clientWidth;
                        container.scrollLeft = slideWidth;
                    }
                });
            }, 50);
        }

        function handleCardScroll(e, originalLen) {
            const container = e.target;
            const slideWidth = container.clientWidth;
            const scrollLeft = container.scrollLeft;
            if (scrollLeft >= (originalLen + 1) * slideWidth - 5) {
                container.style.scrollBehavior = 'auto';
                container.scrollLeft = slideWidth;
                container.style.scrollBehavior = 'smooth';
            } else if (scrollLeft <= 5) {
                container.style.scrollBehavior = 'auto';
                container.scrollLeft = originalLen * slideWidth;
                container.style.scrollBehavior = 'smooth';
            }
            const activeIndex = Math.round(container.scrollLeft / slideWidth) - 1;
            const realIndex = (activeIndex + originalLen) % originalLen;
            const dotsBox = container.parentElement.querySelector('.card-dots');
            if (dotsBox) {
                const dots = dotsBox.children;
                for (let i = 0; i < dots.length; i++) {
                    dots[i].classList.toggle('active', i === realIndex);
                }
            }
        }

        function toggleHeart(e, id) {
            e.stopPropagation();
            if (favs.includes(id)) {
                favs = favs.filter(item => item !== id);
            } else {
                favs.push(id);
            }
            localStorage.setItem('fav_products', JSON.stringify(favs));
            e.currentTarget.classList.toggle('liked', favs.includes(id));
            updateBadges();
        }

        function addSimilarToCart(id) {
            let prod = allProducts.find(p => p.id === id);
            if (prod) {
                let stock = prod.stock !== undefined ? prod.stock : 10;
                let defaultSize = prod.sizes ? prod.sizes[0] : null;
                let cartItem = cart.find(item => item.id === id && item.selectedSize === defaultSize);
                let currentQty = cartItem ? cartItem.qty : 0;

                if (currentQty < stock) {
                    if (!cartItem) {
                        cart.push({ ...prod, selectedSize: defaultSize, qty: 1 });
                    } else {
                        cartItem.qty += 1;
                    }
                    localStorage.setItem('cart_products', JSON.stringify(cart));
                    renderProducts(allProducts);
                    updateBadges();
                } else {
                    alert("Omborda yetarli mahsulot qolmagan!");
                }
            }
        }

        function changeSimilarQty(id, delta) {
            let prod = allProducts.find(p => p.id === id);
            if (!prod) return;
            let stock = prod.stock !== undefined ? prod.stock : 10;
            let defaultSize = prod.sizes ? prod.sizes[0] : null;
            let cartItem = cart.find(item => item.id === id && item.selectedSize === defaultSize);
            
            if (cartItem) {
                let newQty = cartItem.qty + delta;
                if (newQty > stock) {
                    alert("Ombordagi mavjud miqdordan oshira olmaysiz!");
                    return;
                }
                cartItem.qty = newQty;
                if (cartItem.qty <= 0) {
                    cart = cart.filter(item => !(item.id === id && item.selectedSize === defaultSize));
                }
                localStorage.setItem('cart_products', JSON.stringify(cart));
                renderProducts(allProducts);
                updateBadges();
            }
        }

        function updateBadges() {
            const favBadge = document.getElementById('favBadge');
            const cartBadge = document.getElementById('cartBadge');
            let validFavs = favs.filter(id => allProducts.some(p => p.id === id));

            if (validFavs.length > 0) {
                favBadge.textContent = validFavs.length;
                favBadge.classList.add('show');
            } else {
                favBadge.classList.remove('show');
            }

            let totalCartCount = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
            if (totalCartCount > 0) {
                cartBadge.textContent = totalCartCount;
                cartBadge.classList.add('show');
            } else {
                cartBadge.classList.remove('show');
            }
        }

        function goToProduct(id) {
            window.location.href = `product.html?id=${id}`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            initPage();
        });
    </script>
</body>
</html>
