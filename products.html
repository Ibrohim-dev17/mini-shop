    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
            --star: #ffb800;
            --discount-bg: #f1e5ff;
            --discount-text: #7000ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 999;
            padding: 50px 16px 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            flex-shrink: 0;
            cursor: pointer;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 10px;
            padding: 8px 12px;
            gap: 8px;
        }

        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            width: 100%;
            color: var(--text);
        }

        .page-title-bar {
            padding: 14px 16px 0 16px;
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
            max-width: 600px;
            margin: 0 auto;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .product-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .heart-icon-sm {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .heart-icon-sm svg { width: 18px; height: 18px; fill: none; stroke: #1f2026; stroke-width: 1.8; }
        .heart-icon-sm.liked svg { fill: #ff3b30; stroke: #ff3b30; }

        .product-img-box {
            width: 100%;
            height: 210px;
            background: #f8f9fa;
            position: relative;
            cursor: pointer;
        }

        .card-slider-container {
            width: 100%;
            height: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .card-slider-container::-webkit-scrollbar { display: none; }

        .card-slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
        }

        .card-slide img { width: 100%; height: 100%; object-fit: cover; }

        .badge-dynamic-sm {
            position: absolute;
            bottom: 8px;
            left: 8px;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            z-index: 4;
            pointer-events: none;
        }

        .product-info {
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            flex: 1;
            cursor: pointer;
        }

        .price-row { display: flex; align-items: center; gap: 6px; }
        .main-price { font-size: 16px; font-weight: 800; color: var(--text); }
        .discount-tag { background: var(--discount-bg); color: var(--discount-text); font-size: 11px; font-weight: 700; padding: 1px 5px; border-radius: 4px; }
        .old-prices { font-size: 12px; color: var(--muted); text-decoration: line-through; margin-top: 2px; }
        .product-title { font-size: 12px; line-height: 1.3; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 6px; height: 32px; }

        .product-rating {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: var(--muted);
            margin: 6px 0;
        }
        .rating-box { display: flex; align-items: center; gap: 3px; font-weight: 700; color: var(--text); }
        .rating-box svg { width: 13px; height: 13px; fill: var(--star); }

        .cart-btn-sm {
            width: 100%;
            height: 36px;
            background: var(--primary-bg);
            color: var(--primary);
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            margin-top: auto;
        }
        .cart-btn-sm svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }

        .cart-counter-box-sm {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 36px;
            background: var(--bg);
            border-radius: 10px;
            padding: 0 6px;
            margin-top: auto;
            border: 1px solid var(--border);
        }

        .counter-btn-sm {
            background: #fff;
            border: 1px solid var(--border);
            width: 26px;
            height: 26px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter-val-sm { font-size: 14px; font-weight: 700; }

        .bottom-nav {
            position: fixed;
            bottom: calc(40px + env(safe-area-inset-bottom, 0px));
            left: 16px; right: 16px; max-width: 480px; margin: 0 auto; height: 64px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px);
            display: flex; justify-content: space-around; align-items: center; border-radius: 20px; z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #808080; font-size: 10px; font-weight: 500; width: 20%; position: relative; }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-item svg { width: 24px; height: 24px; fill: none; stroke: #808080; stroke-width: 1.8; }
        .nav-item.active svg { stroke: var(--primary); fill: var(--primary-bg); }

        .badge-count {
            position: absolute; top: -4px; right: -8px; background: #000; color: #fff; font-size: 10px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 10px; display: none; align-items: center; justify-content: center; padding: 0 4px;

        .badge-count.show { display: flex; }

        let favs = JSON.parse(localStorage.getItem('fav_products')) || [];
        let cart = JSON.parse(localStorage.getItem('cart_products')) || [];

        function getCategoryProducts() {
            if (subName) {
                let decodedSub = decodeURIComponent(subName).trim().toLowerCase();
                let filtered = PRODUCTS.filter(p => p.subcat && p.subcat.trim().toLowerCase() === decodedSub);
                if (filtered.length > 0) return filtered;
            }
            return PRODUCTS;
        }

        function renderProducts(list) {
            const grid = document.getElementById('productsGrid');
            if (list.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 2; text-align: center; padding: 40px; color: var(--muted);">Bu bo'limda mahsulotlar topilmadi.</div>`;
                return;
            }

            grid.innerHTML = list.map(p => {
                const isLiked = favs.includes(p.id) ? 'liked' : '';
                const defaultSize = p.sizes ? p.sizes[0] : null;
                const cartItem = cart.find(item => item.id === p.id && item.selectedSize === defaultSize);

                let badgeHtml = '';
                if (p.badgeType === 'original') {
                    badgeHtml = `<div class="badge-dynamic-sm" style="background: #00c853;">✓ ORIGINAL</div>`;
                } else if (p.badgeType === 'chegirma') {
                    badgeHtml = `<div class="badge-dynamic-sm" style="background: #ff3b30;">Chegirmada</div>`;
                } else if (p.badgeType === 'arzonlashdi') {
                    badgeHtml = `<div class="badge-dynamic-sm" style="background: #7000ff;">Arzonlashdi</div>`;
                }

                let btnHtml = '';
                if (!cartItem) {
                    btnHtml = `
                        <button class="cart-btn-sm" onclick="event.stopPropagation(); addProductToCart(${p.id})">
                            <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                            <span>Savatga</span>
                        </button>
                    `;
                } else {
                    btnHtml = `
                        <div class="cart-counter-box-sm" onclick="event.stopPropagation()">
                            <button class="counter-btn-sm" onclick="changeProductQty(${p.id}, -1)">-</button>
                            <span class="counter-val-sm">${cartItem.qty || 1}</span>
                            <button class="counter-btn-sm" onclick="changeProductQty(${p.id}, 1)">+</button>
                        </div>
                    `;
                }

                return `
                    <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'">
                        <button class="heart-icon-sm ${isLiked}" onclick="event.stopPropagation(); toggleHeart(${p.id})">
                            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        </button>
                        <div class="product-img-box">
                            <div class="card-slider-container">
                                <div class="card-slide"><img src="${p.images[0]}" alt="${p.name}"></div>
                            </div>
                            ${badgeHtml}
                        </div>
                        <div class="product-info">
                            <div class="price-row">
                                <span class="main-price">${p.price}</span>
                                ${p.badgeType === 'chegirma' || p.badgeType === 'arzonlashdi' ? `<span class="discount-tag">${p.discount}</span>` : ''}
                            </div>
                            <div class="old-prices">${p.oldPrice}</div>
                            <div class="product-title">${p.name}</div>
                            <div class="product-rating">
                                <div class="rating-box">
                                    <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                                    <span>${p.rating}</span>
                                </div>
                                <span style="color: var(--muted);">${p.comments} ta sharh</span>
                            </div>
                            <div id="card-action-${p.id}">
                                ${btnHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleHeart(id) {
            if (favs.includes(id)) favs = favs.filter(i => i !== id);
            else favs.push(id);
            localStorage.setItem('fav_products', JSON.stringify(favs));
            renderProducts(getCategoryProducts());
            updateBadges();
        }

        function updateCardAction(id) {
            const container = document.getElementById(`card-action-${id}`);
            if (!container) return;

            let prod = PRODUCTS.find(p => p.id === id);
            let defaultSize = prod && prod.sizes ? prod.sizes[0] : null;
            let cartItem = cart.find(item => item.id === id && item.selectedSize === defaultSize);

            if (!cartItem) {
                container.innerHTML = `
                    <button class="cart-btn-sm" onclick="event.stopPropagation(); addProductToCart(${id})">
                        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        <span>Savatga</span>
                    </button>
                `;
            } else {
                container.innerHTML = `
                    <div class="cart-counter-box-sm" onclick="event.stopPropagation()">
                        <button class="counter-btn-sm" onclick="changeProductQty(${id}, -1)">-</button>
                        <span class="counter-val-sm">${cartItem.qty || 1}</span>
                        <button class="counter-btn-sm" onclick="changeProductQty(${id}, 1)">+</button>
                    </div>
                `;
            }
        }

        function addProductToCart(id) {
            let prod = PRODUCTS.find(p => p.id === id);
            if (prod) {
                let defaultSize = prod.sizes ? prod.sizes[0] : null;
                let cartItem = cart.find(item => item.id === id && item.selectedSize === defaultSize);
                if (!cartItem) {
                    cart.push({ ...prod, selectedSize: defaultSize, qty: 1 });
                } else {
                    cartItem.qty = (cartItem.qty || 1) + 1;
                }
                localStorage.setItem('cart_products', JSON.stringify(cart));
                updateCardAction(id);
                updateBadges();
            }
        }

        function changeProductQty(id, delta) {
            let prod = PRODUCTS.find(p => p.id === id);
            if (!prod) return;
            let defaultSize = prod.sizes ? prod.sizes[0] : null;
            let cartItem = cart.find(item => item.id === id && item.selectedSize === defaultSize);
            if (cartItem) {
                cartItem.qty = (cartItem.qty || 1) + delta;
                if (cartItem.qty <= 0) {
                    cart = cart.filter(item => !(item.id === id && item.selectedSize === defaultSize));
                }
                localStorage.setItem('cart_products', JSON.stringify(cart));
                updateCardAction(id);
                updateBadges();
            }
        }

        function handleSearchInput(e) {
            const val = e.target.value.trim().toLowerCase();
            const currentList = getCategoryProducts();
            if (!val) {
                renderProducts(currentList);
                return;
            }
            const filtered = currentList.filter(p => p.name.toLowerCase().includes(val));
            renderProducts(filtered);
        }

        function updateBadges() {
            const favBadge = document.getElementById('favBadge');
            const cartBadge = document.getElementById('cartBadge');

            if (favs.length > 0) {
                favBadge.textContent = favs.length;
                favBadge.classList.add('show');
            } else {
                favBadge.classList.remove('show');
            }

            let totalCartCount = cart.reduce((sum, item) => sum + (item.qty || 1), 0
