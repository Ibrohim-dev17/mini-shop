<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahsulotlar - Uzum Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
            --star: #ffb800;
            --discount-bg: #f1e5ff;
            --discount-text: #7000ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            background: #ffffff;
            z-index: 999;
            padding: 50px 16px 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            flex-shrink: 0;
            cursor: pointer;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 10px;
            padding: 8px 12px;
        }

        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            width: 100%;
            color: var(--text);
        }

        .page-title-bar {
            padding: 14px 16px 0 16px;
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
            max-width: 600px;
            margin: 0 auto;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .product-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .heart-icon-sm {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }

        .heart-icon-sm svg { width: 18px; height: 18px; fill: none; stroke: #1f2026; stroke-width: 1.8; }
        .heart-icon-sm.liked svg { fill: #ff3b30; stroke: #ff3b30; }

        .product-img-box {
            width: 100%;
            height: 210px;
            background: #f8f9fa;
            position: relative;
            cursor: pointer;
        }

        .card-slider-container {
            width: 100%;
            height: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .card-slider-container::-webkit-scrollbar { display: none; }

        .card-slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
        }

        .card-slide img { width: 100%; height: 100%; object-fit: cover; }

        .product-info {
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            flex: 1;
            cursor: pointer;
        }

        .main-price { font-size: 16px; font-weight: 800; color: var(--text); }
        .product-title { font-size: 12px; line-height: 1.3; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 6px; height: 32px; }

        .cart-btn-sm {
            width: 100%;
            height: 36px;
            background: var(--primary-bg);
            color: var(--primary);
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            margin-top: auto;
        }

        .bottom-nav {
            position: fixed;
            bottom: calc(40px + env(safe-area-inset-bottom, 0px));
            left: 16px; right: 16px; max-width: 480px; margin: 0 auto; height: 64px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px);
            display: flex; justify-content: space-around; align-items: center; border-radius: 20px; z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #808080; font-size: 10px; font-weight: 500; width: 20%; }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-item svg { width: 24px; height: 24px; fill: none; stroke: #808080; stroke-width: 1.8; }
        .nav-item.active svg { stroke: var(--primary); fill: var(--primary-bg); }
    </style>
</head>
<body>

    <div class="sticky-header">
        <a href="categories.html" class="back-btn" title="Orqaga">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </a>
        <div class="search-box-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Mahsulot nomidan izlash...">
            </div>
        </div>
    </div>

    <div class="page-title-bar" id="pageTitle">Mahsulotlar</div>
    <div class="products-grid" id="productsGrid"></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Bosh sahifa</span>
        </a>
        <a href="categories.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
            <span>Katalog</span>
        </a>
        <a href="cart.html" class="nav-item"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><span>Savatcha</span></a>
        <a href="heart.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><span>Saralangan</span></a>
        <a href="profil.html" class="nav-item"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Profil</span></a>
    </nav>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const subName = urlParams.get('sub') || '';

        if (subName) {
            document.getElementById('pageTitle').textContent = decodeURIComponent(subName);
        }

        const PRODUCTS = [
            // Ko'ylaklar (6 ta)
            { id: 101, subcat: "Ko'ylaklar", name: "Ayollar uchun zamonaviy oq ko'ylak", price: "220 000 so'm", oldPrice: "350 000 so'm", images: ["https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=600&auto=format&fit=crop&q=80"] },
            { id: 102, subcat: "Ko'ylaklar", name: "Kechki qora libos", price: "450 000 so'm", oldPrice: "650 000 so'm", images: ["https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=600&auto=format&fit=crop&q=80"] },
            { id: 103, subcat: "Ko'ylaklar", name: "Yozgi yengil gulli ko'ylak", price: "180 000 so'm", oldPrice: "280 000 so'm", images: ["https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=600&auto=format&fit=crop&q=80"] },
            { id: 104, subcat: "Ko'ylaklar", name: "Klassik ishbilarmon ko'ylak", price: "310 000 so'm", oldPrice: "450 000 so'm", images: ["https://images.unsplash.com/photo-1496747611176-843222e1e57c?w=600&auto=format&fit=crop&q=80"] },
            { id: 105, subcat: "Ko'ylaklar", name: "Qizil tantanali ko'ylak", price: "520 000 so'm", oldPrice: "750 000 so'm", images: ["https://images.unsplash.com/photo-1566174053879-31528523f8ae?w=600&auto=format&fit=crop&q=80"] },
            { id: 106, subcat: "Ko'ylaklar", name: "Trikotaj kundalik ko'ylak", price: "195 000 so'm", oldPrice: "300 000 so'm", images: ["https://images.unsplash.com/photo-1612336307429-8a898d10e223?w=600&auto=format&fit=crop&q=80"] },

            // Sumkalar (6 ta)
            { id: 201, subcat: "Sumkalar", name: "Ayollar uchun elegante charm sumka", price: "280 000 so'm", oldPrice: "400 000 so'm", images: ["https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=600&auto=format&fit=crop&q=80"] },
            { id: 202, subcat: "Sumkalar", name: "Kichik yelka sumkasi (Clutch)", price: "190 000 so'm", oldPrice: "290 000 so'm", images: ["https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=600&auto=format&fit=crop&q=80"] },
            { id: 203, subcat: "Sumkalar", name: "Kundalik shopper sumka", price: "220 000 so'm", oldPrice: "350 000 so'm", images: ["https://images.unsplash.com/photo-1590874103328-eac38a683ce7?w=600&auto=format&fit=crop&q=80"] },
            { id: 204, subcat: "Sumkalar", name: "Sport uslubidagi ruksak-sumka", price: "310 000 so'm", oldPrice: "450 000 so'm", images: ["https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=600&auto=format&fit=crop&q=80"] },
            { id: 205, subcat: "Sumkalar", name: "Klassik qora ish sumkasi", price: "380 000 so'm", oldPrice: "520 000 so'm", images: ["https://images.unsplash.com/photo-1594223274512-ad4803739ffc?w=600&auto=format&fit=crop&q=80"] },
            { id: 206, subcat: "Sumkalar", name: "Brendoviy zanjirli sumka", price: "410 000 so'm", oldPrice: "600 000 so'm", images: ["https://images.unsplash.com/photo-1566150905458-1bf1fc113f0d?w=600&auto=format&fit=crop&q=80"] },

            // Ko'zoynaklar (6 ta)
            { id: 301, subcat: "Ko'zoynaklar", name: "Quyoshdan saqlovchi qora ko'zoynak", price: "120 000 so'm", oldPrice: "200 000 so'm", images: ["https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=600&auto=format&fit=crop&q=80"] },
            { id: 302, subcat: "Ko'zoynaklar", name: "Kvadrat shakldagi imidj ko'zoynagi", price: "95 000 so'm", oldPrice: "160 000 so'm", images: ["https://images.unsplash.com/photo-1508296695146-257a814070b4?w=600&auto=format&fit=crop&q=80"] },
            { id: 303, subcat: "Ko'zoynaklar", name: "Aviator uslubidagi quyosh ko'zoynagi", price: "150 000 so'm", oldPrice: "250 000 so'm", images: ["https://images.unsplash.com/photo-1574345920610-0935568f677d?w=600&auto=format&fit=crop&q=80"] },
            { id: 304, subcat: "Ko'zoynaklar", name: "Dumaloq dizaynli retro ko'zoynak", price: "110 000 so'm", oldPrice: "190 000 so'm", images: ["https://images.unsplash.com/photo-1577803645773-f96470509666?w=600&auto=format&fit=crop&q=80"] },
            { id: 305, subcat: "Ko'zoynaklar", name: "Sportivniy velosipedchi ko'zoynagi", price: "175 000 so'm", oldPrice: "280 000 so'm", images: ["https://images.unsplash.com/photo-1509695507497-903c140c49b0?w=600&auto=format&fit=crop&q=80"] },
            { id: 306, subcat: "Ko'zoynaklar", name: "Kompyuter uchun nurlar himoyali", price: "135 000 so'm", oldPrice: "220 000 so'm", images: ["https://images.unsplash.com/photo-1591076482161-42ce6da69f67?w=600&auto=format&fit=crop&q=80"] }
        ];

        let favs = JSON.parse(localStorage.getItem('fav_products')) || [];
        let cart = JSON.parse(localStorage.getItem('cart_products')) || [];

        function getCategoryProducts() {
            if (subName) {
                let decodedSub = decodeURIComponent(subName).trim().toLowerCase();
                let filtered = PRODUCTS.filter(p => p.subcat && p.subcat.trim().toLowerCase() === decodedSub);
                if (filtered.length > 0) return filtered;
            }
            return PRODUCTS;
        }

        function renderProducts(list) {
            const grid = document.getElementById('productsGrid');
            if (list.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 2; text-align: center; padding: 40px; color: var(--muted);">Bu bo'limda mahsulotlar topilmadi.</div>`;
                return;
            }

            grid.innerHTML = list.map(p => {
                const isLiked = favs.includes(p.id) ? 'liked' : '';
                return `
                    <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'">
                        <button class="heart-icon-sm ${isLiked}" onclick="event.stopPropagation(); toggleHeart(${p.id})">
                            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        </button>
                        <div class="product-img-box">
                            <div class="card-slider-container">
                                <div class="card-slide"><img src="${p.images[0]}" alt="${p.name}"></div>
                            </div>
                        </div>
                        <div class="product-info">
                            <div class="main-price">${p.price}</div>
                            <div class="product-title">${p.name}</div>
                            <button class="cart-btn-sm" onclick="event.stopPropagation(); addToCart(${p.id})">Savatga</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleHeart(id) {
            if (favs.includes(id)) favs = favs.filter(i => i !== id);
            else favs.push(id);
            localStorage.setItem('fav_products', JSON.stringify(favs));
            renderProducts(getCategoryProducts());
        }

        function addToCart(id) {
            let prod = PRODUCTS.find(p => p.id === id);
            if (prod) {
                cart.push({ ...prod, qty: 1 });
                localStorage.setItem('cart_products', JSON.stringify(cart));
                alert("Savatga qo'shildi!");
            }
        }

        renderProducts(getCategoryProducts());
    </script>
</body>
</html>
