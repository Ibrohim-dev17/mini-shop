<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mahsulot tafsilotlari</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="data.js"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: system-ui, -apple-system, sans-serif;
  background: #f5f6fa;
  color: #111;
}

a { text-decoration: none; color: inherit; }
* { box-sizing: border-box; }

.main-content {
  height: calc(100vh - 65px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
  padding-bottom: 30px;
}

/* HEADER */
.header {
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(10px);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #eee;
  position: sticky;
  top: 0;
  z-index: 10;
}

.back-btn {
  background: #f2f2f2;
  color: #333;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  cursor: pointer;
  transition: background 0.2s;
}
.back-btn:active { background: #e0e0e0; }

/* PRODUCT CONTAINER */
.product-container {
  margin: 12px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* RASM BLOKI VA LIGHTBOX */
.image-box {
  background: white;
  border-radius: 20px;
  padding: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  cursor: zoom-in;
}

.image-box img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* YURAKCHA */
.heart {
  position: absolute;
  top: 15px;
  right: 15px;
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 20px;
  color: #b0b0b5;
  z-index: 5;
  background: rgba(255,255,255,0.8);
  border-radius: 50%;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  transition: transform 0.2s ease, color 0.2s ease;
}
.heart:active { transform: scale(1.2); }
.heart.active { color: #ff3b30; }

/* LIGHTBOX MODAL */
.lightbox-modal {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.9);
  z-index: 4000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.lightbox-modal.open { display: flex; }
.lightbox-content {
  position: relative;
  max-width: 100%;
  max-height: 100%;
}
.lightbox-content img {
  width: 100%;
  height: auto;
  max-height: 85vh;
  object-fit: contain;
  border-radius: 12px;
}
.lightbox-close {
  position: absolute;
  top: -40px;
  right: 0;
  background: none;
  border: none;
  color: white;
  font-size: 24px;
  cursor: pointer;
}

/* DETAILS CARD */
.details-box {
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
}

.name {
  font-size: 20px;
  font-weight: 700;
  margin: 0 0 8px 0;
  line-height: 1.3;
}

.price-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 12px;
}

.price {
  color: #111;
  font-weight: 700;
  font-size: 22px;
}

.old-price {
  font-size: 14px;
  color: #888;
  text-decoration: line-through;
}

/* REYTING */
.rating-container {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
  font-size: 13px;
  color: #555;
}
.stars { color: #ffb800; font-size: 14px; }

/* PARAMETRLAR / ATRIBUTLAR (Rang, Brend, O'lcham, Material va h.k.) */
.attributes-section {
  margin-bottom: 16px;
  border-top: 1px solid #f0f0f0;
  padding-top: 12px;
}
.attr-group {
  margin-bottom: 10px;
}
.attr-title {
  font-size: 13px;
  color: #888;
  margin-bottom: 6px;
}
.attr-values {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.attr-chip {
  padding: 6px 12px;
  border-radius: 10px;
  background: #f5f6fa;
  font-size: 13px;
  font-weight: 500;
  color: #333;
  border: 1px solid transparent;
  cursor: pointer;
}
.attr-chip.selected {
  background: #efeafb;
  color: #6a5acd;
  border-color: #6a5acd;
}

/* TAFSILOT (DESC) */
.section-title {
  font-size: 15px;
  font-weight: 700;
  color: #111;
  margin: 16px 0 6px 0;
}

.desc {
  font-size: 14px;
  color: #555;
  line-height: 1.5;
  margin-bottom: 20px;
}

/* COUNTER VA ACTIONS */
.purchase-box {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
}

.counter {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #f1f2f6;
  padding: 4px;
  border-radius: 14px;
  width: 110px;
  height: 46px;
  flex-shrink: 0;
}

.counter button {
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 10px;
  background: white;
  color: #111;
  font-size: 16px;
  font-weight: 600;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  cursor: pointer;
}

#counter {
  font-size: 15px;
  font-weight: 700;
}

.add-btn {
  background: #efeafb;
  color: #6a5acd;
  border: none;
  height: 46px;
  border-radius: 14px;
  flex-grow: 1;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background 0.2s;
}
.add-btn:active { background: #6a5acd; color: white; }

.buy-now-btn {
  background: #6a5acd;
  color: white;
  border: none;
  height: 46px;
  border-radius: 14px;
  width: 100%;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s;
}
.buy-now-btn:active { opacity: 0.9; }

/* SHARHLAR BO'LIMI (REVIEWS) */
.reviews-section {
  background: white;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.03);
  margin-top: 12px;
}

.reviews-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.reviews-container {
  max-height: 280px; /* Sharhlar ko'payib ketsa kichraytirib scroll qiladigan qism */
  overflow-y: auto;
  padding-right: 4px;
}

.review-item {
  padding: 12px 0;
  border-bottom: 1px solid #f5f5f5;
}
.review-item:last-child { border-bottom: none; }

.review-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.review-author {
  font-weight: 600;
  font-size: 13px;
  color: #333;
}
.review-date {
  font-size: 11px;
  color: #888;
}
.review-stars {
  color: #ffb800;
  font-size: 11px;
  margin-bottom: 4px;
}
.review-text {
  font-size: 13px;
  color: #555;
  line-height: 1.4;
}

.all-reviews-link {
  display: block;
  text-align: center;
  padding: 10px;
  margin-top: 10px;
  background: #f5f6fa;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  color: #6a5acd;
  cursor: pointer;
}

/* SHARH YOZISH FORMASI */
.add-review-box {
  margin-top: 16px;
  background: #f9f9fb;
  padding: 14px;
  border-radius: 14px;
}

.add-review-box textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid #e0e0e0;
  border-radius: 10px;
  font-size: 13px;
  outline: none;
  background: #fff;
  margin-bottom: 10px;
  font-family: inherit;
}

.review-options-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}

/* TAKOMILLASHTIRILGAN YULDUZCHA TANLASH (HAR BIRI ALOHIDA BOSILADI) */
.star-select {
  display: flex;
  gap: 6px;
  cursor: pointer;
  font-size: 18px;
  color: #ddd;
}
.star-select i.active-star { color: #ffb800; }

/* ZAMONAVIY SWITCH (ANONIM UCHUN) */
.switch-container {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #555;
  cursor: pointer;
  user-select: none;
}
.switch {
  position: relative;
  display: inline-block;
  width: 36px;
  height: 20px;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider-switch {
  position: absolute; cursor: pointer;
  top: 0; left: 0; right: 0; bottom: 0;
  background-color: #ccc;
  transition: .3s;
  border-radius: 20px;
}
.slider-switch:before {
  position: absolute; content: "";
  height: 16px; width: 16px;
  left: 2px; bottom: 2px;
  background-color: white;
  transition: .3s;
  border-radius: 50%;
}
input:checked + .slider-switch { background-color: #6a5acd; }
input:checked + .slider-switch:before { transform: translateX(16px); }

.submit-review-btn {
  background: #111;
  color: white;
  border: none;
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

/* TOAST */
.toast {
  position: fixed; top: -60px; left: 50%; transform: translateX(-50%);
  background: rgba(0, 0, 0, 0.85); color: white; padding: 10px 24px;
  border-radius: 50px; font-size: 14px; font-weight: 500; z-index: 2000;
  transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.toast.show { top: 20px; }

/* BOTTOM NAV */
.bottom {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 65px;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  display: flex;
  justify-content: space-around;
  align-items: center;
  border-top: 1px solid rgba(0, 0, 0, 0.04);
  box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.03);
  z-index: 1000;
  padding: 0 10px;
}

.bottom a {
  color: #b0b0b5;
  font-size: 20px;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 45px;
  height: 45px;
  border-radius: 14px;
  position: relative;
}

.bottom a.active {
  color: #6a5acd;
  background: rgba(106, 90, 205, 0.08);
  transform: translateY(-2px);
}
.bottom a:active { transform: scale(0.85); }

.badge {
  display: none;
  position: absolute;
  top: 4px; right: 4px;
  background: #111111 !important;
  color: #ffffff !important;
  font-size: 10px;
  font-weight: 700;
  border-radius: 50%;
  width: 17px; height: 17px;
  align-items: center; justify-content: center;
  border: 1px solid #fff;
}
</style>
</head>

<body>

<div id="toast" class="toast">Savatga qo‘shildi!</div>

<!-- LIGHTBOX MODAL (RASMNI KATTA KO'RISH UCHUN) -->
<div class="lightbox-modal" id="lightboxModal" onclick="closeLightbox()">
  <div class="lightbox-content">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img id="lightboxImg" src="">
  </div>
</div>

<div class="main-content">
  <div class="header">
    <div onclick="goBack()" class="back-btn"><i class="fa-solid fa-arrow-left"></i></div>
    <div style="font-weight: 600; font-size: 15px;">Mahsulot tafsilotlari</div>
    <div style="width: 38px;"></div>
  </div>

  <div class="product-container">
    <!-- RASM BLOKI -->
    <div class="image-box" onclick="openLightbox()">
      <div class="heart" id="favBtn" onclick="toggleFav(event)">
        <i class="fa-regular fa-heart"></i>
      </div>
      <img id="pImg" src="">
    </div>

    <!-- ASOSIY MA'LUMOTLAR -->
    <div class="details-box">
      <div class="name" id="pName"></div>
      
      <div class="price-row">
        <span class="price" id="pPrice"></span>
        <span class="old-price" id="pOldPrice"></span>
      </div>

      <div class="rating-container">
        <div class="stars" id="pStars"></div>
        <span id="pReviewsCount"></span>
      </div>

      <!-- KENGAYTIRILGAN PARAMETRLAR (Rang, Brend, O'lcham, Material va h.k.) -->
      <div class="attributes-section" id="attributesSection" style="display: none;">
        <div id="attrContainer"></div>
      </div>

      <div class="section-title">Mahsulot haqida</div>
      <div class="desc" id="pDesc"></div>

      <!-- COUNTER VA SAVATGA QO'SHISH -->
      <div class="purchase-box">
        <div class="counter">
          <button onclick="minus()">-</button>
          <span id="counter">1</span>
          <button onclick="plus()">+</button>
        </div>
        <button class="add-btn" onclick="addToCart()">
          <i class="fa-solid fa-basket-shopping"></i> Savatga
        </button>
      </div>

      <!-- HOZIR SOTIB OLISH (CART.HTML GA O'TISH) -->
      <button class="buy-now-btn" onclick="buyNow()">Hozir sotib olish</button>
    </div>

    <!-- SHARHLAR VA IZOHLAR BO'LIMI -->
    <div class="reviews-section">
      <div class="reviews-header">
        <div class="section-title" style="margin:0;">Sharhlar</div>
        <span id="reviewCountBadge" style="font-size: 13px; color: #888; font-weight: 500;">0 ta</span>
      </div>

      <!-- SHARHLAR KICHRAYTIRILGAN SCROLL BO'LIMI -->
      <div class="reviews-container" id="reviewsContainer">
        <div id="reviewsList"></div>
      </div>
      
      <!-- BARCHA SHARHLARNI KO'RISH TUGMASI (Agar ko'p bo'lsa chiqadi) -->
      <div id="allReviewsBtnWrapper"></div>

      <!-- SHARH YOZISH -->
      <div class="add-review-box">
        <div style="font-size: 13px; font-weight: 600; margin-bottom: 8px; color: #333;">Sharh qoldirish</div>
        
        <textarea id="reviewText" rows="3" placeholder="Mahsulot haqida fikringizni yozing..."></textarea>
        
        <div class="review-options-row">
          <!-- OSON YULDUZCHA TANLASH -->
          <div class="star-select" id="starSelect">
            <i class="fa-solid fa-star active-star" onclick="setRating(1)"></i>
            <i class="fa-solid fa-star active-star" onclick="setRating(2)"></i>
            <i class="fa-solid fa-star active-star" onclick="setRating(3)"></i>
            <i class="fa-solid fa-star active-star" onclick="setRating(4)"></i>
            <i class="fa-solid fa-star active-star" onclick="setRating(5)"></i>
          </div>

          <!-- BOSHQACHA JOYLASHTIRILGAN ANONIM SWITCH -->
          <label class="switch-container">
            <span>Anonim</span>
            <div class="switch">
              <input type="checkbox" id="isAnonymous" checked>
              <span class="slider-switch"></span>
            </div>
          </label>
        </div>

        <button class="submit-review-btn" onclick="submitReview()">Sharhni yuborish</button>
      </div>
    </div>
  </div>
</div>

<!-- PASTKI MENYU -->
<div class="bottom">
  <a href="favorites.html" id="navFav">
    <i class="fa-solid fa-heart"></i>
    <span id="favBadge" class="badge">0</span>
  </a>
  <a href="cart.html" id="navCart">
    <i class="fa-solid fa-basket-shopping"></i>
    <span id="cartBadge" class="badge">0</span>
  </a>
  <a href="index.html" id="navHome">
    <i class="fa-solid fa-house"></i>
  </a>
  <a href="categories.html" id="navCat">
    <i class="fa-solid fa-magnifying-glass"></i>
  </a>
  <a href="profile.html" id="navProfile">
    <i class="fa-solid fa-user"></i>
  </a>
</div>

<script>
let userName = "Foydalanuvchi";
if (window.Telegram && Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  if (typeof Telegram.WebApp.disableVerticalSwipes === 'function') {
    Telegram.WebApp.disableVerticalSwipes();
  }
  // Telegram foydalanuvchi nomini avtomatik olish
  if (Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user) {
    let tgUser = Telegram.WebApp.initDataUnsafe.user;
    userName = tgUser.first_name + (tgUser.last_name ? " " + tgUser.last_name : "");
  }
}

const urlParams = new URLSearchParams(window.location.search);
const id = urlParams.get("id");
const cat = urlParams.get("cat");
const from = urlParams.get("from");

const product = allProducts.find(p => String(p.id) === String(id));
let favs = JSON.parse(localStorage.getItem("favs")) || [];
const favBtn = document.getElementById("favBtn");
const icon = favBtn.querySelector("i");

let selectedRating = 5;
let currentSelectedAttributes = {};

if (product) {
  document.getElementById("pName").innerText = product.name;
  document.getElementById("pPrice").innerText = product.price.toLocaleString() + " so'm";
  document.getElementById("pOldPrice").innerText = Math.round(product.price * 1.35).toLocaleString() + " so'm";
  document.getElementById("pImg").src = product.img;
  document.getElementById("pDesc").innerText = product.desc || "Sifatli va qulay oshxona buyumi.";

  let ratingVal = product.rating || 4.8;
  let reviewsCountVal = product.reviewsCount || 128;
  let fullStars = Math.round(ratingVal);
  document.getElementById("pStars").innerHTML = Array(5).fill(0).map((_, i) => 
    `<i class="${i < fullStars ? 'fa-solid' : 'fa-regular'} fa-star"></i>`
  ).join('');
  document.getElementById("pReviewsCount").innerText = `${ratingVal} (${reviewsCountVal} ta sharh)`;

  setupAttributes(product);

  if (favs.includes(product.id)) {
    favBtn.classList.add("active");
    icon.className = "fa-solid fa-heart";
  }
}

/* KENGAYTIRILGAN PARAMETRLAR (Rang, Brend, O'lcham, Material va h.k.) */
function setupAttributes(p) {
  const attrSection = document.getElementById("attributesSection");
  const attrContainer = document.getElementById("attrContainer");
  
  let attributes = p.attributes || {
    "Rang": ["Qora", "Kumush", "Qizil", "Oq"],
    "Brend": [p.brand || "KitchenLux", "Tefal", "Delimano"],
    "O'lcham": ["Standard", "Katta", "Kichik"],
    "Material": ["Zanglamaydigan po'lat", "Alyuminiy", "Plastik"]
  };

  if (Object.keys(attributes).length > 0) {
    attrSection.style.display = "block";
    attrContainer.innerHTML = "";
    
    for (let [key, values] of Object.entries(attributes)) {
      currentSelectedAttributes[key] = values[0]; 
      
      let html = `<div class="attr-group">
        <div class="attr-title">${key}: <b style="color:#111;" id="selected_${key}">${values[0]}</b></div>
        <div class="attr-values">`;
      
      values.forEach((val, idx) => {
        html += `<div class="attr-chip ${idx === 0 ? 'selected' : ''}" onclick="selectAttr(this, '${key}', '${val}')">${val}</div>`;
      });
      
      html += `</div></div>`;
      attrContainer.innerHTML += html;
    }
  }
}

function selectAttr(el, key, val) {
  currentSelectedAttributes[key] = val;
  document.getElementById(`selected_${key}`).innerText = val;
  let parent = el.parentElement;
  parent.querySelectorAll('.attr-chip').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}

/* LIGHTBOX (KATTA RASM) */
function openLightbox() {
  if(!product) return;
  document.getElementById("lightboxImg").src = product.img;
  document.getElementById("lightboxModal").classList.add("open");
}
function closeLightbox() {
  document.getElementById("lightboxModal").classList.remove("open");
}

/* COUNTER */
let count = 1;
function plus() { count++; document.getElementById("counter").innerText = count; }
function minus() { if (count > 1) { count--; document.getElementById("counter").innerText = count; } }

/* BADGELARNI YANGILASH */
function updateBottomBadges() {
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  let totalCartQty = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
  let cartBadge = document.getElementById("cartBadge");
  if (cartBadge) {
    cartBadge.innerText = totalCartQty;
    cartBadge.style.display = totalCartQty > 0 ? "flex" : "none";
  }

  let currentFavs = JSON.parse(localStorage.getItem("favs")) || [];
  let favBadge = document.getElementById("favBadge");
  if (favBadge) {
    favBadge.innerText = currentFavs.length;
    favBadge.style.display = currentFavs.length > 0 ? "flex" : "none";
  }
}
document.addEventListener("DOMContentLoaded", updateBottomBadges);
window.addEventListener("pageshow", updateBottomBadges);
updateBottomBadges();

/* SAVATGA QO'SHISH */
function addToCart() {
  if (!product) return;
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  
  let attrString = Object.entries(currentSelectedAttributes).map(([k,v]) => `${k}: ${v}`).join(', ');
  let cartItemId = `${product.id}_${attrString}`;

  let existing = cart.find(item => item.cartItemId === cartItemId);
  if (existing) {
    existing.qty += count;
  } else {
    cart.push({
      cartItemId: cartItemId,
      id: product.id,
      name: product.name + (attrString ? ` (${attrString})` : ''),
      price: product.price,
      img: product.img,
      qty: count,
      attributes: currentSelectedAttributes
    });
  }

  localStorage.setItem("cart", JSON.stringify(cart));
  updateBottomBadges();

  const toast = document.getElementById("toast");
  toast.classList.add("show");
  setTimeout(() => { toast.classList.remove("show"); }, 1500);
}

/* HOZIR SOTIB OLISH (SAVATGA QO'SHIB TO'G'RIDAN-TO'G'RI CART.HTML GA O'TISH) */
function buyNow() {
  addToCart();
  window.location.href = "cart.html";
}

/* YURAKCHA TOGGLE */
function toggleFav(e) {
  e.preventDefault();
  e.stopPropagation();
  if (!product) return;

  if (favs.includes(product.id)) {
    favs = favs.filter(x => x !== product.id);
    favBtn.classList.remove("active");
    icon.className = "fa-regular fa-heart";
  } else {
    favs.push(product.id);
    favBtn.classList.add("active");
    icon.className = "fa-solid fa-heart";
  }
  localStorage.setItem("favs", JSON.stringify(favs));
  updateBottomBadges();
}

/* SHARHLAR TIZIMI */
function loadReviews() {
  if (!product) return;
  let allReviews = JSON.parse(localStorage.getItem(`reviews_${product.id}`)) || [
    { name: "Jasurbek", text: "Mahsulot juda yoqdi, sifati a'lo darajada!", rating: 5, date: "12 Avgust, 2026" },
    { name: "Anonim", text: "Tez yetkazib berishdi, rahmat.", rating: 4, date: "10 Avgust, 2026" },
    { name: "Sardor", text: "Narxiga nisbatan juda yaxshi ekan.", rating: 5, date: "8 Avgust, 2026" }
  ];

  const list = document.getElementById("reviewsList");
  const container = document.getElementById("reviewsContainer");
  const btnWrapper = document.getElementById("allReviewsBtnWrapper");
  
  document.getElementById("reviewCountBadge").innerText = `${allReviews.length} ta`;
  
  list.innerHTML = "";
  allReviews.forEach(r => {
    let starsHtml = Array(5).fill(0).map((_, i) => `<i class="${i < r.rating ? 'fa-solid' : 'fa-regular'} fa-star"></i>`).join('');
    list.innerHTML += `
      <div class="review-item">
        <div class="review-top">
          <span class="review-author">${r.name}</span>
          <span class="review-date">${r.date}</span>
        </div>
        <div class="review-stars">${starsHtml}</div>
        <div class="review-text">${r.text}</div>
      </div>`;
  });

  // Agar sharhlar ko'p bo'lsa (masalan 2 tadan ko'p), konteynerni kichraytirib scroll qilamiz va "Barcha sharhlarni o'qish" tugmasini chiqaramiz
  if (allReviews.length > 2) {
    container.style.maxHeight = "200px";
    btnWrapper.innerHTML = `<div class="all-reviews-link" onclick="expandReviews()">Barcha sharhlarni o'qish (${allReviews.length} ta)</div>`;
  } else {
    container.style.maxHeight = "none";
    btnWrapper.innerHTML = "";
  }
}

function expandReviews() {
  const container = document.getElementById("reviewsContainer");
  container.style.maxHeight = "none";
  document.getElementById("allReviewsBtnWrapper").innerHTML = "";
}

/* ANIQ VA OSON YULDUZCHA TANLASH */
function setRating(val) {
  selectedRating = val;
  const stars = document.querySelectorAll("#starSelect i");
  stars.forEach((s, idx) => {
    if (idx < val) {
      s.classList.add("active-star");
      s.className = "fa-solid fa-star active-star";
    } else {
      s.classList.remove("active-star");
      s.className = "fa-regular fa-star";
    }
  });
}

function submitReview() {
  let text = document.getElementById("reviewText").value.trim();
  let isAnon = document.getElementById("isAnonymous").checked;

  if (!text) {
    alert("Iltimos, sharh matnini kiriting!");
    return;
  }

  // Ism avtomatik belgilanadi: agar anonim yoniq bo'lsa "Anonim", aks holda Telegramdagi foydalanuvchi ismi
  let authorName = isAnon ? "Anonim" : userName;

  let newReview = {
    name: authorName,
    text: text,
    rating: selectedRating,
    date: new Date().toLocaleDateString('uz-UZ', { month: 'long', day: 'numeric', year: 'numeric' })
  };

  let allReviews = JSON.parse(localStorage.getItem(`reviews_${product.id}`)) || [];
  allReviews.unshift(newReview);
  localStorage.setItem(`reviews_${product.id}`, JSON.stringify(allReviews));

  document.getElementById("reviewText").value = "";
  setRating(5);
  document.getElementById("isAnonymous").checked = true;
  
  loadReviews();
  
  const toast = document.getElementById("toast");
  toast.innerText = "Sharhingiz muvaffaqiyatli qo'shildi!";
  toast.classList.add("show");
  setTimeout(() => { toast.classList.remove("show"); toast.innerText = "Savatga qo‘shildi!"; }, 1500);
}

loadReviews();

/* ORQAGA QAYTISH */
function goBack() {
  if (from === "banner") {
    window.location.href = "index.html";
  } else if (from === "categories" || from === "index") {
    window.location.href = `products.html?cat=${cat || product.category}&from=${from}`;
  } else {
    window.history.back();
  }
}
</script>
