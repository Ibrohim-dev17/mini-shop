<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahsulot tavsiloti - Uzum Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
            --star: #ffb800;
            --discount-bg: #f1e5ff;
            --discount-text: #7000ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 160px;
            overflow-x: hidden;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            z-index: 999;
            padding: 44px 16px 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .icon-btn {
            background: none;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #f4f5f7;
            color: var(--text);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .icon-btn.liked svg {
            fill: #ff3b30;
            stroke: #ff3b30;
        }

        .product-img-wrapper {
            position: sticky;
            top: 94px;
            z-index: 10;
            background: #ffffff;
            width: 100%;
            height: 360px;
            border-bottom: 1px solid var(--border);
        }

        .product-img-box {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .card-slider-container {
            width: 100%;
            height: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .card-slider-container::-webkit-scrollbar {
            display: none;
        }

        .card-slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
        }

        .card-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-dots {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 6px;
            z-index: 4;
            pointer-events: none;
        }

        .card-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transition: all 0.2s;
        }

        .card-dot.active {
            width: 16px;
            border-radius: 4px;
            background: #ffffff;
        }

        .scrollable-content {
            position: relative;
            z-index: 20;
            background: var(--bg);
        }

        .section-card {
            background: var(--card);
            margin: 10px 12px;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .main-price {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
        }

        .discount-tag {
            background: var(--discount-bg);
            color: var(--discount-text);
            font-size: 12px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .old-prices {
            font-size: 14px;
            color: var(--muted);
            text-decoration: line-through;
            margin-bottom: 12px;
        }

        .detail-title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text);
            margin-bottom: 14px;
        }

        /* UZUM STYLE RATING BLOCK */
        .rating-card-box {
            background: var(--card);
            margin: 10px 12px;
            border-radius: 16px;
            padding: 14px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .rating-left-side {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .rating-numbers-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rating-val {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
        }

        .stars-group {
            display: flex;
            gap: 2px;
        }

        .stars-group svg {
            width: 18px;
            height: 18px;
            fill: var(--star);
        }

        .rating-sub-text {
            font-size: 12px;
            color: var(--muted);
        }

        .rating-photos-preview {
            display: flex;
            gap: 6px;
        }

        .preview-thumb {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
        }

        .preview-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-thumb.more-overlay::after {
            content: '+85';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* SALES INFO ROW */
        .sales-info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
            margin: 0 12px 10px 12px;
            padding: 10px 14px;
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .sales-info-row svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--primary);
            stroke-width: 2;
        }

        /* COLOR VARIANTS */
        .option-title {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .color-variants-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .color-chip {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--border);
            cursor: pointer;
            position: relative;
            background: #fff;
        }

        .color-chip img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .color-chip.selected {
            border-color: var(--primary);
        }

        .color-chip.out-of-stock {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .color-chip.out-of-stock::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top right, transparent 48%, #ff3b30 49%, #ff3b30 51%, transparent 52%);
        }

        /* DESCRIPTION */
        .desc-text {
            font-size: 14px;
            color: var(--text);
            line-height: 1.5;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .desc-text.expanded {
            -webkit-line-clamp: unset;
        }

        .toggle-desc-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            margin-top: 8px;
            cursor: pointer;
        }

        /* SIMILAR PRODUCTS */
        .similar-title {
            font-size: 18px;
            font-weight: 700;
            margin: 20px 16px 10px 16px;
        }

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 0 12px;
        }

        .product-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .product-card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }

        .product-card-info {
            padding: 10px;
        }

        /* FIXED BOTTOM BAR FOR CART */
        .bottom-action-bar {
            position: fixed;
            bottom: calc(75px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            border: 1px solid var(--border);
            z-index: 1000;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .add-to-cart-btn {
            flex: 1;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .cart-counter-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex: 1;
            background: var(--bg);
            border-radius: 14px;
            padding: 6px 12px;
        }

        .counter-btn {
            background: #fff;
            border: 1px solid var(--border);
            width: 32px;
            height: 32px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter-val {
            font-size: 16px;
            font-weight: 700;
        }

        .go-to-cart-btn {
            background: var(--primary-bg);
            color: var(--primary);
            border: none;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: calc(35px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            height: 64px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #808080;
            font-size: 10px;
            font-weight: 500;
            width: 20%;
            position: relative;
            cursor: pointer;
            padding: 8px 0;
        }

        .nav-icon-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .nav-item span {
            pointer-events: none;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #808080;
            stroke-width: 1.8;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        .nav-item.active svg {
            stroke: var(--primary);
            fill: var(--primary-bg);
            transform: scale(1.05);
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -8px;
            background: #000;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 17px;
            height: 17px;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .badge-count.show {
            display: flex;
        }
    </style>
</head>
<body>

    <div class="sticky-header">
        <button class="icon-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="icon-btn" id="heartBtn" onclick="toggleMainHeart()">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        </button>
    </div>

    <div class="product-img-wrapper" id="imageWrapper"></div>

    <div class="scrollable-content">
        <div id="productDetailContainer"></div>

        <div class="similar-title">O'xshash mahsulotlar</div>
        <div class="similar-grid" id="similarGrid"></div>
    </div>

    <div class="bottom-action-bar" id="bottomActionBar"></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
            <span>Bosh sahifa</span>
        </a>
        <a href="categories.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg></div>
            <span>Katalog</span>
        </a>
        <a href="cart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><div class="badge-count" id="cartBadge">0</div></div>
            <span>Savatcha</span>
        </a>
        <a href="heart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><div class="badge-count" id="favBadge">0</div></div>
            <span>Saralangan</span>
        </a>
        <a href="profil.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
            <span>Profil</span>
        </a>
    </nav>

    <script>
        const DEFAULT_PRODUCTS = [
            { 
                id: 1, 
                name: "Kir yuvish kukuni Persil, avtomat, 3 kg", 
                price: "68 700 so'm", 
                oldPrice: "120 000 so'm", 
                discount: "↓ 43%", 
                rating: 4.9, 
                commentsCount: 6870,
                ordersCount: "31 500+",
                salesInfo: "Bu haftada 756 kishi sotib oldi",
                desc: "Persil kir yuvish kukuni Avtomat, 3 kg - bu kirni chuqur tozalash uchun kuchli vositadir. Noyob formula hatto murakkab dog'larni ham samarali ketkazadi, buyumlarga yangi ifor va parvarishlangan ko'rinish beradi. Gazlamaga ehtiyotkorlik bilan munosabatda bo'ladi, uning tuzilishi va rangini saqlaydi.", 
                images: ["https://picsum.photos/300/300?random=1", "https://picsum.photos/300/300?random=11", "https://picsum.photos/300/300?random=12"], 
                reviewPhotos: ["https://picsum.photos/100/100?random=51", "https://picsum.photos/100/100?random=52"],
                variants: [
                    { img: "https://picsum.photos/300/300?random=1", label: "3 kg", available: true },
                    { img: "https://picsum.photos/300/300?random=11", label: "6 kg", available: true },
                    { img: "https://picsum.photos/300/300?random=12", label: "9 kg", available: false }
                ]
            }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id')) || 1;

        let allProducts = JSON.parse(localStorage.getItem('products')) || DEFAULT_PRODUCTS;
        let product = allProducts.find(p => p.id === productId) || allProducts[0];

        let favs = JSON.parse(localStorage.getItem('fav_products')) || [];
        let cart = JSON.parse(localStorage.getItem('cart_products')) || [];

        function renderProduct() {
            if (favs.includes(product.id)) {
                document.getElementById('heartBtn').classList.add('liked');
            }

            const imgWrapper = document.getElementById('imageWrapper');
            const pImages = product.images || [product.img || "https://picsum.photos/300/300"];
            const hasMultipleImages = pImages.length > 1;
            const loopedImages = hasMultipleImages ? [pImages[pImages.length - 1], ...pImages, pImages[0]] : pImages;

            imgWrapper.innerHTML = `
                <div class="product-img-box" id="mainImgBox">
                    <div class="card-slider-container" id="mainSlider" ${hasMultipleImages ? `data-original-length="${pImages.length}" onscroll="handleCardScroll(event, ${pImages.length})"` : ''}>
                        ${loopedImages.map(imgUrl => `
                            <div class="card-slide"><img src="${imgUrl}" alt="${product.name}"></div>
                        `).join('')}
                    </div>
                    ${hasMultipleImages ? `
                        <div class="card-dots" id="mainDots">
                            ${pImages.map((_, idx) => `<div class="card-dot ${idx === 0 ? 'active' : ''}"></div>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `;

            const container = document.getElementById('productDetailContainer');
            const ratingVal = product.rating || 4.9;
            const starCount = Math.round(ratingVal);

            container.innerHTML = `
                <div class="section-card">
                    <div class="price-row">
                        <span class="main-price">${product.price}</span>
                        <span class="discount-tag">${product.discount || '↓ 20%'}</span>
                    </div>
                    <div class="old-prices">${product.oldPrice || ''}</div>
                    <h1 class="detail-title">${product.name}</h1>
                </div>

                <!-- UZUM STYLE RATING BOX -->
                <div class="rating-card-box" onclick="window.location.href='comments.html?id=${product.id}'">
                    <div class="rating-left-side">
                        <div class="rating-numbers-row">
                            <span class="rating-val">${ratingVal}</span>
                            <div class="stars-group">
                                ${'<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>'.repeat(starCount)}
                            </div>
                        </div>
                        <div class="rating-sub-text">${product.commentsCount || 10} ta sharh · ${product.ordersCount || '100+'} ta buyurtma</div>
                    </div>
                    <div class="rating-photos-preview">
                        ${(product.reviewPhotos || []).map(img => `
                            <div class="preview-thumb"><img src="${img}" alt="Sharh rasmi"></div>
                        `).join('')}
                        <div class="preview-thumb more-overlay"><img src="${pImages[0]}" alt="More"></div>
                    </div>
                </div>

                <div class="sales-info-row">
                    <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span>${product.salesInfo || "Bu haftada 756 kishi sotib oldi"}</span>
                </div>

                <div class="section-card">
                    ${product.variants ? `
                        <div class="option-group" style="margin-bottom: 14px;">
                            <div class="option-title">O'lcham/Tur: <span id="selectedVariantLabel">${product.variants[0].label}</span></div>
                            <div class="color-variants-grid">
                                ${product.variants.map((v, i) => `
                                    <div class="color-chip ${i === 0 ? 'selected' : ''} ${!v.available ? 'out-of-stock' : ''}" 
                                         onclick="${v.available ? `selectVariant(${i}, '${v.label}')` : ''}">
                                        <img src="${v.img}" alt="${v.label}">
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>

                <div class="section-card">
                    <div class="option-title" style="font-weight: 700; color: var(--text); margin-bottom: 6px;">Tovar haqida</div>
                    <div class="desc-text" id="descText">${product.desc || "Qisqacha ma'lumot mavjud emas."}</div>
                    <button class="toggle-desc-btn" id="toggleDescBtn" onclick="toggleDescription()">Hammasini ko'rish</button>
                </div>
            `;

            renderActionBar();
            renderSimilar();
            updateBadges();

            setTimeout(() => {
                const slider = document.getElementById('mainSlider');
                if (slider && slider.dataset.originalLength) {
                    slider.scrollLeft = slider.clientWidth;
                }
            }, 50);
        }

        function selectVariant(index, label) {
            document.querySelectorAll('.color-chip').forEach((c, idx) => {
                c.classList.toggle('selected', idx === index);
            });
            document.getElementById('selectedVariantLabel').textContent = label;

            const slider = document.getElementById('mainSlider');
            if (slider) {
                const slideWidth = slider.clientWidth;
                slider.scrollTo({ left: (index + 1) * slideWidth, behavior: 'smooth' });
            }
        }

        function toggleDescription() {
            const desc = document.getElementById('descText');
            const btn = document.getElementById('toggleDescBtn');
            desc.classList.toggle('expanded');
            btn.textContent = desc.classList.contains('expanded') ? "Qisqartirish" : "Hammasini ko'rish";
        }

        function renderActionBar() {
            const bar = document.getElementById('bottomActionBar');
            const cartItem = cart.find(item => item.id === product.id);

            if (!cartItem) {
                bar.innerHTML = `<button class="add-to-cart-btn" onclick="addToCart()">Savatga</button>`;
            } else {
                bar.innerHTML = `
                    <div class="cart-counter-box">
                        <button class="counter-btn" onclick="changeQty(-1)">-</button>
                        <span class="counter-val">${cartItem.qty || 1}</span>
                        <button class="counter-btn" onclick="changeQty(1)">+</button>
                    </div>
                    <a href="cart.html" class="go-to-cart-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        <span>O'tish</span>
                    </a>
                `;
            }
        }

        function addToCart() {
            let item = { ...product, qty: 1 };
            cart.push(item);
            localStorage.setItem('cart_products', JSON.stringify(cart));
            renderActionBar();
            updateBadges();
        }

        function changeQty(delta) {
            let cartItem = cart.find(item => item.id === product.id);
            if (cartItem) {
                cartItem.qty = (cartItem.qty || 1) + delta;
                if (cartItem.qty <= 0) {
                    cart = cart.filter(item => item.id !== product.id);
                }
                localStorage.setItem('cart_products', JSON.stringify(cart));
                renderActionBar();
                updateBadges();
            }
        }

        function toggleMainHeart() {
            const btn = document.getElementById('heartBtn');
            if (favs.includes(product.id)) {
                favs = favs.filter(id => id !== product.id);
                btn.classList.remove('liked');
            } else {
                favs.push(product.id);
                btn.classList.add('liked');
            }
            localStorage.setItem('fav_products', JSON.stringify(favs));
            updateBadges();
        }

        function updateBadges() {
            const favBadge = document.getElementById('favBadge');
            const cartBadge = document.getElementById('cartBadge');
            let validFavs = favs.filter(id => allProducts.some(p => p.id === id));

            if (validFavs.length > 0) {
                favBadge.textContent = validFavs.length;
                favBadge.classList.add('show');
            } else {
                favBadge.classList.remove('show');
            }

            if (cart.length > 0) {
                cartBadge.textContent = cart.length;
                cartBadge.classList.add('show');
            } else {
                cartBadge.classList.remove('show');
            }
        }

        function renderSimilar() {
            const grid = document.getElementById('similarGrid');
            const similar = allProducts.filter(p => p.id !== product.id).slice(0, 4);

            grid.innerHTML = similar.map(p => `
                <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'">
                    <img src="${p.images ? p.images[0] : p.img}" alt="${p.name}">
                    <div class="product-card-info">
                        <div style="font-weight: 800; font-size: 14px; margin-bottom: 4px;">${p.price}</div>
                        <div style="font-size: 11px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${p.name}</div>
                    </div>
                </div>
            `).join('');
        }

        function handleCardScroll(e, originalLen) {
            const container = e.target;
            const slideWidth = container.clientWidth;
            const scrollLeft = container.scrollLeft;

            if (scrollLeft >= (originalLen + 1) * slideWidth - 5) {
                container.style.scrollBehavior = 'auto';
                container.scrollLeft = slideWidth;
                container.style.scrollBehavior = 'smooth';
            } else if (scrollLeft <= 5) {
                container.style.scrollBehavior = 'auto';
                container.scrollLeft = originalLen * slideWidth;
                container.style.scrollBehavior = 'smooth';
            }

            const activeIndex = Math.round(container.scrollLeft / slideWidth) - 1;
            const realIndex = (activeIndex + originalLen) % originalLen;
            const dots = document.getElementById('mainDots')?.children;
            if (dots) {
                for (let i = 0; i < dots.length; i++) {
                    dots[i].classList.toggle('active', i === realIndex);
                }
            }
        }

        renderProduct();
    </script>
</body>
</html>
