<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahsulot tavsiloti - Uzum Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
            --star: #ffb800;
            --discount-bg: #f1e5ff;
            --discount-text: #7000ff;
            --danger: #ff3b30;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 210px;
            overflow-x: hidden;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            z-index: 999;
            padding: 52px 16px 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .icon-btn {
            background: none;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            color: var(--text);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .icon-btn.liked svg {
            fill: #ff3b30;
            stroke: #ff3b30;
        }

        .product-img-wrapper {
            position: sticky;
            top: 104px;
            z-index: 10;
            background: #ffffff;
            width: 100%;
            height: 380px;
            border-bottom: 1px solid var(--border);
        }

        .product-img-box {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #f8f9fa;
        }

        .card-slider-container {
            width: 100%;
            height: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .card-slider-container::-webkit-scrollbar {
            display: none;
        }

        .card-slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .card-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .scrollable-content {
            position: relative;
            z-index: 20;
            background: var(--bg);
        }

        .section-card {
            background: var(--card);
            margin: 10px 12px;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .main-price {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
        }

        .discount-tag {
            background: var(--discount-bg);
            color: var(--discount-text);
            font-size: 12px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .old-prices {
            font-size: 14px;
            color: var(--muted);
            text-decoration: line-through;
            margin-bottom: 6px;
        }

        .out-of-stock-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--danger);
            margin-bottom: 8px;
            display: none;
        }

        .detail-title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text);
            margin-bottom: 14px;
        }

        .option-section {
            margin-top: 14px;
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }

        .option-title {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .sizes-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .size-chip {
            min-width: 44px;
            height: 38px;
            padding: 0 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text);
        }

        .size-chip.selected {
            border-color: var(--primary);
            background: var(--primary-bg);
            color: var(--primary);
        }

        .rating-card-box {
            background: var(--card);
            margin: 10px 12px;
            border-radius: 16px;
            padding: 14px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .rating-left-side {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .rating-numbers-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rating-val {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
        }

        .stars-group {
            display: flex;
            gap: 2px;
        }

        .stars-group svg {
            width: 18px;
            height: 18px;
            fill: var(--star);
        }

        .rating-sub-text {
            font-size: 12px;
            color: var(--muted);
        }

        .preview-thumb {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .preview-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sales-info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
            margin: 0 12px 10px 12px;
            padding: 10px 14px;
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .desc-text {
            font-size: 14px;
            color: var(--text);
            line-height: 1.5;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .desc-text.expanded {
            -webkit-line-clamp: unset;
        }

        .toggle-desc-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            margin-top: 8px;
            cursor: pointer;
        }

        /* SIMILAR PRODUCTS */
        .similar-title {
            font-size: 18px;
            font-weight: 700;
            margin: 20px 16px 10px 16px;
        }

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 0 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .product-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .heart-icon-sm {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }

        .heart-icon-sm svg { width: 18px; height: 18px; fill: none; stroke: #1f2026; stroke-width: 1.8; }
        .heart-icon-sm.liked svg { fill: #ff3b30; stroke: #ff3b30; }

        .product-img-box-sm {
            width: 100%;
            height: 210px;
            background: #f8f9fa;
            position: relative;
            cursor: pointer;
        }

        .card-slider-container-sm {
            width: 100%;
            height: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
        }

        .card-slider-container-sm::-webkit-scrollbar { display: none; }

        .card-slide-sm {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
        }

        .card-slide-sm img { width: 100%; height: 100%; object-fit: cover; }

        .product-info-sm {
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            flex: 1;
            cursor: pointer;
        }

        .main-price-sm { font-size: 16px; font-weight: 800; color: var(--text); }
        .product-title-sm { font-size: 12px; line-height: 1.3; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-top: 6px; height: 32px; }

        .cart-btn-sm {
            width: 100%;
            height: 36px;
            background: var(--primary-bg);
            color: var(--primary);
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            margin-top: auto;
        }

        /* FIXED BOTTOM BAR FOR CART */
        .bottom-action-bar {
            position: fixed;
            bottom: calc(115px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.12);
            border: 1px solid var(--border);
            z-index: 1050;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .add-to-cart-btn {
            flex: 1;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .cart-counter-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex: 1;
            background: var(--bg);
            border-radius: 14px;
            padding: 6px 12px;
        }

        .counter-btn {
            background: #fff;
            border: 1px solid var(--border);
            width: 32px;
            height: 32px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .counter-val { font-size: 16px; font-weight: 700; }

        .go-to-cart-btn {
            background: var(--primary-bg);
            color: var(--primary);
            border: none;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
        }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: calc(40px + env(safe-area-inset-bottom, 0px));
            left: 16px; right: 16px; max-width: 480px; margin: 0 auto; height: 64px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px);
            display: flex; justify-content: space-around; align-items: center; border-radius: 20px; z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #808080; font-size: 10px; font-weight: 500; width: 20%; }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-item svg { width: 24px; height: 24px; fill: none; stroke: #808080; stroke-width: 1.8; }
        .nav-item.active svg { stroke: var(--primary); fill: var(--primary-bg); }

        .badge-count {
            position: absolute; top: -4px; right: -8px; background: #000; color: #fff; font-size: 10px; font-weight: 700; min-width: 17px; height: 17px; border-radius: 10px; display: none; align-items: center; justify-content: center; padding: 0 4px;
        }
        .badge-count.show { display: flex; }
    </style>
</head>

            { id: 306, subcat: "Ko'zoynaklar", name: "Kompyuter uchun nurlar himoyali", price: "135 000 so'm", oldPrice: "220 000 so'm", rating: 4.8, comments: 110, desc: "Monitor nurlaridan ko'zni saqlovchi maxsus ko'zoynak.", images: ["https://images.unsplash.com/photo-1591076482161-42ce6da69f67?w=800&auto=format&fit=crop&q=85"], sizes: [1] }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id')) || 101;

        let product = ALL_PRODUCTS.find(p => p.id === productId) || ALL_PRODUCTS[0];
        let favs = JSON.parse(localStorage.getItem('fav_products')) || [];
        let cart = JSON.parse(localStorage.getItem('cart_products')) || [];
        let currentSelectedSize = product.sizes && product.sizes[0] !== 1 ? product.sizes[0] : null;

        function initPage() {
            if (favs.includes(product.id)) {
                document.getElementById('heartBtn').classList.add('liked');
            } else {
                document.getElementById('heartBtn').classList.remove('liked');
            }
            renderMainImage();
            renderProductInfo();
            renderSimilar();
            updateBadges();
        }

        function renderMainImage() {
            const imgWrapper = document.getElementById('imageWrapper');
            imgWrapper.innerHTML = `
                <div class="product-img-box">
                    <div class="card-slider-container">
                        <div class="card-slide"><img src="${product.images[0]}" alt="${product.name}"></div>
                    </div>
                </div>
            `;
        }

        function renderProductInfo() {
            const container = document.getElementById('productDetailContainer');
            container.innerHTML = `
                <div class="section-card">
                    <div class="price-row">
                        <span class="main-price">${product.price}</span>
                        <span class="discount-tag">Chegirma</span>
                    </div>
                    <div class="old-prices">${product.oldPrice}</div>
                    <h1 class="detail-title">${product.name}</h1>

                    ${product.sizes && product.sizes.length > 1 ? `
                        <div class="option-section">
                            <div class="option-title">O'lchami:</div>
                            <div class="sizes-grid">
                                ${product.sizes.map(size => `
                                    <div class="size-chip ${size === currentSelectedSize ? 'selected' : ''}" onclick="selectSize(${size})">
                                        ${size}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>

                <div class="rating-card-box">
                    <div class="rating-left-side">
                        <div class="rating-numbers-row">
                            <span class="rating-val">${product.rating}</span>
                            <div class="stars-group">
                                <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                            </div>
                        </div>
                        <div class="rating-sub-text">${product.comments} ta sharh</div>
                    </div>
                    <div class="preview-thumb"><img src="${product.images[0]}" alt="Sharh"></div>
                </div>

                <div class="sales-info-row">
                    <span>Bu haftada 120 kishi sotib oldi</span>
                </div>

                <div class="section-card">
                    <div class="option-title" style="font-weight: 700; color: var(--text); margin-bottom: 6px;">Tovar haqida</div>
                    <div class="desc-text" id="descText">${product.desc}</div>
                </div>
            `;
            renderActionBar();
        }

        function selectSize(size) {
            currentSelectedSize = size;
            document.querySelectorAll('.size-chip').forEach(chip => {
                chip.classList.toggle('selected', parseInt(chip.textContent.trim()) === size);
            });
            renderActionBar();
        }

        function renderActionBar() {
            const bar = document.getElementById('bottomActionBar');
            const cartItem = cart.find(item => item.id === product.id && item.selectedSize === currentSelectedSize);

            if (!cartItem) {
                bar.innerHTML = `
                    <button class="add-to-cart-btn" onclick="addToCart()">
                        <span>Savatga qo'shish</span>
                    </button>
                `;
            } else {
                bar.innerHTML = `
                    <div class="cart-counter-box">
                        <button class="counter-btn" onclick="changeQty(-1)">-</button>
                        <span class="counter-val">${cartItem.qty || 1}</span>
                        <button class="counter-btn" onclick="changeQty(1)">+</button>
                    </div>
                    <a href="cart.html" class="go-to-cart-btn">Savatchaga o'tish</a>
                `;
            }
        }

        function addToCart() {
            cart.push({ ...product, selectedSize: currentSelectedSize, qty: 1 });
            localStorage.setItem('cart_products', JSON.stringify(cart));
            renderActionBar();
            updateBadges();
        }

        function changeQty(delta) {
            let cartItem = cart.find(item => item.id === product.id && item.selectedSize === currentSelectedSize);
            if (cartItem) {
                cartItem.qty = (cartItem.qty || 1) + delta;
                if (cartItem.qty <= 0) {
                    cart = cart.filter(item => !(item.id === product.id && item.selectedSize === currentSelectedSize));
                }
                localStorage.setItem('cart_products', JSON.stringify(cart));
                renderActionBar();
                updateBadges();
            }
        }

        function toggleMainHeart() {
            if (favs.includes(product.id)) {
                favs = favs.filter(id => id !== product.id);
            } else {
                favs.push(product.id);
            }
            localStorage.setItem('fav_products', JSON.stringify(favs));
            initPage();
        }

        function renderSimilar() {
            const grid = document.getElementById('similarGrid');
            const similar = ALL_PRODUCTS.filter(p => p.id !== product.id);

            grid.innerHTML = similar.map(p => {
                const isLiked = favs.includes(p.id) ? 'liked' : '';
                return `
                    <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'">
                        <button class="heart-icon-sm ${isLiked}" onclick="event.stopPropagation(); toggleSimilarHeart(${p.id})">
                            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        </button>
                        <div class="product-img-box-sm">
                            <div class="card-slider-container-sm">
                                <div class="card-slide-sm"><img src="${p.images[0]}" alt="${p.name}"></div>
                            </div>
                        </div>
                        <div class="product-info-sm">
                            <div class="main-price-sm">${p.price}</div>
                            <div class="product-title-sm">${p.name}</div>
                            <button class="cart-btn-sm" onclick="event.stopPropagation(); addSimilarToCart(${p.id})">Savatga</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleSimilarHeart(id) {
            if (favs.includes(id)) favs = favs.filter(i => i !== id);
            else favs.push(id);
            localStorage.setItem('fav_products', JSON.stringify(favs));
            renderSimilar();
            updateBadges();
        }

        function addSimilarToCart(id) {
            let prod = ALL_PRODUCTS.find(p => p.id === id);
            if (prod) {
                cart.push({ ...prod, qty: 1 });
                localStorage.setItem('cart_products', JSON.stringify(cart));
                updateBadges();
                alert("Savatga qo'shildi!");
            }
        }

        function updateBadges() {
            const favBadge = document.getElementById('favBadge');
            const cartBadge = document.getElementById('cartBadge');

            if (favs.length > 0) {
                favBadge.textContent = favs.length;
                favBadge.classList.add('show');
            } else {
                favBadge.classList.remove('show');
            }

            let totalCartCount = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
            if (totalCartCount > 0) {
                cartBadge.textContent = totalCartCount;
                cartBadge.classList.add('show');
            } else {
                cartBadge.classList.remove('show');
            }
        }

        initPage();
    </script>
</body>
</html>
