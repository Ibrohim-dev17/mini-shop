<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahsulot tavsiloti - Uzum Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
            --star: #ffb800;
            --discount-bg: #f1e5ff;
            --discount-text: #7000ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 140px;
            overflow-x: hidden;
        }

        /* HEADER */
        .sticky-header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            z-index: 999;
            padding: 44px 16px 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #f4f5f7;
            color: var(--text);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .icon-btn.liked svg {
            fill: #ff3b30;
            stroke: #ff3b30;
        }

        /* PRODUCT IMAGE SLIDER */
        .product-img-box {
            width: 100%;
            height: 360px;
            background: #ffffff;
            position: relative;
            overflow: hidden;
        }

        .card-slider-container {
            width: 100%;
            height: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .card-slider-container::-webkit-scrollbar {
            display: none;
        }

        .card-slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
        }

        .card-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-dots {
            position: absolute;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 6px;
            z-index: 4;
            pointer-events: none;
        }

        .card-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transition: all 0.2s;
        }

        .card-dot.active {
            width: 16px;
            border-radius: 4px;
            background: #ffffff;
        }

        /* CONTENT SECTIONS */
        .section-card {
            background: var(--card);
            margin: 10px 12px;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .main-price {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
        }

        .discount-tag {
            background: var(--discount-bg);
            color: var(--discount-text);
            font-size: 12px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .old-prices {
            font-size: 14px;
            color: var(--muted);
            text-decoration: line-through;
            margin-bottom: 12px;
        }

        .detail-title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text);
            margin-bottom: 14px;
        }

        /* RATINGS */
        .rating-block {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: var(--bg);
            border-radius: 12px;
            cursor: pointer;
        }

        .rating-left {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 700;
        }

        .rating-left svg {
            width: 18px;
            height: 18px;
            fill: var(--star);
        }

        .rating-right {
            font-size: 13px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* OPTIONS (COLOR / SIZE) */
        .option-group {
            margin-top: 14px;
        }

        .option-title {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .option-values {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .option-chip {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 13px;
            background: #fff;
            cursor: pointer;
        }

        .option-chip.selected {
            border-color: var(--primary);
            background: var(--primary-bg);
            color: var(--primary);
            font-weight: 600;
        }

        /* DESCRIPTION */
        .desc-text {
            font-size: 14px;
            color: var(--text);
            line-height: 1.5;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .desc-text.expanded {
            -webkit-line-clamp: unset;
        }

        .toggle-desc-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            margin-top: 8px;
            cursor: pointer;
        }

        /* SIMILAR PRODUCTS */
        .similar-title {
            font-size: 18px;
            font-weight: 700;
            margin: 20px 16px 10px 16px;
        }

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 0 12px;
        }

        .product-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        .product-card img {
            width: 100%;
            height: 170px;
            object-fit: cover;
        }

        .product-card-info {
            padding: 10px;
        }

        /* FIXED BOTTOM BAR FOR CART */
        .bottom-action-bar {
            position: fixed;
            bottom: calc(45px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            border: 1px solid var(--border);
            z-index: 1000;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .add-to-cart-btn {
            flex: 1;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .cart-counter-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex: 1;
            background: var(--bg);
            border-radius: 14px;
            padding: 6px 12px;
        }

        .counter-btn {
            background: #fff;
            border: 1px solid var(--border);
            width: 32px;
            height: 32px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter-val {
            font-size: 16px;
            font-weight: 700;
        }

        .go-to-cart-btn {
            background: var(--primary-bg);
            color: var(--primary);
            border: none;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border);
            z-index: 990;
        }
    </style>
</head>
<body>

    <div class="sticky-header">
        <div class="header-left">
            <button class="icon-btn" onclick="history.back()">
                <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="heartBtn" onclick="toggleMainHeart()">
                <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>
            <button class="icon-btn" onclick="shareProduct()">
                <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
            </button>
        </div>
    </div>

    <div id="productDetailContainer"></div>

    <div class="similar-title">O'xshash mahsulotlar</div>
    <div class="similar-grid" id="similarGrid"></div>

    <div class="bottom-action-bar" id="bottomActionBar"></div>

    <script>
        const DEFAULT_PRODUCTS = [
            { id: 1, name: "Qishki issiq qora kurtka", price: "450 000 so'm", oldPrice: "680 000 so'm", discount: "↓ 33%", rating: 4.9, comments: 124, desc: "Yuqori sifatli va issiq materialdan tayyorlangan qishki kurtka. Sovuq kunlarda mukammal himoya va qulaylik ta'minlaydi.", images: ["https://picsum.photos/300/300?random=1", "https://picsum.photos/300/300?random=11"], colors: ["Qora", "Ko'k", "Kulrang"], sizes: ["S", "M", "L", "XL"] },
            { id: 2, name: "Sportivniy stilimdagi kurtka", price: "380 000 so'm", oldPrice: "500 000 so'm", discount: "↓ 24%", rating: 4.8, comments: 92, desc: "Zamonaviy sport uslubidagi yengil va qulay kurtka.", images: ["https://picsum.photos/300/300?random=2"], colors: ["Qora", "Qizil"], sizes: ["M", "L"] }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id')) || 1;

        let allProducts = JSON.parse(localStorage.getItem('products')) || DEFAULT_PRODUCTS;
        let product = allProducts.find(p => p.id === productId) || allProducts[0];

        let favs = JSON.parse(localStorage.getItem('fav_products')) || [];
        let cart = JSON.parse(localStorage.getItem('cart_products')) || [];

        function renderProductDetail() {
            const container = document.getElementById('productDetailContainer');
            const pImages = product.images || [product.img || "https://picsum.photos/300/300"];
            const hasMultipleImages = pImages.length > 1;
            const loopedImages = hasMultipleImages ? [pImages[pImages.length - 1], ...pImages, pImages[0]] : pImages;

            if (favs.includes(product.id)) {
                document.getElementById('heartBtn').classList.add('liked');
            }

            container.innerHTML = `
                <div class="product-img-box">
                    <div class="card-slider-container" ${hasMultipleImages ? `data-original-length="${pImages.length}" onscroll="handleCardScroll(event, ${pImages.length})"` : ''}>
                        ${loopedImages.map(imgUrl => `
                            <div class="card-slide"><img src="${imgUrl}" alt="${product.name}"></div>
                        `).join('')}
                    </div>
                    ${hasMultipleImages ? `
                        <div class="card-dots">
                            ${pImages.map((_, idx) => `<div class="card-dot ${idx === 0 ? 'active' : ''}"></div>`).join('')}
                        </div>
                    ` : ''}
                </div>

                <div class="section-card">
                    <div class="price-row">
                        <span class="main-price">${product.price}</span>
                        <span class="discount-tag">${product.discount || '↓ 20%'}</span>
                    </div>
                    <div class="old-prices">${product.oldPrice || ''}</div>
                    <h1 class="detail-title">${product.name}</h1>
                </div>

                <div class="section-card">
                    <div class="rating-block" onclick="window.location.href='comments.html?id=${product.id}'">
                        <div class="rating-left">
                            <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                            <span>${product.rating || 4.8}</span>
                        </div>
                        <div class="rating-right">
                            <span>${product.comments || 50} ta sharh</span>
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                        </div>
                    </div>

                    ${product.colors ? `
                        <div class="option-group">
                            <div class="option-title">Rang: <span id="selectedColor">${product.colors[0]}</span></div>
                            <div class="option-values">
                                ${product.colors.map((c, i) => `<div class="option-chip ${i === 0 ? 'selected' : ''}" onclick="selectOption(this, 'selectedColor', '${c}')">${c}</div>`).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${product.sizes ? `
                        <div class="option-group">
                            <div class="option-title">O'lcham: <span id="selectedSize">${product.sizes[0]}</span></div>
                            <div class="option-values">
                                ${product.sizes.map((s, i) => `<div class="option-chip ${i === 0 ? 'selected' : ''}" onclick="selectOption(this, 'selectedSize', '${s}')">${s}</div>`).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>

                <div class="section-card">
                    <div class="option-title" style="font-weight: 700; color: var(--text); margin-bottom: 6px;">Tavsif</div>
                    <div class="desc-text" id="descText">${product.desc || "Mahsulot haqida batafsil ma'lumot keltirilmagan."}</div>
                    <button class="toggle-desc-btn" id="toggleDescBtn" onclick="toggleDescription()">Hammasini ko'rish</button>
                </div>
            `;

            renderActionBar();
            renderSimilar();
        }

        function selectOption(el, targetId, val) {
            el.parentElement.querySelectorAll('.option-chip').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById(targetId).textContent = val;
        }

        function toggleDescription() {
            const desc = document.getElementById('descText');
            const btn = document.getElementById('toggleDescBtn');
            desc.classList.toggle('expanded');
            btn.textContent = desc.classList.contains('expanded') ? "Qisqartirish" : "Hammasini ko'rish";
        }

        function renderActionBar() {
            const bar = document.getElementById('bottomActionBar');
            const cartItem = cart.find(item => item.id === product.id);

            if (!cartItem) {
                bar.innerHTML = `<button class="add-to-cart-btn" onclick="addToCart()">Savatga qo'shish</button>`;
            } else {
                bar.innerHTML = `
                    <div class="cart-counter-box">
                        <button class="counter-btn" onclick="changeQty(-1)">-</button>
                        <span class="counter-val">${cartItem.qty || 1}</span>
                        <button class="counter-btn" onclick="changeQty(1)">+</button>
                    </div>
                    <a href="cart.html" class="go-to-cart-btn">
                        <span>O'tish</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </a>
                `;
            }
        }

        function addToCart() {
            let item = { ...product, qty: 1 };
            cart.push(item);
            localStorage.setItem('cart_products', JSON.stringify(cart));
            renderActionBar();
        }

        function changeQty(delta) {
            let cartItem = cart.find(item => item.id === product.id);
            if (cartItem) {
                cartItem.qty = (cartItem.qty || 1) + delta;
                if (cartItem.qty <= 0) {
                    cart = cart.filter(item => item.id !== product.id);
                }
                localStorage.setItem('cart_products', JSON.stringify(cart));
                renderActionBar();
            }
        }

        function toggleMainHeart() {
            const btn = document.getElementById('heartBtn');
            if (favs.includes(product.id)) {
                favs = favs.filter(id => id !== product.id);
                btn.classList.remove('liked');
            } else {
                favs.push(product.id);
                btn.classList.add('liked');
            }
            localStorage.setItem('fav_products', JSON.stringify(favs));
        }

        function shareProduct() {
            if (navigator.share) {
                navigator.share({ title: product.name, url: window.location.href });
            } else {
                alert("Havola nusxalandi!");
            }
        }

        function renderSimilar() {
            const grid = document.getElementById('similarGrid');
            const similar = allProducts.filter(p => p.id !== product.id).slice(0, 4);

            grid.innerHTML = similar.map(p => `
                <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'">
                    <img src="${p.images ? p.images[0] : p.img}" alt="${p.name}">
                    <div class="product-card-info">
                        <div style="font-weight: 800; font-size: 14px; margin-bottom: 4px;">${p.price}</div>
                        <div style="font-size: 11px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${p.name}</div>
                    </div>
                </div>
            `).join('');
        }

        function handleCardScroll(e, originalLen) {
            const container = e.target;
            const slideWidth = container.clientWidth;
            const scrollLeft = container.scrollLeft;

            if (scrollLeft >= (originalLen + 1) * slideWidth - 5) {
                container.style.scrollBehavior = 'auto';
                container.scrollLeft = slideWidth;
                container.style.scrollBehavior = 'smooth';
            } else if (scrollLeft <= 5) {
                container.style.scrollBehavior = 'auto';
                container.scrollLeft = originalLen * slideWidth;
                container.style.scrollBehavior = 'smooth';
            }

            const activeIndex = Math.round(container.scrollLeft / slideWidth) - 1;
            const realIndex = (activeIndex + originalLen) % originalLen;
            const dots = container.parentElement.querySelector('.card-dots')?.children;
            if (dots) {
                for (let i = 0; i < dots.length; i++) {
                    dots[i].classList.toggle('active', i === realIndex);
                }
            }
        }

        renderProductDetail();
    </script>
</body>
</html>
