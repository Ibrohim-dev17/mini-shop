<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mahsulot tavsiloti - Uzum Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
            --star: #ffb800;
            --discount-bg: #f1e5ff;
            --discount-text: #7000ff;
            --danger: #ff3b30;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 180px;
            overflow-x: hidden;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            z-index: 999;
            padding: 52px 16px 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .icon-btn {
            background: none;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            color: var(--text);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .icon-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .icon-btn.liked svg {
            fill: #ff3b30;
            stroke: #ff3b30;
        }

        .product-img-wrapper {
            position: sticky;
            top: 104px;
            z-index: 10;
            background: #ffffff;
            width: 100%;
            height: 360px;
            border-bottom: 1px solid var(--border);
        }

        .product-img-box {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #f8f9fa;
        }

        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .card-slider-container {
            width: 100%;
            height: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .card-slider-container::-webkit-scrollbar {
            display: none;
        }

        .card-slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
        }

        .card-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #fff;
            display: block;
        }

        .offline-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            text-align: center;
            background: var(--card);
            margin: 12px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .offline-container svg {
            width: 64px;
            height: 64px;
            stroke: var(--muted);
            fill: none;
            stroke-width: 1.5;
            margin-bottom: 16px;
        }

        .offline-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .offline-desc {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 20px;
        }

        .reload-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .scrollable-content {
            position: relative;
            z-index: 20;
            background: var(--bg);
        }

        .section-card {
            background: var(--card);
            margin: 10px 12px;
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .main-price {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
        }

        .discount-tag {
            background: var(--discount-bg);
            color: var(--discount-text);
            font-size: 12px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .old-prices {
            font-size: 14px;
            color: var(--muted);
            text-decoration: line-through;
            margin-bottom: 6px;
        }

        .out-of-stock-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--danger);
            margin-bottom: 8px;
            display: none;
        }

        .detail-title {
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text);
            margin-bottom: 14px;
        }

        .option-section {
            margin-top: 14px;
            border-top: 1px solid var(--border);
            padding-top: 14px;
        }

        .option-title {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .variants-grid {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .variant-chip {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--border);
            cursor: pointer;
            position: relative;
            background: #fff;
        }

        .variant-chip img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .variant-chip.selected {
            border-color: var(--primary);
        }

        .variant-chip.out-of-stock {
            opacity: 0.5;
        }

        .variant-chip.out-of-stock::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top right, transparent 48%, var(--danger) 49%, var(--danger) 51%, transparent 52%);
        }

        .sizes-grid {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .size-chip {
            min-width: 44px;
            height: 38px;
            padding: 0 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fff;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text);
        }

        .size-chip.selected {
            border-color: var(--primary);
            background: var(--primary-bg);
            color: var(--primary);
        }

        .rating-card-box {
            background: var(--card);
            margin: 10px 12px;
            border-radius: 16px;
            padding: 14px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .rating-left-side {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .rating-numbers-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rating-val {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
        }

        .stars-group {
            display: flex;
            gap: 2px;
        }

        .stars-group svg {
            width: 18px;
            height: 18px;
            fill: var(--star);
        }

        .rating-sub-text {
            font-size: 12px;
            color: var(--muted);
        }

        .rating-photos-preview {
            display: flex;
            gap: 6px;
        }

        .preview-thumb {
            width: 45px;
            height: 45px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
        }

        .preview-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sales-info-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--muted);
            margin: 0 12px 10px 12px;
            padding: 10px 14px;
            background: var(--card);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .sales-info-row svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--primary);
            stroke-width: 2;
        }

        .desc-text {
            font-size: 14px;
            color: var(--text);
            line-height: 1.5;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }

        .desc-text.expanded {
            -webkit-line-clamp: unset;
        }

        .toggle-desc-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            font-size: 14px;
            margin-top: 8px;
            cursor: pointer;
        }

        /* SIMILAR PRODUCTS (INDEX STYLE) */
        .similar-title {
            font-size: 18px;
            font-weight: 700;
            margin: 20px 16px 10px 16px;
        }

        .similar-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 0 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .product-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }

        .heart-icon-sm {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }

        .heart-icon-sm svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: #1f2026;
            stroke-width: 1.8;
            transition: all 0.2s;
        }

        .heart-icon-sm.liked svg {
            fill: #ff3b30;
            stroke: #ff3b30;
        }

        .product-img-box-sm {
            width: 100%;
            height: 210px;
            background: #f8f9fa;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
        }

        .card-slider-container-sm {
            width: 100%;
            height: 100%;
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .card-slider-container-sm::-webkit-scrollbar {
            display: none;
        }

        .card-slide-sm {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
        }

        .card-slide-sm img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-dots-sm {
            position: absolute;
            bottom: 8px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            z-index: 4;
            pointer-events: none;
        }

        .card-dot-sm {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transition: all 0.2s;
        }

        .card-dot-sm.active {
            width: 14px;
            border-radius: 3px;
            background: #ffffff;
        }

        .badge-original-sm {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: #00c853;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            z-index: 4;
            pointer-events: none;
        }

        .product-info-sm {
            padding: 10px 4px 6px 4px;
            display: flex;
            flex-direction: column;
            flex: 1;
            cursor: pointer;
        }

        .price-row-sm {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .main-price-sm {
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
        }

        .discount-tag-sm {
            background: var(--discount-bg);
            color: var(--discount-text);
            font-size: 11px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 4px;
        }

        .old-prices-sm {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .price-old-sm {
            text-decoration: line-through;
        }

        .product-title-sm {
            font-size: 12px;
            line-height: 1.3;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 6px;
            height: 32px;
        }

        .product-rating-sm {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: var(--muted);
            margin: 8px 0;
        }

        .rating-box-sm, .comment-box-sm {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .rating-box-sm svg {
            width: 13px;
            height: 13px;
            fill: var(--star);
        }

        .comment-box-sm svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: #8b8e99;
            stroke-width: 2;
        }

        .rating-num-sm {
            font-weight: 700;
            color: var(--text);
        }

        .cart-btn-sm {
            width: 100%;
            height: 36px;
            background: var(--primary-bg);
            color: var(--primary);
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            margin-top: auto;
        }

        .cart-btn-sm svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .cart-counter-box-sm {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 36px;
            background: var(--bg);
            border-radius: 10px;
            padding: 0 6px;
            margin-top: auto;
            border: 1px solid var(--border);
        }

        .counter-btn-sm {
            background: #fff;
            border: 1px solid var(--border);
            width: 26px;
            height: 26px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter-val-sm {
            font-size: 14px;
            font-weight: 700;
        }

        /* FIXED BOTTOM BAR FOR CART (YUKORIROQGA CHIQARILDI) */
        .bottom-action-bar {
            position: fixed;
            bottom: calc(115px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
            border: 1px solid var(--border);
            z-index: 1050;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .add-to-cart-btn {
            flex: 1;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .add-to-cart-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .cart-counter-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex: 1;
            background: var(--bg);
            border-radius: 14px;
            padding: 6px 12px;
        }

        .counter-btn {
            background: #fff;
            border: 1px solid var(--border);
            width: 32px;
            height: 32px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .counter-val {
            font-size: 16px;
            font-weight: 700;
        }

        .go-to-cart-btn {
            background: var(--primary-bg);
            color: var(--primary);
            border: none;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: calc(15px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            height: 64px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #808080;
            font-size: 10px;
            font-weight: 500;
            width: 20%;
            position: relative;
            cursor: pointer;
            padding: 8px 0;
        }

        .nav-icon-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .nav-item span {
            pointer-events: none;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #808080;
            stroke-width: 1.8;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        .nav-item.active svg {
            stroke: var(--primary);
            fill: var(--primary-bg);
            transform: scale(1.05);
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -8px;
            background: #000;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 17px;
            height: 17px;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .badge-count.show {
            display: flex;
        }
    </style>
</head>
<body>

    <div class="sticky-header">
        <button class="icon-btn" onclick="history.back()">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <button class="icon-btn" id="heartBtn" onclick="toggleMainHeart()">
            <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
        </button>
    </div>

    <div class="product-img-wrapper" id="imageWrapper">
        <div class="product-img-box skeleton"></div>
    </div>

    <div class="offline-container" id="offlineBox">
        <svg viewBox="0 0 24 24"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>
        <div class="offline-title">Internetda uzulish yuzaga keldi</div>
        <div class="offline-desc">Tarmoqqa ulanishni tekshiring va qayta urinib ko'ring</div>
        <button class="reload-btn" onclick="location.reload()">Yangilash</button>
    </div>

    <div class="scrollable-content" id="mainContentArea">
        <div id="productDetailContainer"></div>

        <div class="similar-title" id="similarTitle">O'xshash mahsulotlar</div>
        <div class="similar-grid" id="similarGrid"></div>
    </div>

    <div class="bottom-action-bar" id="bottomActionBar"></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
            <span>Bosh sahifa</span>
        </a>
        <a href="categories.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg></div>
            <span>Katalog</span>
        </a>
        <a href="cart.html" class="nav-item">

            <span>Savatcha</span>
        </a>
        <a href="heart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><div class="badge-count" id="favBadge">0</div></div>
            <span>Saralangan</span>
        </a>
        <a href="profil.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
            <span>Profil</span>
        </a>
    </nav>

    <script>
        const DEFAULT_PRODUCTS = [
            { 
                id: 1, 
                category_id: 1, 
                name: "Qishki issiq qora kurtka", 
                price: "450 000 so'm", 
                oldPrice: "680 000 so'm", 
                discount: "↓ 33%", 
                rating: 4.9, 
                comments: 124, 
                ordersCount: "1 200+", 
                salesInfo: "Bu haftada 89 kishi sotib oldi", 
                desc: "Qishki issiq qora kurtka sovuq ob-havo uchun mukammal tanlov. Yuqori sifatli shamol o'tkazmaydigan material.", 
                images: ["https://picsum.photos/300/300?random=1", "https://picsum.photos/300/300?random=11"],
                variants: [
                    { name: "Qishki issiq qora kurtka (Qora)", price: "450 000 so'm", img: "https://picsum.photos/300/300?random=1", available: true },
                    { name: "Qishki issiq qora kurtka (Ko'k)", price: "460 000 so'm", img: "https://picsum.photos/300/300?random=11", available: true },
                    { name: "Qishki issiq qora kurtka (Qizil)", price: "440 000 so'm", img: "https://picsum.photos/300/300?random=12", available: false }
                ],
                sizes: [38, 39, 40, 41, 42]
            },
            { 
                id: 2, 
                category_id: 1, 
                name: "Sportivniy stilimdagi kurtka", 
                price: "380 000 so'm", 
                oldPrice: "500 000 so'm", 
                discount: "↓ 24%", 
                rating: 4.8, 
                comments: 92, 
                ordersCount: "850+", 
                salesInfo: "Bu haftada 54 kishi sotib oldi", 
                desc: "Sport uslubidagi qulay va yengil kurtka.", 
                images: ["https://picsum.photos/300/300?random=2"],
                variants: [
                    { name: "Sportivniy stilimdagi kurtka (Kulrang)", price: "380 000 so'm", img: "https://picsum.photos/300/300?random=2", available: true }
                ],
                sizes: [39, 40, 41]
            },
            { 
                id: 3, 
                category_id: 2, 
                name: "Uy uchun yumshoq tapichka", 
                price: "45 000 so'm", 
                oldPrice: "80 000 so'm", 
                discount: "↓ 43%", 
                rating: 5.0, 
                comments: 310, 
                ordersCount: "3 400+", 
                salesInfo: "Bu haftada 210 kishi sotib oldi", 
                desc: "Uy uchun juda yumshoq va iliq tapichka.", 
                images: ["https://picsum.photos/300/300?random=3"],
                sizes: [36, 37, 38, 39]
            },
            { 
                id: 4, 
                category_id: 3, 
                name: "Bahorgi qora shapka", 
                price: "35 000 so'm", 
                oldPrice: "60 000 so'm", 
                discount: "↓ 41%", 
                rating: 4.7, 
                comments: 45, 
                ordersCount: "400+", 
                salesInfo: "Bu haftada 32 kishi sotib oldi", 
                desc: "Bahorgi mavsum uchun qulay qora shapka.", 
                images: ["https://picsum.photos/300/300?random=4"]
            },
            { 
                id: 5, 
                category_id: 4, 
                name: "Ayollar uchun zamonaviy ko'ylak", 
                price: "220 000 so'm", 
                oldPrice: "350 000 so'm", 
                discount: "↓ 37%", 
                rating: 4.9, 
                comments: 178, 
                ordersCount: "950+", 
                salesInfo: "Bu haftada 67 kishi sotib oldi", 
                desc: "Zamonaviy dizayndagi ayollar ko'ylagi.", 
                images: ["https://picsum.photos/300/300?random=5"]
            },
            { 
                id: 6, 
                category_id: 5, 
                name: "Paxtadan tayyorlangan ichki kiyimlar to'plami", 
                price: "90 000 so'm", 
                oldPrice: "150 000 so'm", 
                discount: "↓ 40%", 
                rating: 4.8, 
                comments: 89, 
                ordersCount: "1 500+", 
                salesInfo: "Bu haftada 120 kishi sotib oldi", 
                desc: "100% toza paxtadan tayyorlangan sifatli to'plam.", 
                images: ["https://picsum.photos/300/300?random=6"]
            }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const productId = parseInt(urlParams.get('id')) || 1;

        let allProducts = JSON.parse(localStorage.getItem('products')) || DEFAULT_PRODUCTS;
        let product = allProducts.find(p => p.id === productId) || allProducts[0];

        let favs = JSON.parse(localStorage.getItem('fav_products')) || [];
        let cart = JSON.parse(localStorage.getItem('cart_products')) || [];

        let currentSelectedVariantIndex = 0;
        let currentSelectedSize = product.sizes ? product.sizes[0] : null;

        function renderProduct() {
            if (!navigator.onLine) {
                document.getElementById('offlineBox').style.display = 'flex';
                document.getElementById('mainContentArea').style.display = 'none';
                document.getElementById('imageWrapper').style.display = 'none';
                return;
            }

            if (favs.includes(product.id)) {
                document.getElementById('heartBtn').classList.add('liked');
            } else {
                document.getElementById('heartBtn').classList.remove('liked');
            }

            const activeVariant = product.variants && product.variants[currentSelectedVariantIndex] ? product.variants[currentSelectedVariantIndex] : null;
            const displayPrice = activeVariant ? activeVariant.price : product.price;
            const displayName = activeVariant ? activeVariant.name : product.name;
            const isAvailable = activeVariant ? activeVariant.available : true;
            const displayImg = activeVariant ? activeVariant.img : (product.images ? product.images[0] : product.img);

            const imgWrapper = document.getElementById('imageWrapper');
            imgWrapper.innerHTML = `
                <div class="product-img-box">
                    <div class="card-slider-container">
                        <div class="card-slide"><img src="${displayImg}" alt="${displayName}" onerror="handleImgError(this)"></div>
                    </div>
                </div>
            `;

            const container = document.getElementById('productDetailContainer');
            const ratingVal = product.rating || 4.9;
            const starCount = Math.round(ratingVal);

            container.innerHTML = `
                <div class="section-card">
                    <div class="price-row">
                        <span class="main-price">${displayPrice}</span>
                        <span class="discount-tag">${product.discount || '↓ 20%'}</span>
                    </div>
                    <div class="old-prices">${product.oldPrice || ''}</div>
                    <div class="out-of-stock-label" id="outOfStockLabel" style="display: ${isAvailable ? 'none' : 'block'}">Qolmagan</div>
                    <h1 class="detail-title" id="productTitle">${displayName}</h1>

                    ${product.variants && product.variants.length > 0 ? `
                        <div class="option-section">
                            <div class="option-title">Turi / Rangi:</div>
                            <div class="variants-grid">
                                ${product.variants.map((v, i) => `
                                    <div class="variant-chip ${i === currentSelectedVariantIndex ? 'selected' : ''} ${!v.available ? 'out-of-stock' : ''}" 
                                         onclick="selectVariant(${i})">
                                        <img src="${v.img}" alt="Variant">
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}

                    ${product.sizes && product.sizes.length > 0 ? `
                        <div class="option-section">
                            <div class="option-title">O'lchami: <span id="selectedSizeLabel" style="font-weight: 700; color: var(--text);">${currentSelectedSize || ''}</span></div>
                            <div class="sizes-grid">
                                ${product.sizes.map(size => `
                                    <div class="size-chip ${size === currentSelectedSize ? 'selected' : ''}" onclick="selectSize(${size})">
                                        ${size}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    ` : ''}
                </div>

                <div class="rating-card-box" onclick="window.location.href='comments.html?id=${product.id}'">
                    <div class="rating-left-side">
                        <div class="rating-numbers-row">
                            <span class="rating-val">${ratingVal}</span>
                            <div class="stars-group">
                                ${'<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>'.repeat(starCount)}
                            </div>
                        </div>
                        <div class="rating-sub-text">${product.comments || 50} ta sharh · ${product.ordersCount || '100+'} ta buyurtma</div>
                    </div>
                    <div class="rating-photos-preview">
                        <div class="preview-thumb"><img src="${displayImg}" alt="Sharh rasmi"></div>
                    </div>
                </div>

                <div class="sales-info-row">
                    <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                    <span>${product.salesInfo || "Bu haftada 150 kishi sotib oldi"}</span>
                </div>

                <div class="section-card">
                    <div class="option-title" style="font-weight: 700; color: var(--text); margin-bottom: 6px;">Tovar haqida</div>
                    <div class="desc-text" id="descText">${product.desc || "Qisqacha ma'lumot mavjud emas."}</div>
                    <button class="toggle-desc-btn" id="toggleDescBtn" onclick="toggleDescription()">Hammasini ko'rish</button>
                </div>
            `;

            renderActionBar();
            renderSimilar();
            updateBadges();
        }

        function selectVariant(index) {
            currentSelectedVariantIndex = index;
            renderProduct();
        }

        function selectSize(size) {
            currentSelectedSize = size;
            document.querySelectorAll('.size-chip').forEach(chip => {
                chip.classList.toggle('selected', parseInt(chip.textContent.trim()) === size);
            });
            const sizeLabel = document.getElementById('selectedSizeLabel');
            if (sizeLabel) sizeLabel.textContent = size;
            renderActionBar();
        }

        function handleImgError(img) {
            document.getElementById('offlineBox').style.display = 'flex';
            document.getElementById('mainContentArea').style.display = 'none';
            document.getElementById('imageWrapper').style.display = 'none';
        }

        function toggleDescription() {
            const desc = document.getElementById('descText');
            const btn = document.getElementById('toggleDescBtn');
            desc.classList.toggle('expanded');
            btn.textContent = desc.classList.contains('expanded') ? "Qisqartirish" : "Hammasini ko'rish";
        }

        function renderActionBar() {
            const bar = document.getElementById('bottomActionBar');
            const cartItem = cart.find(item => item.id === product.id && item.selectedSize === currentSelectedSize);

            if (!cartItem) {
                bar.innerHTML = `
                    <button class="add-to-cart-btn" onclick="addToCart()">
                        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        <span>Savatga</span>
                    </button>
                `;
            } else {
                bar.innerHTML = `
                    <div class="cart-counter-box">
                        <button class="counter-btn" onclick="changeQty(-1)">-</button>
                        <span class="counter-val">${cartItem.qty || 1}</span>
                        <button class="counter-btn" onclick="changeQty(1)">+</button>
                    </div>
                    <a href="cart.html" class="go-to-cart-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        <span>O'tish</span>
                    </a>
                `;
            }
        }

        function addToCart() {
            const activeVariant = product.variants && product.variants[currentSelectedVariantIndex] ? product.variants[currentSelectedVariantIndex] : null;
            let itemToAdd = {
                ...product,
                name: activeVariant ? activeVariant.name : product.name,
                price: activeVariant ? activeVariant.price : product.price,
                selectedSize: currentSelectedSize,
                qty: 1
            };
            cart.push(itemToAdd);
            localStorage.setItem('cart_products', JSON.stringify(cart));
            renderActionBar();
            updateBadges();
        }

        function changeQty(delta) {
            let cartItem = cart.find(item => item.id === product.id && item.selectedSize === currentSelectedSize);
            if (cartItem) {
                cartItem.qty = (cartItem.qty || 1) + delta;
                if (cartItem.qty <= 0) {
                    cart = cart.filter(item => !(item.id === product.id && item.selectedSize === currentSelectedSize));
                }
                localStorage.setItem('cart_products', JSON.stringify(cart));
                renderActionBar();
                updateBadges();
            }
        }

        function toggleMainHeart() {
            if (favs.includes(product.id)) {
                favs = favs.filter(id => id !== product.id);
            } else {
                favs.push(product.id);
            }
            localStorage.setItem('fav_products', JSON.stringify(favs));
            renderProduct();
            updateBadges();
        }

        function toggleSimilarHeart(e, id) {
            e.stopPropagation();
            if (favs.includes(id)) {
                favs = favs.filter(item => item !== id);
            } else {
                favs.push(id);
            }
            localStorage.setItem('fav_products', JSON.stringify(favs));
            renderSimilar();
            updateBadges();
        }

        function updateBadges() {
            const favBadge = document.getElementById('favBadge');
            const cartBadge = document.getElementById('cartBadge');
            let validFavs = favs.filter(id => allProducts.some(p => p.id === id));

            if (validFavs.length > 0) {
                favBadge.textContent = validFavs.length;
                favBadge.classList.add('show');
            } else {
                favBadge.classList.remove('show');
            }

            let totalCartCount = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
            if (totalCartCount > 0) {
                cartBadge.textContent = totalCartCount;
                cartBadge.classList.add('show');
            } else {
                cartBadge.classList.remove('show');
            }
        }

        function goToProduct(id) {
            window.location.href = `product.html?id=${id}`;
        }

        function renderSimilar() {
            const grid = document.getElementById('similarGrid');
            const similar = allProducts.filter(p => p.id !== product.id).slice(0, 6);

            if (similar.length === 0) {
                document.getElementById('similarTitle').style.display = 'none';
                return;
            }

            grid.innerHTML = similar.map(p => {
                const isLiked = favs.includes(p.id) ? 'liked' : '';
                const pImages = p.images || [p.img || "https://picsum.photos/300/300"];
                const hasMultipleImages = pImages.length > 1;
                const loopedImages = hasMultipleImages ? [pImages[pImages.length - 1], ...pImages, pImages[0]] : pImages;
                const defaultSize = p.sizes ? p.sizes[0] : null;
                const cartItem = cart.find(item => item.id === p.id && item.selectedSize === defaultSize);

                let btnHtml = '';
                if (!cartItem) {
                    btnHtml = `
                        <button class="cart-btn-sm" onclick="event.stopPropagation(); addSimilarToCart(${p.id})">
                            <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                            <span>Savatga</span>
                        </button>
                    `;
                } else {
                    btnHtml = `
                        <div class="cart-counter-box-sm" onclick="event.stopPropagation()">
                            <button class="counter-btn-sm" onclick="changeSimilarQty(${p.id}, -1)">-</button>
                            <span class="counter-val-sm">${cartItem.qty || 1}</span>
                            <button class="counter-btn-sm" onclick="changeSimilarQty(${p.id}, 1)">+</button>
                        </div>
                    `;
                }

                return `
                    <div class="product-card">
                        <button class="heart-icon-sm ${isLiked}" onclick="toggleSimilarHeart(event, ${p.id})">
                            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        </button>
                        <div class="product-img-box-sm" data-product-id="${p.id}">
                            <div class="card-slider-container-sm" ${hasMultipleImages ? `data-original-length="${pImages.length}" onscroll="handleSimilarCardScroll(event, ${pImages.length})"` : ''}>
                                ${loopedImages.map(imgUrl => `
                                    <div class="card-slide-sm"><img src="${imgUrl}" alt="${p.name}"></div>
                                `).join('')}
                            </div>
                            ${hasMultipleImages ? `
                                <div class="card-dots-sm">
                                    ${pImages.map((_, idx) => `<div class="card-dot-sm ${idx === 0 ? 'active' : ''}"></div>`).join('')}
                                </div>
                            ` : ''}
                            <div class="badge-original-sm">✓ ORIGINAL</div>
                        </div>
                        <div class="product-info-sm" onclick="goToProduct(${p.id})">
                            <div class="price-row-sm">
                                <span class="main-price-sm">${p.price}</span>
                                <span class="discount-tag-sm">${p.discount}</span>
                            </div>
                            <div class="old-prices-sm">
                                <span class="price-old-sm">${p.oldPrice}</span>
                            </div>
                            <div class="product-title-sm">${p.name}</div>
                            <div class="product-rating-sm">
                                <div class="rating-box-sm">
                                    <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                                    <span class="rating-num-sm">${p.rating || 4.8}</span>
                                </div>
                                <div class="comment-box-sm">
                                    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                                    <span>${p.comments || 50}</span>
                                </div>
                            </div>
                            ${btnHtml}
                        </div>
                    </div>
                `;
            }).join('');

            document.querySelectorAll('.product-img-box-sm').forEach(box => {
                let startX = 0;
                let startY = 0;
                box.addEventListener('pointerdown', (e) => {
                    startX = e.clientX;
                    startY = e.clientY;
                });
                box.addEventListener('pointerup', (e) => {
                    let diffX = Math.abs(e.clientX - startX);
                    let diffY = Math.abs(e.clientY - startY);
                    if (diffX < 6 && diffY < 6) {
                        const prodId = box.getAttribute('data-product-id');
                        goToProduct(prodId);
                    }
                });
            });

            setTimeout(() => {
                document.querySelectorAll('.card-slider-container-sm').forEach(container => {
                    if (container.dataset.originalLength) {
                        const slideWidth = container.clientWidth;
                        container.scrollLeft = slideWidth;
                    }
                });
            }, 50);
        }

        function handleSimilarCardScroll(e, originalLen) {
            const container = e.target;
            const slideWidth = container.clientWidth;
            const scrollLeft = container.scrollLeft;

            if (scrollLeft >= (originalLen + 1) * slideWidth - 5) {
                container.style.scrollBehavior = 'auto';
                container.scrollLeft = slideWidth;
                container.style.scrollBehavior = 'smooth';
            } else if (scrollLeft <= 5) {
                container.style.scrollBehavior = 'auto';
                container.scrollLeft = originalLen * slideWidth;
                container.style.scrollBehavior = 'smooth';
            }

            const activeIndex = Math.round(container.scrollLeft / slideWidth) - 1;
            const realIndex = (activeIndex + originalLen) % originalLen;
            const dotsBox = container.parentElement.querySelector('.card-dots-sm');
            if (dotsBox) {
                const dots = dotsBox.children;
                for (let i = 0; i < dots.length; i++) {
                    dots[i].classList.toggle('active', i === realIndex);
                }
            }
        }

        function addSimilarToCart(id) {
            let prod = allProducts.find(p => p.id === id);
            if (prod) {
                let defaultSize = prod.sizes ? prod.sizes[0] : null;
                let cartItem = cart.find(item => item.id === id && item.selectedSize === defaultSize);
                if (!cartItem) {
                    cart.push({ ...prod, selectedSize: defaultSize, qty: 1 });
                } else {
                    cartItem.qty = (cartItem.qty || 1) + 1;
                }
                localStorage.setItem('cart_products', JSON.stringify(cart));
                renderSimilar();
                updateBadges();
            }
        }

        function changeSimilarQty(id, delta) {
            let prod = allProducts.find(p => p.id === id);
            if (!prod) return;
            let defaultSize = prod.sizes ? prod.sizes[0] : null;
            let cartItem = cart.find(item => item.id === id && item.selectedSize === defaultSize);
            if (cartItem) {
                cartItem.qty = (cartItem.qty || 1) + delta;
                if (cartItem.qty <= 0) {
                    cart = cart.filter(item => !(item.id === id && item.selectedSize === defaultSize));
                }
                localStorage.setItem('cart_products', JSON.stringify(cart));
                renderSimilar();
                updateBadges();
            }
        }

        renderProduct();
    </script>
</body>
