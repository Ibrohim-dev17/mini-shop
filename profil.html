    <style>

        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
            --star: #ffb800;
            --discount-bg: #f1e5ff;
            --discount-text: #7000ff;
            --danger: #ff3b30;
        }

        [data-theme="dark"] {
            --primary: #9b4dff;
            --primary-bg: #221638;
            --bg: #121316;
            --card: #1c1d22;
            --text: #f4f5f7;
            --muted: #999cb0;
            --border: #2a2c33;
            --discount-bg: #2e1a47;
            --discount-text: #b17dff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: calc(120px + var(--nav-extra, 0px));
            overflow-x: hidden;
        }

        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--card);
            z-index: 999;
            padding: 12px 16px;
            margin-top: 55px; /* Qidiruv paneli biroz pastroqqa tushirildi */
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 1300px;
            margin-left: auto;
            margin-right: auto;
        }

        .sticky-header::before {
            content: '';
            position: absolute;
            top: -60px;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--card);
            z-index: -1;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            flex-shrink: 0;
            cursor: pointer;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--text);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .bottom-nav {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px) + var(--nav-extra, 0px));
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            height: 64px;
            background: rgba(255, 255, 255, 0.97);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] .bottom-nav {
            background: rgba(28, 29, 34, 0.95);
            border-color: rgba(255, 255, 255, 0.08);
        }

        @media (min-width: 1024px) { .bottom-nav { max-width: 550px; } }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #808080;
            font-size: 10px;
            font-weight: 500;
            width: 20%;
            position: relative;
            cursor: pointer;
            padding: 8px 0;
        }

        .nav-icon-wrap { position: relative; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .nav-item span { pointer-events: none; }
        .nav-item svg { width: 24px; height: 24px; fill: none; stroke: #808080; stroke-width: 1.8; transition: all 0.2s ease; }
        .nav-item.active { color: var(--primary); font-weight: 600; }
        .nav-item.active svg { stroke: var(--primary); fill: var(--primary-bg); transform: scale(1.05); }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -8px;
            background: #000;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 17px;
            height: 17px;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        .badge-count.show { display: flex; }
    
        /* ================= Umumiy komponentlar (sh-*) ================= */
        .sh-stars { display: inline-flex; gap: 1px; vertical-align: middle; }
        .sh-star { fill: none; stroke: var(--star); stroke-width: 1.6; stroke-linejoin: round; }
        .sh-star.on { fill: var(--star); }
        .sh-btn { width: 100%; height: 48px; border: none; border-radius: 14px; background: var(--primary); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .sh-btn:disabled { opacity: .55; cursor: default; }
        .sh-btn.ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .sh-btn.danger { background: #ff3b30; }
        .sh-btn.soft { background: var(--primary-bg); color: var(--primary); }
        .sh-row { display: flex; gap: 10px; } .sh-row .sh-btn { flex: 1; }
        .sh-label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
        .sh-input { width: 100%; height: 46px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 12px; padding: 0 14px; font-size: 15px; outline: none; }
        .sh-input:focus { border-color: var(--primary); }
        .sh-ta { height: 96px; padding: 12px 14px; resize: none; margin-top: 12px; font-family: inherit; }
        .sh-code { text-align: center; letter-spacing: 8px; font-size: 22px; font-weight: 700; }
        .sh-phone { display: flex; align-items: center; border: 1px solid var(--border); background: var(--bg); border-radius: 12px; height: 46px; padding: 0 14px; gap: 8px; }
        .sh-phone:focus-within { border-color: var(--primary); }
        .sh-phone span { font-weight: 700; color: var(--text); }
        .sh-phone input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 16px; color: var(--text); }
        .sh-err { color: #ff3b30; font-size: 13px; min-height: 18px; margin-top: 8px; }
        .sh-sub { font-size: 13px; color: var(--muted); line-height: 1.45; }
        .sh-sent { font-size: 14px; font-weight: 600; margin-top: 4px; }
        .sh-demo { margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--primary-bg); color: var(--primary); font-size: 13px; font-weight: 600; }
        .sh-confirm-text { font-size: 15px; line-height: 1.5; padding: 6px 0 12px; }
        /* Pastdan chiqadigan oyna */
        .sh-sheet-wrap { position: fixed; inset: 0; z-index: 3000; visibility: hidden; }
        .sh-sheet-wrap.show { visibility: visible; }
        .sh-sheet-bg { position: absolute; inset: 0; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .2s; }
        .sh-sheet-wrap.show .sh-sheet-bg { opacity: 1; }
        .sh-sheet { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; background: var(--card); color: var(--text); border-radius: 22px 22px 0 0; padding: 8px 18px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 90vh; overflow-y: auto; transform: translateY(100%); transition: transform .22s ease-out; }
        .sh-sheet-wrap.show .sh-sheet { transform: translateY(0); }
        .sh-sheet-grab { width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: 4px auto 12px; }
        .sh-sheet-title { font-size: 18px; font-weight: 800; margin-bottom: 6px; }
        .sh-toast { position: fixed; left: 50%; bottom: calc(110px + var(--nav-extra, 0px)); transform: translate(-50%, 20px); background: rgba(20,20,24,.94); color: #fff; padding: 11px 18px; border-radius: 12px; font-size: 13px; font-weight: 600; z-index: 4000; opacity: 0; pointer-events: none; transition: all .22s; max-width: 86vw; text-align: center; }
        .sh-toast.show { opacity: 1; transform: translate(-50%, 0); }
        /* Sharhlar */
        .sh-review { padding: 14px 0; border-bottom: 1px solid var(--border); }
        .sh-review:last-child { border-bottom: none; }
        .sh-review-head { display: flex; align-items: center; gap: 10px; }
        .sh-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-bg); color: var(--primary); font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .sh-avatar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .sh-avatar.anon { background: var(--bg); color: var(--muted); }
        .sh-review-who { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .sh-review-name { font-size: 14px; font-weight: 700; }
        .sh-review-date { font-size: 12px; color: var(--muted); flex-shrink: 0; }
        .sh-review-variant { font-size: 12px; color: var(--muted); margin-top: 8px; }
        .sh-review-text { font-size: 14px; line-height: 1.45; margin-top: 6px; word-break: break-word; }
        .sh-review-text.muted { color: var(--muted); }
        .sh-review-photos { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
        .sh-review-photos img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); flex-shrink: 0; cursor: pointer; }
        .sh-reply { margin-top: 10px; padding: 10px 12px; background: var(--bg); border-radius: 10px; border-left: 3px solid var(--primary); }
        .sh-reply-name { font-size: 12px; font-weight: 700; margin-bottom: 3px; }
        .sh-reply-text { font-size: 13px; line-height: 1.4; }
        /* Lightbox */
        .sh-lightbox { position: fixed; inset: 0; background: #000; z-index: 3500; opacity: 0; transition: opacity .2s; display: flex; align-items: center; }
        .sh-lightbox.show { opacity: 1; }
        .sh-lb-track { display: flex; width: 100%; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .sh-lb-track::-webkit-scrollbar { display: none; }
        .sh-lb-slide { flex: 0 0 100%; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; }
        .sh-lb-slide img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .sh-lb-close { position: absolute; top: calc(60px + env(safe-area-inset-top, 0px)); right: 16px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.18); border: none; z-index: 2; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .sh-lb-close svg { width: 20px; height: 20px; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; }
        .sh-lb-count { position: absolute; bottom: 40px; left: 0; right: 0; text-align: center; color: #fff; font-size: 13px; font-weight: 600; }
        /* Sharh yozish */
        .sh-rv-prod { display: flex; gap: 12px; align-items: center; margin: 8px 0 4px; }
        .sh-rv-prod img { width: 56px; height: 72px; object-fit: cover; border-radius: 10px; background: var(--bg); }
        .sh-rv-name { font-size: 14px; font-weight: 600; line-height: 1.3; }
        .sh-rate-pick { display: flex; gap: 6px; }
        .sh-rate-pick button { background: none; border: none; padding: 2px; cursor: pointer; }
        .sh-rate-pick svg { width: 38px; height: 38px; fill: none; stroke: var(--star); stroke-width: 1.5; stroke-linejoin: round; transition: transform .12s; }
        .sh-rate-pick button.on svg { fill: var(--star); }
        .sh-rate-pick button:active svg { transform: scale(1.15); }
        .sh-photos { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .sh-ph { position: relative; width: 72px; height: 72px; }
        .sh-ph img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
        .sh-ph button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: none; background: #ff3b30; color: #fff; font-size: 14px; line-height: 1; cursor: pointer; }
        .sh-ph-add { width: 72px; height: 72px; border-radius: 10px; border: 1.5px dashed var(--border); background: var(--bg); color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 10px; cursor: pointer; }
        .sh-ph-add svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .sh-seg { display: flex; gap: 6px; background: var(--bg); border: 1px solid var(--border); padding: 4px; border-radius: 12px; }
        .sh-seg button { flex: 1; height: 38px; border: none; border-radius: 9px; background: transparent; color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; }
        .sh-seg button.on { background: var(--primary); color: #fff; }
        .sh-seg button:disabled { opacity: .4; }
        .sh-empty { text-align: center; padding: 60px 24px; color: var(--muted); }
        .sh-empty svg { width: 64px; height: 64px; stroke: var(--muted); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 14px; opacity: .7; }
        .sh-empty h3 { font-size: 18px; color: var(--text); margin-bottom: 6px; }
        .sh-empty p { font-size: 14px; line-height: 1.45; }
        .sh-empty .sh-btn { width: auto; display: inline-flex; padding: 0 26px; margin-top: 18px; }

        .hdr-title { font-size: 18px; font-weight: 800; flex: 1; }
        .page { padding: 125px 14px 0; max-width: 640px; margin: 0 auto; }
        .pcard { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; display: flex; align-items: center; gap: 14px; }
        .pavatar { width: 60px; height: 60px; border-radius: 50%; background: var(--primary-bg); color: var(--primary); font-size: 24px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .pavatar svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .pinfo { flex: 1; min-width: 0; } .pinfo h3 { font-size: 17px; font-weight: 800; } .pinfo p { font-size: 13px; color: var(--muted); margin-top: 3px; }
        .menu { background: var(--card); border: 1px solid var(--border); border-radius: 18px; margin-top: 14px; overflow: hidden; }
        .mrow { display: flex; align-items: center; gap: 14px; padding: 15px 16px; border-bottom: 1px solid var(--border); cursor: pointer; color: var(--text); text-decoration: none; font-size: 15px; font-weight: 600; }
        .mrow:last-child { border-bottom: none; }
        .mic { width: 36px; height: 36px; border-radius: 11px; background: var(--primary-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .mic svg { width: 20px; height: 20px; stroke: var(--primary); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
        .mrow .chev { margin-left: auto; width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .mrow.danger { color: #ff3b30; } .mrow.danger .mic { background: rgba(255,59,48,.12); } .mrow.danger .mic svg { stroke: #ff3b30; }
        .block { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-bottom: 14px; }
        .block h4 { font-size: 14px; color: var(--muted); font-weight: 600; margin-bottom: 10px; }
        .seg2 { display: flex; gap: 8px; }
        .seg2 button { flex: 1; height: 48px; border-radius: 13px; border: 1.5px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .seg2 button svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
        .seg2 button.on { border-color: var(--primary); background: var(--primary-bg); color: var(--primary); }
        .ocard { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
        .ohead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .ono { font-size: 15px; font-weight: 800; }
        .chip { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
        .chip.new { background: #e8f1ff; color: #1b6ef3; } .chip.confirmed { background: var(--primary-bg); color: var(--primary); } .chip.shipping { background: #fff3e0; color: #e68a00; }
        .chip.delivered { background: #e6f9ee; color: #00a650; } .chip.cancelled { background: #ffe9e7; color: #ff3b30; }
        [data-theme="dark"] .chip.new { background: #14233d; } [data-theme="dark"] .chip.shipping { background: #3a2a10; } [data-theme="dark"] .chip.delivered { background: #0f2e1c; } [data-theme="dark"] .chip.cancelled { background: #3a1613; }
        .odate { font-size: 12px; color: var(--muted); margin-top: 4px; }
        .othumbs { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
        .othumbs img { width: 52px; height: 66px; object-fit: cover; border-radius: 9px; background: var(--bg); }
        .omore { width: 52px; height: 66px; border-radius: 9px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--muted); }
        .ototal { margin-top: 12px; font-size: 15px; font-weight: 800; display: flex; justify-content: space-between; }

        .oitem:last-child { border-bottom: none; }

        .oi-btn { margin-top: 8px; height: 34px; padding: 0 14px; border: none; border-radius: 10px; background: var(--primary-bg); color: var(--primary); font-size: 13px; font-weight: 700; cursor: pointer; }

    </style>

    // Sharh ichidagi rasmni bosganda katta ko'rsatish
    function bindReviewPhotos(root, listFn) {

    /* ---------------- Oynalar (sheet / lightbox) va orqaga tugmasi ---------------- */
    const overlays = [];
    function pushOverlay(el) {
      overlays.push(el); history.pushState({ sh: overlays.length }, '');
      return () => { const i = overlays.indexOf(el); if (i === overlays.length - 1) history.back(); else if (i >= 0) { overlays.splice(i, 1); el.remove(); } };
    }
    window.addEventListener('popstate', () => {
      if (overlays.length) { const el = overlays.pop(); el.classList.remove('show'); setTimeout(() => el.remove(), 220); }
    });
    function closeTop() { if (overlays.length) { history.back(); return true; } return false; }
    function sheet(opts) {
      const el = document.createElement('div'); el.className = 'sh-sheet-wrap';
      el.innerHTML = `<div class="sh-sheet-bg"></div><div class="sh-sheet" role="dialog"><div class="sh-sheet-grab"></div>
        ${opts.title ? `<div class="sh-sheet-title">${opts.title}</div>` : ''}<div class="sh-sheet-body">${opts.html || ''}</div></div>`;
      document.body.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      const close = pushOverlay(el);
      el.querySelector('.sh-sheet-bg').addEventListener('click', close);
      if (opts.onMount) opts.onMount(el.querySelector('.sh-sheet-body'), close);
      return { el, close, body: el.querySelector('.sh-sheet-body') };
    }
    function confirmSheet(message, okLabel) {
      return new Promise(resolve => {
        let done = false;
        const s = sheet({ html: `<div class="sh-confirm-text">${esc(message)}</div>
          <div class="sh-row"><button class="sh-btn ghost" data-a="no">${esc(tr('cancel'))}</button><button class="sh-btn danger" data-a="yes">${esc(okLabel || tr('yes'))}</button></div>` });
        s.el.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; done = true; const yes = b.getAttribute('data-a') === 'yes'; s.close(); setTimeout(() => resolve(yes), 0); });
        const obs = new MutationObserver(() => { if (!document.body.contains(s.el)) { obs.disconnect(); if (!done) resolve(false); } });
        obs.observe(document.body, { childList: true });
      });
    }
    function lightbox(images, start) {
      if (!images || !images.length) return;
      const el = document.createElement('div'); el.className = 'sh-lightbox';
      el.innerHTML = `<button class="sh-lb-close" aria-label="close"><svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
        <div class="sh-lb-track">${images.map(u => `<div class="sh-lb-slide"><img src="${esc(u)}" alt=""></div>`).join('')}</div>
        ${images.length > 1 ? `<div class="sh-lb-count"><span id="shLbN">${(start || 0) + 1}</span> / ${images.length}</div>` : ''}`;
      document.body.appendChild(el);
      requestAnimationFrame(() => { el.classList.add('show'); const tk = el.querySelector('.sh-lb-track'); tk.scrollLeft = (start || 0) * tk.clientWidth; });
      const close = pushOverlay(el);
      el.querySelector('.sh-lb-close').addEventListener('click', close);
      const tk = el.querySelector('.sh-lb-track');
      tk.addEventListener('scroll', () => { const n = el.querySelector('#shLbN'); if (n) n.textContent = Math.round(tk.scrollLeft / tk.clientWidth) + 1; });
    }
    let toastTimer = null;
    function toast(msg) {
      let t = document.getElementById('shToast');
      if (!t) { t = document.createElement('div'); t.id = 'shToast'; t.className = 'sh-toast'; document.body.appendChild(t); }
      t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
    }
    function defaultBack() {
      if (location.hash && history.length > 1) { history.back(); return; }
      if (history.length > 1 && document.referrer) history.back(); else location.href = 'index.html';
    }
    let backHook = null;
    function onBack(fn) { backHook = fn; }
    function goBack() { if (closeTop()) return; if (backHook && backHook() === true) return; defaultBack(); }
    function setupTelegram() {
      const tg = window.Telegram && window.Telegram.WebApp; if (!tg) return;
      try { tg.ready(); tg.expand(); } catch (e) {}
      if (tg.BackButton) { try { tg.BackButton.offClick(goBack); } catch (e) {} tg.BackButton.onClick(goBack); tg.BackButton.show(); }
      try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    }
    function updateNavInset() {
      const tg = window.Telegram && window.Telegram.WebApp; let sys = 0;
      if (tg && tg.safeAreaInset && tg.safeAreaInset.bottom) sys = tg.safeAreaInset.bottom;
      const cssVar = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tg-safe-area-inset-bottom')); if (!isNaN(cssVar)) sys = Math.max(sys, cssVar);
      const probe = document.createElement('div');
      probe.style.cssText = 'position:fixed;left:0;bottom:0;height:0;visibility:hidden;pointer-events:none;padding-bottom:env(safe-area-inset-bottom, 0px);';
      document.body.appendChild(probe); const envPx = parseFloat(getComputedStyle(probe).paddingBottom) || 0; probe.remove(); sys = Math.max(sys, envPx);
      let extra = sys >= 32 ? Math.max(0, sys - envPx) : 0; const manual = parseFloat(ls.raw('nav_extra', NaN)); if (!isNaN(manual)) extra = manual;
      document.documentElement.style.setProperty('--nav-extra', extra + 'px');

    function init() {

    }
    /* ---------------- Kirish, buyurtma, sharh yuborish ---------------- */
    function getAuth() { return ls.get('auth', null); }
    function user() { const a = getAuth(); return (a && a.user) || null; }
    function logout() { try { localStorage.removeItem('auth'); } catch (e) {} }
    async function api(path, o) {
      o = o || {};
      const h = { 'Content-Type': 'application/json' }, a = getAuth();
      if (o.auth !== false && a && a.token && a.token !== 'local') h.Authorization = 'Bearer ' + a.token;
      const res = await fetch(API + path, { method: o.method || 'GET', headers: h, body: o.body ? JSON.stringify(o.body) : undefined });
      let data = null; try { data = await res.json(); } catch (e) {}
      if (!res.ok) { const err = new Error((data && (data.detail || data.error)) || ('HTTP ' + res.status)); err.status = res.status; throw err; }
      return data;
    }
    function cleanPhone(v) { let d = String(v || '').replace(/\D/g, ''); if (d.startsWith('998')) d = d.slice(3); return d.slice(0, 9); }
    function fmtPhoneInput(d) { return [d.slice(0, 2), d.slice(2, 5), d.slice(5, 7), d.slice(7, 9)].filter(Boolean).join(' '); }
    function fullPhone(d9) { return '+998' + d9; }
    function showPhone(p) { const d = cleanPhone(p); return '+998 ' + fmtPhoneInput(d); }

    async function requestCode(phone) {
      if (IS_REMOTE) return await api('/api/auth/request-code', { method: 'POST', auth: false, body: { shop: SHOP, phone: phone } });
      const code = String(Math.floor(10000 + Math.random() * 90000));
      ls.set('local_code', { phone: phone, code: code, exp: Date.now() + 5 * 60000 });
      return { ok: true, dev_code: code };
    }
    async function verifyCode(phone, code, name) {
      if (IS_REMOTE) {
        const r = await api('/api/auth/verify', { method: 'POST', auth: false, body: { shop: SHOP, phone: phone, code: code, name: name } });
        ls.set('auth', { token: r.token, user: r.user }); return r.user;
      }
      const c = ls.get('local_code', null);
      if (!c || c.phone !== phone || c.code !== String(code) || Date.now() > c.exp) throw new Error('wrong_code');
      const users = ls.get('local_users', {}); const u = users[phone] || { id: phone, phone: phone, name: '' };
      if (name) u.name = name; users[phone] = u; ls.set('local_users', users); ls.set('auth', { token: 'local', user: u });
      try { localStorage.removeItem('local_code'); } catch (e) {}
      return u;
    }
    async function updateName(name) {
      const a = getAuth(); if (!a) return;
      if (IS_REMOTE) { const r = await api('/api/me', { method: 'PUT', body: { name: name } }); a.user = r; }
      else { a.user.name = name; const users = ls.get('local_users', {}); if (users[a.user.phone]) users[a.user.phone].name = name; ls.set('local_users', users); }
      ls.set('auth', a);
    }

    function openLogin(onDone) {
      const lastName = ls.raw('last_name', '');
      let phone9 = '', timer = null;
      const s = sheet({
        title: esc(tr('a_login_title')),
        html: `<div class="sh-sub">${esc(tr('a_login_text'))}</div>
          <div id="shStep1">

            <div class="sh-phone"><span>+998</span><input id="shPhone" inputmode="numeric" autocomplete="tel" placeholder="90 123 45 67"></div>
            <div class="sh-err" id="shErr1"></div>

            <label class="sh-label">${esc(tr('a_code'))}</label>
            <input class="sh-input sh-code" id="shCode" inputmode="numeric" maxlength="6" placeholder="• • • • •" autocomplete="one-time-code">
            <div class="sh-err" id="shErr2"></div>
            <button class="sh-btn" id="shOk">${esc(tr('a_confirm'))}</button>
            <button class="sh-btn ghost" id="shResend" disabled></button>
          </div>`,
        onMount(body, close) {
          const $ = id => body.querySelector('#' + id);
          $('shPhone').addEventListener('input', e => { phone9 = cleanPhone(e.target.value); e.target.value = fmtPhoneInput(phone9); });
          function startTimer() {
            let left = 60; clearInterval(timer);
            const tick = () => { const b = $('shResend'); if (!b) return clearInterval(timer); if (left > 0) { b.disabled = true; b.textContent = tr('a_resend_in', { s: left }); left--; } else { b.disabled = false; b.textContent = tr('a_resend'); clearInterval(timer); } };
            tick(); timer = setInterval(tick, 1000);
          }
          async function send() {
            const name = $('shName').value.trim();
            if (!name) { $('shErr1').textContent = tr('a_need_name'); return; }
            if (phone9.length !== 9) { $('shErr1').textContent = tr('a_bad_phone'); return; }
            $('shErr1').textContent = ''; const b = $('shGet'); b.disabled = true; b.textContent = tr('a_wait');
            try {
              const r = await requestCode(fullPhone(phone9));
              ls.setRaw('last_name', name);
              $('shStep1').style.display = 'none'; $('shStep2').style.display = '';
              $('shSent').textContent = tr('a_code_sent', { phone: showPhone(phone9) });
              if (r && r.dev_code) { const d = $('shDemo'); d.style.display = ''; d.textContent = tr('a_demo_note', { code: r.dev_code }); }
              startTimer(); setTimeout(() => $('shCode').focus(), 50);
            } catch (e) { $('shErr1').textContent = (e && e.message && e.status ? e.message : tr('error_generic')); }
            b.disabled = false; b.textContent = tr('a_get_code');
          }
          $('shGet').addEventListener('click', send);
          $('shResend').addEventListener('click', async () => { $('shResend').disabled = true; try { const r = await requestCode(fullPhone(phone9)); if (r && r.dev_code) { const d = $('shDemo'); d.style.display = ''; d.textContent = tr('a_demo_note', { code: r.dev_code }); } } catch (e) {} startTimer(); });
          $('shOk').addEventListener('click', async () => {
            const code = $('shCode').value.trim(); if (code.length < 4) { $('shErr2').textContent = tr('a_wrong_code'); return; }
            const b = $('shOk'); b.disabled = true;
            try {
              const u = await verifyCode(fullPhone(phone9), code, $('shName').value.trim());
              clearInterval(timer); close();
              setTimeout(() => { toast(tr('a_welcome', { name: u.name || '' })); if (onDone) onDone(u); }, 260);
            } catch (e) { $('shErr2').textContent = tr('a_wrong_code'); b.disabled = false; }
          });
        }
      });
      return s;
    }

    /* ---------------- Buyurtmalar ---------------- */
    function makeSnapshot(it) {
      const p = product(it.id) || {};
      const c = it.color ? colorOf(p, it.color) : null;
      return { product_id: it.id, name: p.name || '', image: productImage(p, it.color), price: num(p.price), color: it.color || null, color_name: c ? c.name : null, size: it.size == null ? null : it.size, qty: it.qty, reviewed: false };
    }
    async function listOrders() {
      if (IS_REMOTE) return await api('/api/orders');
      const u = user(); if (!u) return [];
      return ls.get('local_orders', []).filter(o => o.phone === u.phone).sort((a, b) => String(b.created).localeCompare(String(a.created)));
    }
    async function placeOrder(d) {
      if (IS_REMOTE) {
        return await api('/api/orders', { method: 'POST', body: { name: d.name, address: d.address, comment: d.comment, items: d.items.map(i => ({ product_id: i.id, color: i.color, size: i.size, qty: i.qty })) } });

    function isReviewed(orderId, pid, item) { return !!(item && item.reviewed) || ls.get('reviewed_items', []).indexOf(orderId + ':' + pid) >= 0; }

    async function submitReview(d) {
      // d: {order_id, product_id, rating, text, anonymous, photos, color, size}
      const u = user(); let r;
      if (IS_REMOTE) r = await api('/api/reviews', { method: 'POST', body: d });
      else r = { id: 'R' + Date.now().toString(36), product_id: d.product_id, name: d.anonymous ? null : (u && u.name) || null, rating: d.rating, text: d.text, date: new Date().toISOString().slice(0, 10), color: d.color, size: d.size, photos: d.photos || [] };

      const ri = ls.get('reviewed_items', []); ri.push(d.order_id + ':' + d.product_id); ls.set('reviewed_items', ri);
      return r;
    }
    function pickPhotos(files, max) {
      const list = Array.prototype.slice.call(files || [], 0, max);
      return Promise.all(list.map(f => new Promise(resolve => {
        const fr = new FileReader();
        fr.onload = () => { const img = new Image(); img.onload = () => {
          const k = Math.min(1, 900 / Math.max(img.width, img.height)); const c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.78)); }; img.onerror = () => resolve(null); img.src = fr.result; };
        fr.onerror = () => resolve(null); fr.readAsDataURL(f);
      }))).then(a => a.filter(Boolean));
    }
    function openReviewSheet(order, item, onDone) {
      const u = user() || {}; const p = product(item.product_id) || {};
      let rating = 0, photos = [];
      const nm = loc(item.name);
      const s = sheet({
        title: esc(tr('r_write')),
        html: `<div class="sh-rv-prod"><img src="${esc(item.image || productImage(p, item.color))}" alt=""><div><div class="sh-rv-name">${esc(nm)}</div></div></div>

          <textarea class="sh-input sh-ta" id="shText" maxlength="600" placeholder="${esc(tr('r_text_ph'))}"></textarea>
          <div class="sh-photos" id="shPh"></div>

            orders: '<svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>',
            heart: '<svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
            gear: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
            logout: '<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
            chev: '<svg class="chev" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>',
            sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>',
            moon: '<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
            globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
            user: '<svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
            box: '<svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>'
        };
        let orders = null, ordersErr = false;
        const page = document.getElementById('page'), hdr = document.getElementById('hdr');
        const st = o => ['new', 'confirmed', 'shipping', 'delivered', 'cancelled'].includes(o.status) ? o.status : 'new';

        function view() { const h = location.hash.replace('#', ''); if (h.startsWith('order=')) return { v: 'order', id: decodeURIComponent(h.slice(6)) }; return { v: h || 'main' }; }
        function render() {
            SH.applyTheme(); SH.applyI18n();
            const V = view(), u = SH.user();
            if (V.v === 'orders') return renderOrders();
            if (V.v === 'order') return renderOrder(V.id);
            if (V.v === 'settings') return renderSettings();
            hdr.textContent = SH.tr('pr_title');
            const initial = u && u.name ? SH.esc(u.name.trim().charAt(0).toUpperCase()) : I.user;
            page.innerHTML = `<div class="pcard"><div class="pavatar">${initial}</div><div class="pinfo">
                <h3>${SH.esc(u ? (u.name || SH.tr('a_guest')) : SH.tr('a_guest'))}</h3>
                <p>${u ? SH.esc(SH.showPhone(u.phone)) : SH.esc(SH.tr('a_guest_text'))}</p></div></div>
              ${u ? '' : `<button class="sh-btn" id="loginBtn">${SH.esc(SH.tr('c_login_btn'))}</button>`}
              <div class="menu">
                <div class="mrow" data-go="orders"><div class="mic">${I.orders}</div>${SH.esc(SH.tr('pr_orders'))}${I.chev}</div>
                <a class="mrow" href="heart.html"><div class="mic">${I.heart}</div>${SH.esc(SH.tr('pr_favs'))}${I.chev}</a>
                <div class="mrow" data-go="settings"><div class="mic">${I.gear}</div>${SH.esc(SH.tr('pr_settings'))}${I.chev}</div>
                ${u ? `<div class="mrow danger" id="logoutRow"><div class="mic">${I.logout}</div>${SH.esc(SH.tr('a_logout'))}</div>` : ''}
              </div>`;
        }
        function renderSettings() {
            hdr.textContent = SH.tr('pr_settings'); const u = SH.user(), L = SH.lang(), T = SH.theme();
            page.innerHTML = `<div class="block"><h4>${SH.esc(SH.tr('pr_lang'))}</h4><div class="seg2" id="langSeg">
                <button data-l="uz" class="${L === 'uz' ? 'on' : ''}">${I.globe}O'zbekcha</button><button data-l="ru" class="${L === 'ru' ? 'on' : ''}">${I.globe}Русский</button></div></div>
              <div class="block"><h4>${SH.esc(SH.tr('pr_theme'))}</h4><div class="seg2" id="themeSeg">
                <button data-t="light" class="${T === 'light' ? 'on' : ''}">${I.sun}${SH.esc(SH.tr('pr_light'))}</button><button data-t="dark" class="${T === 'dark' ? 'on' : ''}">${I.moon}${SH.esc(SH.tr('pr_dark'))}</button></div></div>
              ${u ? `<div class="block"><h4>${SH.esc(SH.tr('pr_edit_name'))}</h4><input class="sh-input" id="nameInp" maxlength="40" value="${SH.esc(u.name || '')}"><button class="sh-btn soft" id="nameSave">${SH.esc(SH.tr('save'))}</button></div>` : ''}`;
        }
        async function ensureOrders(force) {
            if (orders && !force) return;
            if (!SH.user()) { orders = []; return; }
            try { orders = await SH.listOrders(); ordersErr = false; } catch (e) { orders = []; ordersErr = true; }
        }
        async function renderOrders() {
            hdr.textContent = SH.tr('pr_orders');
            if (!SH.user()) { page.innerHTML = `<div class="sh-empty"><h3>${SH.esc(SH.tr('c_need_login_title'))}</h3><p>${SH.esc(SH.tr('c_need_login_text'))}</p><button class="sh-btn" id="loginBtn">${SH.esc(SH.tr('c_login_btn'))}</button></div>`; return; }
            if (!orders) { page.innerHTML = `<div class="sh-empty"><p>${SH.esc(SH.tr('loading'))}</p></div>`; await ensureOrders(); if (view().v !== 'orders') return; }
            if (ordersErr) { page.innerHTML = `<div class="sh-empty"><p>${SH.esc(SH.tr('error_generic'))}</p></div>`; return; }
            if (!orders.length) { page.innerHTML = `<div class="sh-empty">${I.box}<h3>${SH.esc(SH.tr('pr_orders_empty'))}</h3><p>${SH.esc(SH.tr('pr_orders_empty_text'))}</p><a class="sh-btn" href="index.html">${SH.esc(SH.tr('c_go_shop'))}</a></div>`; return; }
            page.innerHTML = (orders.some(o => st(o) === 'delivered') ? `<div class="hint">${SH.esc(SH.tr('pr_rate_hint'))}</div>` : '') + orders.map(o => {
                const th = (o.items || []).slice(0, 4).map(i => `<img src="${SH.esc(i.image)}" alt="">`).join('') + ((o.items || []).length > 4 ? `<div class="omore">+${o.items.length - 4}</div>` : '');
                return `<div class="ocard" data-oid="${SH.esc(o.id)}"><div class="ohead"><span class="ono">${SH.esc(SH.tr('pr_order_no', { n: o.number || o.id }))}</span><span class="chip ${st(o)}">${SH.esc(SH.tr('st_' + st(o)))}</span></div>
                  <div class="odate">${SH.esc(SH.fmtDate(String(o.created).slice(0, 10)))}</div><div class="othumbs">${th}</div><div class="ototal"><span>${SH.esc(SH.tr('pr_total'))}</span><span>${SH.money(o.total)}</span></div></div>`;
            }).join('');
        }
        async function renderOrder(id) {
            hdr.textContent = SH.tr('pr_orders'); await ensureOrders();
            const o = (orders || []).find(x => String(x.id) === String(id)); if (!o) { page.innerHTML = `<div class="sh-empty"><p>${SH.esc(SH.tr('not_found'))}</p></div>`; return; }
            hdr.textContent = SH.tr('pr_order_no', { n: o.number || o.id });
            const delivered = st(o) === 'delivered';
            page.innerHTML = `<div class="block"><div class="ohead"><span class="ono">${SH.esc(SH.tr('pr_order_no', { n: o.number || o.id }))}</span><span class="chip ${st(o)}">${SH.esc(SH.tr('st_' + st(o)))}</span></div>
              ${(o.items || []).map((i, idx) => {
                const p = SH.product(i.product_id) || {};
                const col = i.color ? SH.colorOf(p, i.color) : null, cname = col ? SH.loc(col.name) : (i.color_name ? SH.loc(i.color_name) : '');
                const v = [cname ? SH.tr('p_color') + ': ' + SH.esc(cname) : '', i.size != null ? SH.tr('p_size') + ': ' + SH.esc(i.size) : ''].filter(Boolean).join(' · ');
                let act = '';
                if (delivered) act = SH.isReviewed(o.id, i.product_id, i) ? `<span class="oi-done">${SH.esc(SH.tr('pr_reviewed'))}</span>` : `<button class="oi-btn" data-rv="${idx}">${SH.esc(SH.tr('pr_review_btn'))}</button>`;
                return `<div class="oitem"><img src="${SH.esc(i.image)}" alt="" data-p="${SH.esc(i.product_id)}"><div class="oi-info"><div class="oi-name">${SH.esc(SH.loc(i.name))}</div>${v ? `<div class="oi-var">${v}</div>` : ''}<div class="oi-price">${SH.money(i.price)} × ${i.qty}</div>${act}</div></div>`;
              }).join('')}</div>
              <div class="block"><div class="kv"><span>${SH.esc(SH.tr('pr_date'))}</span><span>${SH.esc(SH.fmtDate(String(o.created).slice(0, 10)))}</span></div>
                <div class="kv"><span>${SH.esc(SH.tr('pr_address'))}</span><span>${SH.esc(o.address || '')}</span></div>
                <div class="kv"><span>${SH.esc(SH.tr('c_payment'))}</span><span>${SH.esc(SH.tr('c_cash'))}</span></div>
                <div class="kv"><span>${SH.esc(SH.tr('pr_total'))}</span><span>${SH.money(o.total)}</span></div></div>
              ${(!SH.IS_REMOTE && !delivered) ? `<button class="sh-btn ghost demo-btn" id="demoDeliver">${SH.esc(SH.tr('pr_demo_deliver'))}</button>` : ''}`;
        }
        function go(h) { location.hash = h; }
        page.addEventListener('click', async e => {
            const g = e.target.closest('[data-go]'); if (g) { go(g.getAttribute('data-go')); return; }
            if (e.target.closest('#loginBtn')) { SH.openLogin(() => { orders = null; render(); }); return; }
            if (e.target.closest('#logoutRow')) { if (await SH.confirmSheet(SH.tr('a_logout_ask'), SH.tr('a_logout'))) { SH.logout(); orders = null; render(); } return; }
            const oc = e.target.closest('[data-oid]'); if (oc) { go('order=' + encodeURIComponent(oc.getAttribute('data-oid'))); return; }
            const ls_ = e.target.closest('#langSeg [data-l]'); if (ls_) { SH.setLang(ls_.getAttribute('data-l')); SH.applyI18n(); document.title = SH.tr('pr_title'); renderNav(); render(); return; }
            const ts = e.target.closest('#themeSeg [data-t]'); if (ts) { SH.setTheme(ts.getAttribute('data-t')); render(); return; }
            if (e.target.closest('#nameSave')) { const v = document.getElementById('nameInp').value.trim(); if (!v) return; try { await SH.updateName(v); SH.toast(SH.tr('pr_saved')); } catch (er) { SH.toast(SH.tr('error_generic')); } return; }
            const pi = e.target.closest('img[data-p]'); if (pi) { location.href = 'product.html?id=' + encodeURIComponent(pi.getAttribute('data-p')); return; }
            const rv = e.target.closest('[data-rv]');
            if (rv) { const o = orders.find(x => String(x.id) === String(view().id)); const it = o.items[parseInt(rv.getAttribute('data-rv'), 10)]; SH.openReviewSheet(o, it, () => renderOrder(o.id)); return; }
            if (e.target.closest('#demoDeliver')) { SH.localMarkDelivered(view().id); orders = null; renderOrder(view().id); }
        });
        function renderNav() { document.querySelectorAll('.bottom-nav [data-i18n]').forEach(el => { el.textContent = SH.tr(el.getAttribute('data-i18n')); }); }
        window.addEventListener('hashchange', render);
        (async function start() {
            SH.init(); document.title = SH.tr('pr_title');
            try { SH.setDB(await SH.loadDB(fresh => { SH.setDB(fresh); })); } catch (e) {}
            document.title = SH.tr('pr_title') + ' - ' + SH.shopName();
            render();
            if (new URLSearchParams(location.search).get('login') === '1' && !SH.user()) SH.openLogin(() => render());
        })();
    </script>
</body>
</html>
