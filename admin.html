<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uzum Market - Admin Boshqaruv Paneli</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Konfiguratsiya Modali (Do'kon va Kalit) -->
    <div id="configModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <h3 class="text-xl font-bold mb-4 text-purple-700"><i class="fa-solid fa-store mr-2"></i>Admin ulanish sozlamalari</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Backend URL (API manzili):</label>
                    <input type="text" id="apiUrl" value="https://sizning-servis.onrender.com" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Do'kon Slug (masalan: mijoz1):</label>
                    <input type="text" id="shopSlug" value="mijoz1" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Admin API Kaliti (X-Admin-Key):</label>
                    <input type="password" id="adminKey" placeholder="api_key ni kiriting" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-purple-500 outline-none">
                </div>
                <button onclick="saveConfig()" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-medium py-2.5 rounded-lg transition">Saqlash va kirish</button>
            </div>
        </div>
    </div>

    <!-- Asosiy Sahifa -->
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col hidden md:flex">
            <div class="p-5 text-xl font-bold text-white border-b border-slate-800 flex items-center">
                <i class="fa-solid fa-basket-shopping text-purple-400 mr-2"></i> Uzum Admin
            </div>
            <nav class="flex-1 p-4 space-y-1 overflow-y-auto">
                <button onclick="switchTab('products')" class="tab-btn w-full flex items-center px-4 py-3 rounded-xl text-sm font-medium bg-purple-600 text-white"><i class="fa-solid fa-box w-6"></i> Mahsulotlar</button>
                <button onclick="switchTab('categories')" class="tab-btn w-full flex items-center px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800"><i class="fa-solid fa-list w-6"></i> Kategoriyalar</button>
                <button onclick="switchTab('banners')" class="tab-btn w-full flex items-center px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800"><i class="fa-solid fa-image w-6"></i> Bannerlar</button>
                <button onclick="switchTab('stories')" class="tab-btn w-full flex items-center px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800"><i class="fa-solid fa-bolt w-6"></i> Storis (Aksiya)</button>
                <button onclick="switchTab('home_sections')" class="tab-btn w-full flex items-center px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800"><i class="fa-solid fa-layer-group w-6"></i> Asosiy Bo'limlar</button>
                <button onclick="switchTab('settings')" class="tab-btn w-full flex items-center px-4 py-3 rounded-xl text-sm font-medium hover:bg-slate-800"><i class="fa-solid fa-gear w-6"></i> Sozlamalar & Import</button>
            </nav>
            <div class="p-4 border-t border-slate-800">
                <button onclick="openConfig()" class="w-full bg-slate-800 hover:bg-slate-700 text-xs py-2 rounded-lg text-slate-300"><i class="fa-solid fa-key mr-1"></i> Sozlamalarni o'zgartirish</button>
            </div>
        </aside>

        <!-- Asosiy Oyna -->
        <main class="flex-1 flex flex-col h-full overflow-hidden">
            <!-- Header -->
            <header class="bg-white border-b h-16 flex items-center justify-between px-6 shadow-sm">
                <div class="flex items-center space-x-4">
                    <h1 id="currentTitle" class="text-lg font-bold text-gray-800">Mahsulotlar</h1>
                    <span id="activeShopBadge" class="bg-purple-100 text-purple-700 text-xs px-3 py-1 rounded-full font-semibold">Do'kon: yuklanmoqda...</span>
                </div>
                <button onclick="loadData()" class="bg-gray-100 hover:bg-gray-200 p-2 rounded-lg text-sm"><i class="fa-solid fa-rotate mr-1"></i> Yangilash</button>
            </header>

            <!-- Content Area -->
            <div class="flex-1 overflow-y-auto p-6 bg-gray-50">
                <!-- Ishchi qism va jadval -->
                <div class="bg-white rounded-2xl shadow-sm border p-6">
                    <div class="flex justify-between items-center mb-6">
                        <input type="text" id="searchInput" placeholder="Qidirish..." oninput="filterTable()" class="border rounded-lg px-4 py-2 text-sm w-72 focus:ring-2 focus:ring-purple-500 outline-none">
                        <button onclick="openModal()" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition"><i class="fa-solid fa-plus mr-1"></i> Yangi qo'shish</button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse" id="dataTable">
                            <thead>
                                <tr class="border-b text-xs uppercase text-gray-500 bg-gray-50">
                                    <th class="p-3">ID</th>
                                    <th class="p-3">Rasm / Media</th>
                                    <th class="p-3">Nomi (UZ / RU)</th>
                                    <th class="p-3">Narxi / Ma'lumot</th>
                                    <th class="p-3 text-right">Amallar</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="divide-y text-sm">
                                <!-- Ma'lumotlar JS orqali to'ldiriladi -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Element qo'shish/tahrirlash Modali -->
    <div id="itemModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 id="modalTitle" class="text-lg font-bold mb-4">Ma'lumot kiritish</h3>
            <form id="itemForm" onsubmit="saveItem(event)" class="space-y-4">
                <input type="hidden" id="itemId">
                <div id="formFields">
                    <!-- Dinamik formalar -->
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded-lg text-sm">Bekor qilish</button>
                    <button type="submit" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-sm font-medium">Saqlash</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Skriptlar -->
    <script>
        let currentTab = 'products';
        let itemsData = [];

        function getConfig() {
            return {
                url: localStorage.getItem('apiUrl') || '',
                shop: localStorage.getItem('shopSlug') || 'mijoz1',
                key: localStorage.getItem('adminKey') || ''
            };
        }

        function saveConfig() {
            localStorage.setItem('apiUrl', document.getElementById('apiUrl').value.trim().replace(/\/$/, ''));
            localStorage.setItem('shopSlug', document.getElementById('shopSlug').value.trim());
            localStorage.setItem('adminKey', document.getElementById('adminKey').value.trim());
            document.getElementById('configModal').classList.add('hidden');
            init();
        }

        function openConfig() {
            const cfg = getConfig();
            document.getElementById('apiUrl').value = cfg.url;
            document.getElementById('shopSlug').value = cfg.shop;
            document.getElementById('adminKey').value = cfg.key;
            document.getElementById('configModal').classList.remove('hidden');
        }

        function init() {
            const cfg = getConfig();
            if (!cfg.url || !cfg.key) {
                openConfig();
                return;
            }
            document.getElementById('activeShopBadgeinnerText').textContent = `Do'kon: ${cfg.shop}`;
            loadData();
        }

        async function loadData() {
            const cfg = getConfig();
            try {
                const res = await fetch(`${cfg.url}/api/admin/${cfg.shop}/${currentTab}`, {
                    headers: { 'X-Admin-Key': cfg.key }
                });
                if (!res.ok) throw new Error('Yuklashda xatolik yuz berdi');
                itemsData = await res.json();
                renderTable();
            } catch (err) {
                alert(err.message);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-purple-600', 'text-white');
                b.classList.add('hover:bg-slate-800');
            });
            event.currentTarget.classList.add('bg-purple-600', 'text-white');
            document.getElementById('currentTitle').textContent = event.currentTarget.textContent.trim();
            loadData();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            if (!itemsData.length) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-gray-400">Ma'lumotlar topilmadi</td></tr>`;
                return;
            }

            itemsData.forEach(item => {
                let img = item.image || item.photo || item.icon || 'https://via.placeholder.com/50';
                let title = item.name || item.title || item.text || `Element #${item.id}`;
                let subtitle = item.titleRu || item.description || item.price ? `${item.price ? item.price + " so'm" : ''}` : '';

                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50 border-b">
                        <td class="p-3 font-semibold">#${item.id}</td>
                        <td class="p-3"><img src="${img}" class="w-10 h-10 object-cover rounded-lg border" onerror="this.src='https://via.placeholder.com/50'"></td>
                        <td class="p-3">
                            <div class="font-medium">${title}</div>
                            <div class="text-xs text-gray-400">${item.titleRu || item.category || ''}</div>
                        </td>
                        <td class="p-3 text-gray-600">${subtitle}</td>
                        <td class="p-3 text-right space-x-2">
                            <button onclick='editItem(${JSON.stringify(item)})' class="text-blue-600 hover:text-blue-800 p-1"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteItem(${item.id})" class="text-red-600 hover:text-red-800 p-1"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function openModal(item = null) {
            const fieldsContainer = document.getElementById('formFields');
            fieldsContainer.innerHTML = '';
            document.getElementById('itemId').value = item ? item.id : '';
            document.getElementById('modalTitle').textContent = item ? "Tahrirlash" : "Yangi qo'shish";

            // Tab turiga qarab formalar yasash
            if (currentTab === 'products') {
                fieldsContainer.innerHTML = `
                    <div><label class="block text-xs font-medium mb-1">Nomi (O'zbekcha):</label><input type="text" id="f_name" value="${item?.name || ''}" class="w-full border rounded p-2 text-sm"></div>
                    <div><label class="block text-xs font-medium mb-1">Nomi (Ruscha):</label><input type="text" id="f_titleRu" value="${item?.titleRu || ''}" class="w-full border rounded p-2 text-sm"></div>
                    <div><label class="block text-xs font-medium mb-1">Narxi (so'm):</label><input type="number" id="f_price" value="${item?.price || ''}" class="w-full border rounded p-2 text-sm"></div>
                    <div><label class="block text-xs font-medium mb-1">Rasm havolasi (URL):</label><input type="text" id="f_image" value="${item?.image || ''}" class="w-full border rounded p-2 text-sm"></div>
                    <div><label class="block text-xs font-medium mb-1">Kategoriya ID:</label><input type="number" id="f_categoryId" value="${item?.categoryId || 1}" class="w-full border rounded p-2 text-sm"></div>
                `;
            } else if (currentTab === 'categories') {
                fieldsContainer.innerHTML = `
                    <div><label class="block text-xs font-medium mb-1">Kategoriya nomi:</label><input type="text" id="f_name" value="${item?.name || ''}" class="w-full border rounded p-2 text-sm"></div>
                    <div><label class="block text-xs font-medium mb-1">Rasm havolasi:</label><input type="text" id="f_image" value="${item?.image || ''}" class="w-full border rounded p-2 text-sm"></div>
                `;
            } else if (currentTab === 'stories') {
                fieldsContainer.innerHTML = `
                    <div><label class="block text-xs font-medium mb-1">Sarlavha:</label><input type="text" id="f_title" value="${item?.title || ''}" class="w-full border rounded p-2 text-sm"></div>
                    <div><label class="block text-xs font-medium mb-1">Media (Rasm yoki Video URL):</label><input type="text" id="f_image" value="${item?.image || ''}" class="w-full border rounded p-2 text-sm"></div>
                    <div><label class="block text-xs font-medium mb-1">Tugash vaqti (Aksiya/Story muddati):</label><input type="datetime-local" id="f_expires" value="${item?.expires || ''}" class="w-full border rounded p-2 text-sm"></div>
                `;
            } else {
                fieldsContainer.innerHTML = `
                    <div><label class="block text-xs font-medium mb-1">Ma'lumot (JSON formatda yoki oddiy matn):</label>
                    <textarea id="f_json" rows="5" class="w-full border rounded p-2 text-sm font-mono">${item ? JSON.stringify(item, null, 2) : '{\n  "name": "Yangi"\n}'}</textarea></div>
                `;
            }

            document.getElementById('itemModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('itemModal').classList.add('hidden');
        }

        async function saveItem(e) {
            e.preventDefault();
            const cfg = getConfig();
            const id = document.getElementById('itemId').value;
            let data = {};

            if (currentTab === 'products') {
                data = {
                    id: id ? parseInt(id) : undefined,
                    name: document.getElementById('f_name').value,
                    titleRu: document.getElementById('f_titleRu').value,
                    price: parseFloat(document.getElementById('f_price').value) || 0,
                    image: document.getElementById('f_image').value,
                    categoryId: parseInt(document.getElementById('f_categoryId').value) || 1
                };
            } else if (currentTab === 'categories') {
                data = {
                    id: id ? parseInt(id) : undefined,
                    name: document.getElementById('f_name').value,
                    image: document.getElementById('f_image').value
                };
            } else {
                try {
                    data = JSON.parse(document.getElementById('f_json').value);
                } catch {
                    alert('JSON formati noto\'g\'ri!');
                    return;
                }
            }

            const method = id ? 'PUT' : 'POST';
            const url = id ? `${cfg.url}/api/admin/${cfg.shop}/${currentTab}/${id}` : `${cfg.url}/api/admin/${cfg.shop}/${currentTab}`;

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json', 'X-Admin-Key': cfg.key },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                closeModal();
                loadData();
            } else {
                const err = await res.json();
                alert('Xatolik: ' + (err.detail || 'Saqlash imkonsiz'));
            }
        }

        function editItem(item) {
            openModal(item);
        }

        async function deleteItem(id) {
            if (!confirm('Haqiqatan ham o\'chirmoqchimisiz?')) return;
            const cfg = getConfig();
            const res = await fetch(`${cfg.url}/api/admin/${cfg.shop}/${currentTab}/${id}`, {
                method: 'DELETE',
                headers: { 'X-Admin-Key': cfg.key }
            });
            if (res.ok) loadData();
            else alert('O\'chirishda xatolik');
        }

        window.onload = init;
    </script>
</body>
</html>
