<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog - Uzum Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 120px;
            overflow: hidden;
            height: 100vh;
        }

        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            z-index: 999;
            padding: 12px 16px;
            margin-top: 55px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 1300px;
            margin-left: auto;
            margin-right: auto;
        }

        .sticky-header::before {
            content: '';
            position: absolute;
            top: -60px;
            left: 0;
            right: 0;
            height: 60px;
            background: #ffffff;
            z-index: -1;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 10px;
            padding: 8px 12px;
            gap: 8px;
            border: 1px solid transparent;
            transition: border-color 0.2s;
            width: 100%;
        }

        .search-box:focus-within {
            border-color: var(--primary);
            background: #ffffff;
        }

        .search-box svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 2;
            flex-shrink: 0;
        }

        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            width: 100%;
            color: var(--text);
        }

        .search-box input::placeholder {
            color: var(--muted);
        }

        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-height: 350px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .search-dropdown.show {
            display: block;
        }

        .search-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            background: #fafafc;
        }

        .clear-history-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }

        .search-suggestion-item {
            padding: 12px 14px;
            font-size: 13px;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
        }

        .search-suggestion-item:last-child {
            border-bottom: none;
        }

        .search-suggestion-item:hover {
            background: var(--primary-bg);
            color: var(--primary);
        }

        .suggestion-type {
            font-size: 11px;
            color: var(--muted);
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .history-item-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .remove-history-item {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 16px;
            padding: 4px 8px;
            cursor: pointer;
        }

        .remove-history-item:hover {
            color: #ff3b30;
        }

        /* Asosiy konteyner */
        .catalog-container {
            max-width: 1300px;
            margin: 125px auto 0 auto;
            padding: 12px 16px;
            display: flex;
            gap: 12px;
            height: calc(100vh - 130px);
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .catalog-container {
                padding: 6px 8px;
                gap: 8px;
                height: calc(100vh - 110px);
            }
        }

        /* 1. Chap tomon: Yozuvli asosiy kategoriyalar (Mustaqil vertical scroll) */
        .sidebar-categories {
            width: 130px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0;
            padding: 6px;
            height: 100%;
            scrollbar-width: none;
        }

        @media (min-width: 768px) {
            .sidebar-categories {
                width: 220px;
                padding: 8px;
            }
        }

        .sidebar-categories::-webkit-scrollbar { display: none; }

        .sidebar-item {
            padding: 12px 10px;
            font-size: 12px;
            font-weight: 500;
            color: #7d818c;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.35;
            border-radius: 8px;
            position: relative;
            margin-bottom: 4px;
        }

        @media (min-width: 768px) {
            .sidebar-item {
                padding: 14px 14px;
                font-size: 13px;
            }
        }

        .sidebar-item.active {
            color: var(--primary);
            font-weight: 700;
            background: var(--primary-bg);
        }

        .sidebar-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 20px;
            background: var(--primary);
            border-radius: 0 4px 4px 0;
        }

        /* 2. O'ng tomon: Doirali kategoriyalar (Qat'iy 3 ta ustun va mustaqil vertical scroll) */
        .content-panel {
            flex: 1;
            padding: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            height: 100%;
        }

        @media (min-width: 768px) {
            .content-panel {
                padding: 24px;
                border-radius: 16px;
            }
        }

        .panel-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 16px;
        }

        @media (min-width: 768px) {
            .panel-title { font-size: 18px; }
        }

        .subcats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Qat'iy 3 ta ustun */
            gap: 16px 12px;
        }

        @media (min-width: 768px) {
            .subcats-grid { grid-template-columns: repeat(3, 1fr); gap: 24px 20px; }
        }
        @media (min-width: 1024px) {
            .subcats-grid { grid-template-columns: repeat(3, 1fr); gap: 28px 24px; }
        }

        .subcat-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
            width: 100%;
        }

        .subcat-img-wrap {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--bg);
            overflow: hidden;
            margin-bottom: 8px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .subcat-img-wrap { width: 90px; height: 90px; }
        }

        .subcat-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .subcat-name {
            font-size: 11px;
            font-weight: 500;
            line-height: 1.3;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            width: 100%;
        }

        @media (min-width: 768px) {
            .subcat-name { font-size: 12px; }
        }

        .bottom-nav {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            height: 64px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        @media (min-width: 1024px) { .bottom-nav { max-width: 550px; } }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #808080;
            font-size: 10px;
            font-weight: 500;
            width: 20%;
            position: relative;
            cursor: pointer;
            padding: 8px 0;
            touch-action: manipulation;
        }

        .nav-icon-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .nav-item span { pointer-events: none; }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #808080;
            stroke-width: 1.8;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        .nav-item.active svg {
            stroke: var(--primary);
            fill: var(--primary-bg);
            transform: scale(1.05);
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -8px;
            background: #000;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 17px;
            height: 17px;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .badge-count.show { display: flex; }
    </style>
</head>
<body>

    <div class="sticky-header">
        <div class="search-box-wrapper">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Mahsulotlar va turkumlar izlash..." data-i18n-placeholder="search_placeholder" onfocus="showSearchHistory()" oninput="handleLiveSearch(event)" onkeypress="handleSearch(event)" autocomplete="off">
            </div>
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>
    </div>

    <div class="catalog-container">
        <div class="sidebar-categories" id="sidebarCategories"></div>
        <div class="content-panel" id="contentPanel"></div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
            <span data-i18n="nav_home">Bosh sahifa</span>
        </a>
        <a href="categories.html" class="nav-item active">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg></div>
            <span data-i18n="nav_catalog">Katalog</span>
        </a>
        <a href="cart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><div class="badge-count" id="cartBadge">0</div></div>
            <span data-i18n="nav_cart">Savatcha</span>
        </a>
        <a href="heart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><div class="badge-count" id="favBadge">0</div></div>
            <span data-i18n="nav_fav">Saralangan</span>
        </a>
        <a href="profil.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
            <span data-i18n="nav_profile">Profil</span>
        </a>
    </nav>

    <script>
        const translations = {
            uz: {
                search_placeholder: "Mahsulotlar va turkumlar izlash...",
                history_title: "Oxirgi qidiruvlar",
                clear_history: "Tozalash",
                no_results: "Hech narsa topilmadi...",
                search_all_label: "bo'yicha barcha natijalarni ko'rish",
                search_type: "Qidirish",
                category_type: "Bo'lim",
                subcat_type: "Turkum",
                product_type: "Mahsulot",
                nav_home: "Bosh sahifa",
                nav_catalog: "Katalog",
                nav_cart: "Savatcha",
                nav_fav: "Saralangan",
                nav_profile: "Profil"
            },
            ru: {
                search_placeholder: "Поиск товаров и категорий...",
                history_title: "История поиска",
                clear_history: "Очистить",
                no_results: "Ничего не найдено...",
                search_all_label: "посмотреть все результаты для",
                search_type: "Поиск",
                category_type: "Раздел",
                subcat_type: "Категория",
                product_type: "Товар",
                nav_home: "Главная",
                nav_catalog: "Каталог",
                nav_cart: "Корзина",
                nav_fav: "Избранное",
                nav_profile: "Профиль"
            }
        };

        let currentLang = localStorage.getItem('selected_lang') || 'uz';
        let t = translations[currentLang] || translations['uz'];
        let categoriesData = [];
        let allProducts = [];
        let activeCatId = parseInt(localStorage.getItem('active_cat_id')) || 1;

        function applyTranslations() {
            currentLang = localStorage.getItem('selected_lang') || 'uz';
            t = translations[currentLang] || translations['uz'];

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });
        }

        function getLocalized(field) {
            if (!field) return '';
            if (typeof field === 'object') {
                return field[currentLang] || field['uz'] || Object.values(field)[0] || '';
            }
            return field;
        }

        function getStrictLocalized(field) {
            if (!field) return '';
            if (typeof field === 'object') {
                return field[currentLang] || '';
            }
            return '';
        }

        async function fetchDatabaseAndInit() {
            currentLang = localStorage.getItem('selected_lang') || 'uz';

            try {
                let res = await fetch('/api/products');
                if (res.ok) {
                    let db = await res.json();
                    categoriesData = db.categories || [];
                    allProducts = db.products || [];
                }
            } catch (err) {
                try {
                    let resDb = await fetch('database.json');
                    if (resDb.ok) {
                        let db = await resDb.json();
                        categoriesData = db.categories || [];
                        allProducts = db.products || [];
                    }
                } catch (e) {
                    console.error("Bazadan ma'lumotlarni o'qib bo'lmadi:", e);
                }
            }

            renderCatalog();
            updateBadges();

            let savedScroll = localStorage.getItem('catalog_content_scroll');
            if (savedScroll) {
                setTimeout(() => {
                    const panel = document.getElementById('contentPanel');
                    if (panel) panel.scrollTop = parseInt(savedScroll);
                }, 50);
            }
        }

        function renderCatalog() {
            applyTranslations();
            const sidebar = document.getElementById('sidebarCategories');
            const panel = document.getElementById('contentPanel');

            if (!categoriesData || categoriesData.length === 0) return;

            sidebar.innerHTML = categoriesData.map(c => `
                <div class="sidebar-item ${c.id === activeCatId ? 'active' : ''}" onclick="selectCategory(${c.id})">
                    ${getLocalized(c.name)}
                </div>
            `).join('');

            const currentCat = categoriesData.find(c => c.id === activeCatId) || categoriesData[0];

            panel.innerHTML = `
                <div class="panel-title">${getLocalized(currentCat.name)}</div>
                <div class="subcats-grid">
                    ${currentCat.subcats.map(sub => {
                        const subName = getLocalized(sub.name);
                        return `
                            <a href="products.html?cat_id=${currentCat.id}&sub=${encodeURIComponent(subName)}" class="subcat-card" onclick="saveScrollPosition()">
                                <div class="subcat-img-wrap">
                                    <img src="${sub.img}" alt="${subName}" class="subcat-img">
                                </div>
                                <span class="subcat-name">${subName}</span>
                            </a>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function selectCategory(id) {
            activeCatId = id;
            localStorage.setItem('active_cat_id', id);
            const panel = document.getElementById('contentPanel');
            if (panel) panel.scrollTop = 0;
            localStorage.removeItem('catalog_content_scroll');
            renderCatalog();
        }

        function saveScrollPosition() {
            localStorage.setItem('active_cat_id', activeCatId);
            const panel = document.getElementById('contentPanel');
            if (panel) {
                localStorage.setItem('catalog_content_scroll', panel.scrollTop);
            }
        }

        function getSearchHistory() {
            return JSON.parse(localStorage.getItem('search_history')) || [];
        }

        function saveSearchQuery(q) {
            if (!q) return;
            let history = getSearchHistory();
            history = history.filter(item => item.toLowerCase() !== q.toLowerCase());
            history.unshift(q);
            if (history.length > 5) history = history.slice(0, 5);
            localStorage.setItem('search_history', JSON.stringify(history));
        }

        function showSearchHistory() {
            const val = document.getElementById('searchInput').value.trim();
            const dropdown = document.getElementById('searchDropdown');
            if (val.length > 0) return;

            let history = getSearchHistory();
            if (history.length === 0) {
                dropdown.classList.remove('show');
                return;
            }

            let html = `
                <div class="search-header-row">
                    <span>${t.history_title}</span>
                    <button class="clear-history-btn" onclick="clearAllHistory(event)">${t.clear_history}</button>
                </div>
            `;

            history.forEach((item, index) => {
                html += `
                    <div class="search-suggestion-item" onclick="selectHistoryItem('${item.replace(/'/g, "\\'")}')">
                        <div class="history-item-left">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            <span>${item}</span>
                        </div>
                        <button class="remove-history-item" onclick="removeHistoryItem(event, ${index})">&times;</button>
                    </div>
                `;
            });

            dropdown.innerHTML = html;
            dropdown.classList.add('show');
        }

        function clearAllHistory(e) {
            e.stopPropagation();
            localStorage.removeItem('search_history');
            document.getElementById('searchDropdown').classList.remove('show');
        }

        function removeHistoryItem(e, index) {
            e.stopPropagation();
            let history = getSearchHistory();
            history.splice(index, 1);
            localStorage.setItem('search_history', JSON.stringify(history));
            showSearchHistory();
        }

        function selectHistoryItem(item) {
            document.getElementById('searchInput').value = item;
            document.getElementById('searchDropdown').classList.remove('show');
            saveSearchQuery(item);
            window.location.href = `products.html?q=${encodeURIComponent(item)}`;
        }

        function handleLiveSearch(e) {
            const val = e.target.value.trim().toLowerCase();
            const dropdown = document.getElementById('searchDropdown');

            if (val.length === 0) {
                showSearchHistory();
                return;
            }

            let matchedMainCats = [];
            let matchedSubcats = [];
            let matchedProducts = [];

            categoriesData.forEach(cat => {
                let catNameStr = getStrictLocalized(cat.name).toLowerCase();
                if (catNameStr.includes(val)) {
                    matchedMainCats.push({ catId: cat.id, catName: getLocalized(cat.name) });
                }
                cat.subcats.forEach(sub => {
                    let subNameStr = getStrictLocalized(sub.name).toLowerCase();
                    if (subNameStr.includes(val)) {
                        matchedSubcats.push({ catId: cat.id, subName: getLocalized(sub.name), catName: getLocalized(cat.name) });
                    }
                });
            });

            matchedProducts = allProducts.filter(p => {
                let pNameStr = getStrictLocalized(p.name).toLowerCase();
                return pNameStr.includes(val);
            });

            let html = '';

            if (matchedMainCats.length > 0 || matchedSubcats.length > 0 || matchedProducts.length > 0) {
                html += `<div class="search-suggestion-item" onclick="saveSearchQuery('${val.replace(/'/g, "\\'")}'); window.location.href='products.html?q=${encodeURIComponent(val)}'">
                    <span>"${val}" ${t.search_all_label}</span>
                    <span class="suggestion-type">${t.search_type}</span>
                </div>`;

                matchedMainCats.forEach(item => {
                    html += `<div class="search-suggestion-item" onclick="selectCategoryFromSearch(${item.catId})">
                        <span>${item.catName}</span>
                        <span class="suggestion-type">${t.category_type}</span>
                    </div>`;
                });

                matchedSubcats.forEach(item => {
                    html += `<div class="search-suggestion-item" onclick="selectSubcatFromSearch(${item.catId}, '${item.subName.replace(/'/g, "\\'")}')">
                        <span>${item.subName} <small style="color:var(--muted)">(${item.catName})</small></span>
                        <span class="suggestion-type">${t.subcat_type}</span>
                    </div>`;
                });

                matchedProducts.slice(0, 8).forEach(prod => {
                    let pName = getLocalized(prod.name);
                    html += `<div class="search-suggestion-item" onclick="saveSearchQuery('${pName.replace(/'/g, "\\'")}'); window.location.href='product.html?id=${prod.id}'">
                        <span>${pName}</span>
                        <span class="suggestion-type">${t.product_type}</span>
                    </div>`;
                });
            } else {
                html += `<div class="search-suggestion-item" style="color: var(--muted); justify-content: center;">${t.no_results}</div>`;
            }

            dropdown.innerHTML = html;
            dropdown.classList.add('show');
        }

        function selectCategoryFromSearch(catId) {
            localStorage.setItem('active_cat_id', catId);
            document.getElementById('searchDropdown').classList.remove('show');
            selectCategory(catId);
            document.getElementById('searchInput').value = '';
        }

        function selectSubcatFromSearch(catId, subName) {
            localStorage.setItem('active_cat_id', catId);
            window.location.href = `products.html?cat_id=${catId}&sub=${encodeURIComponent(subName)}`;
        }

        function handleSearch(e) {
            if (e.key === 'Enter') {
                const query = document.getElementById('searchInput').value.trim();
                const dropdown = document.getElementById('searchDropdown');
                if (dropdown) dropdown.classList.remove('show');
                if (query) {
                    saveSearchQuery(query);
                    window.location.href = `products.html?q=${encodeURIComponent(query)}`;
                }
            }
        }

        document.addEventListener('click', (e) => {
            const wrapper = document.querySelector('.search-box-wrapper');
            const dropdown = document.getElementById('searchDropdown');
            if (wrapper && !wrapper.contains(e.target)) {
                if (dropdown) dropdown.classList.remove('show');
            }
        });

        function updateBadges() {
            let favs = JSON.parse(localStorage.getItem('fav_products')) || [];
            let cart = JSON.parse(localStorage.getItem('cart_products')) || [];
            const favBadge = document.getElementById('favBadge');
            const cartBadge = document.getElementById('cartBadge');

            if (favs.length > 0) {
                favBadge.textContent = favs.length;
                favBadge.classList.add('show');
            } else {
                favBadge.classList.remove('show');
            }

            let totalCartCount = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
            if (totalCartCount > 0) {
                cartBadge.textContent = totalCartCount;
                cartBadge.classList.add('show');
            } else {
                cartBadge.classList.remove('show');
            }
        }

        window.addEventListener('pageshow', fetchDatabaseAndInit);
        window.addEventListener('DOMContentLoaded', fetchDatabaseAndInit);
    </script>
</body>
</html>
