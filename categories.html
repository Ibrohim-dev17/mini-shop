<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog - Uzum Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--card);
            color: var(--text);
            padding-bottom: 100px;
            overflow: hidden;
            height: 100vh;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            background: var(--card);
            z-index: 999;
            padding: 45px 16px 10px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            flex-shrink: 0;
            cursor: pointer;
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            stroke: var(--text);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 10px;
            padding: 8px 12px;
            gap: 8px;
        }

        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            width: 100%;
            color: var(--text);
        }

        /* IKKI USTUNLI MUSTAQIL SCROLL LAYOUT */
        .catalog-layout {
            display: flex;
            height: calc(100vh - 165px);
            width: 100%;
            overflow: hidden;
            background: var(--bg);
        }

        /* CHAP TARAF MATNLI PANEL (MUSTAQIL SCROLL) */
        .sidebar-categories {
            width: 135px;
            background: #ffffff;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0;
            scrollbar-width: none;
            padding: 8px 0 100px 0;
            height: 100%;
        }

        .sidebar-categories::-webkit-scrollbar {
            display: none;
        }

        .sidebar-item {
            padding: 16px 12px;
            font-size: 13px;
            font-weight: 500;
            color: #7d818c;
            cursor: pointer;
            transition: all 0.15s ease;
            line-height: 1.3;
            position: relative;
        }

        .sidebar-item.active {
            color: var(--text);
            font-weight: 700;
            background: var(--bg);
        }

        .sidebar-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--primary);
        }

        /* O'NG TARAF RASMLI PANEL (MUSTAQIL SCROLL, CHETGA CHIQMAYDI) */
        .content-panel {
            flex: 1;
            padding: 14px 12px 100px 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: var(--card);
            height: 100%;
            box-sizing: border-box;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 14px;
        }

        .subcats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px 8px;
            width: 100%;
        }

        @media (max-width: 380px) {
            .sidebar-categories { width: 120px; }
            .subcats-grid { gap: 10px 4px; }
        }

        .subcat-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
            width: 100%;
        }

        .subcat-img-wrap {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: var(--bg);
            overflow: hidden;
            margin-bottom: 6px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .subcat-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .subcat-name {
            font-size: 11px;
            font-weight: 500;
            line-height: 1.2;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            width: 100%;
        }

        /* PASTKI NAVIGATSIYA */
        .bottom-nav {
            position: fixed;
            bottom: calc(15px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            height: 60px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #808080;
            font-size: 10px;
            font-weight: 500;
            width: 20%;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: #808080;
            stroke-width: 1.8;
        }

        .nav-item.active svg {
            stroke: var(--primary);
            fill: var(--primary-bg);
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -8px;
            background: #000;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 17px;
            height: 17px;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }
        .badge-count.show { display: flex; }
    </style>
</head>
<body>

    <div class="sticky-header">
        <a onclick="history.back()" class="back-btn" title="Orqaga">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </a>
        <div class="search-box-wrapper">
            <div class="search-box">
                <svg width="18" height="18" fill="none" stroke="var(--muted)" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Mahsulotlar va turkumlar izlash...">
            </div>
        </div>
    </div>

    <div class="catalog-layout">
        <div class="sidebar-categories" id="sidebarCategories"></div>
        <div class="content-panel" id="contentPanel"></div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Bosh sahifa</span>
        </a>
        <a href="categories.html" class="nav-item active">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
            <span>Katalog</span>
        </a>
        <a href="cart.html" class="nav-item">
            <div style="position:relative;"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><div class="badge-count" id="cartBadge">0</div></div>
            <span>Savatcha</span>
        </a>
        <a href="heart.html" class="nav-item">
            <div style="position:relative;"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><div class="badge-count" id="favBadge">0</div></div>
            <span>Saralangan</span>
        </a>
        <a href="profil.html" class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profil</span>
        </a>
    </nav>

    <script>
        const CATEGORIES_DATA = [
            {
                id: 1,
                name: "Women's Clothing",
                subcats: [
                    { name: "Ko'ylaklar", img: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=200&auto=format&fit=crop&q=80" },
                    { name: "Kurtkalar", img: "https://images.unsplash.com/photo-1544441893-675973e31985?w=200&auto=format&fit=crop&q=80" },
                    { name: "Ichki kiyimlar", img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=200&auto=format&fit=crop&q=80" },
                    { name: "Shapkalar", img: "https://images.unsplash.com/photo-1576871337632-b9aef4c17ab9?w=200&auto=format&fit=crop&q=80" },
                    { name: "Jinsilar", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=200&auto=format&fit=crop&q=80" },
                    { name: "Futbolkalar", img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=200&auto=format&fit=crop&q=80" }
                ]
            },
            {
                id: 2,
                name: "Home & Kitchen",
                subcats: [
                    { name: "Tapichka", img: "https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=200&auto=format&fit=crop&q=80" },
                    { name: "To'qima buyumlar", img: "https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=200&auto=format&fit=crop&q=80" },
                    { name: "Idish-tovoqlar", img: "https://images.unsplash.com/photo-1610701596007-11502861dcfa?w=200&auto=format&fit=crop&q=80" }
                ]
            },
            {
                id: 3,
                name: "Kid's Fashion",
                subcats: [
                    { name: "O'yinchoqlar", img: "https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=200&auto=format&fit=crop&q=80" },
                    { name: "Bolalar kiyimlari", img: "https://images.unsplash.com/photo-1522771930-78848d9293e8?w=200&auto=format&fit=crop&q=80" }
                ]
            },
            {
                id: 4,
                name: "Men's Clothing",
                subcats: [
                    { name: "Kurtkalar", img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=200&auto=format&fit=crop&q=80" },
                    { name: "Sportivniy", img: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=200&auto=format&fit=crop&q=80" },
                    { name: "Koylaklar", img: "https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=200&auto=format&fit=crop&q=80" }
                ]
            },
            {
                id: 5,
                name: "Beauty & Health",
                subcats: [
                    { name: "Kosmetika", img: "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=200&auto=format&fit=crop&q=80" },
                    { name: "Parfyuriya", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200&auto=format&fit=crop&q=80" }
                ]
            },
            {
                id: 6,
                name: "Accessories",
                subcats: [
                    { name: "Shapkalar", img: "https://images.unsplash.com/photo-1534215754734-18e55d134346?w=200&auto=format&fit=crop&q=80" },
                    { name: "Sumkalar", img: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=200&auto=format&fit=crop&q=80" },
                    { name: "Ko'zoynaklar", img: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=200&auto=format&fit=crop&q=80" }
                ]
            }
        ];

        let activeCatId = 1;

        function renderCatalog() {
            const sidebar = document.getElementById('sidebarCategories');
            const panel = document.getElementById('contentPanel');

            sidebar.innerHTML = CATEGORIES_DATA.map(c => `
                <div class="sidebar-item ${c.id === activeCatId ? 'active' : ''}" onclick="selectCategory(${c.id})">
                    ${c.name}
                </div>
            `).join('');

            const currentCat = CATEGORIES_DATA.find(c => c.id === activeCatId) || CATEGORIES_DATA[0];

            panel.innerHTML = `
                <div class="panel-title">${currentCat.name}</div>
                <div class="subcats-grid">
                    ${currentCat.subcats.map(sub => `
                        <a href="products.html?sub=${encodeURIComponent(sub.name)}" class="subcat-card">
                            <div class="subcat-img-wrap">
                                <img src="${sub.img}" alt="${sub.name}" class="subcat-img">
                            </div>
                            <span class="subcat-name">${sub.name}</span>
                        </a>
                    `).join('')}
                </div>
            `;
        }

        function selectCategory(id) {
            activeCatId = id;
            renderCatalog();
        }

        renderCatalog();
    </script>
</body>
</html>
