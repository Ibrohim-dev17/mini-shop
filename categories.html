<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog - Uzum Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 120px;
            overflow: hidden;
            height: 100vh;
        }

        .header-search-container {
            padding: 50px 16px 12px 16px;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 999;
            border-bottom: 1px solid var(--border);
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 10px;
            padding: 8px 12px;
            gap: 8px;
            border: 1px solid transparent;
            transition: border-color 0.2s;
            width: 100%;
        }

        .search-box:focus-within {
            border-color: var(--primary);
            background: #ffffff;
        }

        .search-box svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 2;
            flex-shrink: 0;
        }

        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            width: 100%;
            color: var(--text);
        }

        .search-box input::placeholder {
            color: var(--muted);
        }

        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-height: 350px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .search-dropdown.show {
            display: block;
        }

        .search-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
        }

        .clear-history-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }

        .search-suggestion-item {
            padding: 12px 14px;
            font-size: 13px;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .search-suggestion-item:last-child {
            border-bottom: none;
        }

        .search-suggestion-item:hover {
            background: var(--primary-bg);
            color: var(--primary);
        }

        .suggestion-type {
            font-size: 11px;
            color: var(--muted);
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .history-item-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .remove-history-item {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 16px;
            padding: 4px 8px;
            cursor: pointer;
        }

        .remove-history-item:hover {
            color: #ff3b30;
        }

        .catalog-layout {
            display: flex;
            height: calc(100vh - 130px);
            position: relative;
            overflow: hidden;
            background: var(--bg);
        }

        .sidebar-categories {
            width: 145px;
            background: #ffffff;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0;
            scrollbar-width: none;
            padding: 12px 0;
            height: 100%;
        }

        .sidebar-categories::-webkit-scrollbar {
            display: none;
        }

        .sidebar-item {
            padding: 14px 10px;
            font-size: 13px;
            font-weight: 500;
            color: #7d818c;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.35;
            position: relative;
        }

        .sidebar-item.active {
            color: var(--primary);
            font-weight: 700;
            background: transparent;
        }

        .sidebar-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 20px;
            background: var(--primary);
            border-radius: 0 4px 4px 0;
        }

        .content-panel {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: var(--card);
            height: 100%;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 14px;
        }

        .subcats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px 8px;
        }

        .subcat-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
        }

        .subcat-img-wrap {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            background: var(--bg);
            overflow: hidden;
            margin-bottom: 6px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            flex-shrink: 0;
        }

        .subcat-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .subcat-name {
            font-size: 11px;
            font-weight: 500;
            line-height: 1.2;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            width: 100%;
        }

        .bottom-nav {
            position: fixed;
            bottom: calc(40px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            height: 64px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #808080;
            font-size: 10px;
            font-weight: 500;
            width: 20%;
            position: relative;
            cursor: pointer;
            padding: 8px 0;
            touch-action: manipulation;
        }

        .nav-icon-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .nav-item span {
            pointer-events: none;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #808080;
            stroke-width: 1.8;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        .nav-item.active svg {
            stroke: var(--primary);
            fill: var(--primary-bg);
            transform: scale(1.05);
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -8px;
            background: #000;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 17px;
            height: 17px;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .badge-count.show { display: flex; }
    </style>
</head>
<body>

    <div class="header-search-container">
        <div class="search-box-wrapper">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Mahsulotlar va turkumlar izlash..." onfocus="showSearchHistory()" oninput="handleLiveSearch(event)" onkeypress="handleSearch(event)">
            </div>
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>
    </div>

    <div class="catalog-layout">
        <div class="sidebar-categories" id="sidebarCategories"></div>
        <div class="content-panel" id="contentPanel"></div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">

            <span>Bosh sahifa</span>

        <a href="categories.html" class="nav-item active">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg></div>

    <script>
        const CATEGORIES_DATA = [
            {
                id: 1,
                name: "Ayollar kiyimlari",
                subcats: [
                    { name: "Ko'ylaklar", img: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=200&auto=format&fit=crop&q=80" },
                    { name: "Kurtkalar", img: "https://images.unsplash.com/photo-1544441893-675973e31985?w=200&auto=format&fit=crop&q=80" },
                    { name: "Ichki kiyimlar", img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=200&auto=format&fit=crop&q=80" },
                    { name: "Jinsilar", img: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=200&auto=format&fit=crop&q=80" },
                    { name: "Futbolkalar", img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=200&auto=format&fit=crop&q=80" }
                ]
            },
            {
                id: 2,
                name: "Erkaklar kiyimlari",
                subcats: [
                    { name: "Erkaklar kurtkalari", img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=200&auto=format&fit=crop&q=80" },
                    { name: "Sportivniy", img: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=200&auto=format&fit=crop&q=80" },
                    { name: "Erkaklar ko'ylaklari", img: "https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=200&auto=format&fit=crop&q=80" },
                    { name: "Erkaklar jinsilari", img: "https://images.unsplash.com/photo-1542272604-787c3835535d?w=200&auto=format&fit=crop&q=80" }
                ]
            },
            {
                id: 3,
                name: "Oyoq kiyimlar",
                subcats: [
                    { name: "Tapichka", img: "https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=200&auto=format&fit=crop&q=80" },
                    { name: "Krossovkalar", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=200&auto=format&fit=crop&q=80" },
                    { name: "Tuflilar", img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=200&auto=format&fit=crop&q=80" },
                    { name: "Qishki etiklar", img: "https://images.unsplash.com/photo-1608256246200-53e635b5b65f?w=200&auto=format&fit=crop&q=80" }
                ]
            },
            {
                id: 4,
                name: "Aksessuarlar",
                subcats: [
                    { name: "Shapkalar", img: "https://images.unsplash.com/photo-1534215754734-18e55d134346?w=200&auto=format&fit=crop&q=80" },
                    { name: "Sumkalar", img: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=200&auto=format&fit=crop&q=80" },
                    { name: "Soatlar", img: "https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=200&auto=format&fit=crop&q=80" },
                    { name: "Ko'zoynaklar", img: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=200&auto=format&fit=crop&q=80" }
                ]
            },
            {
                id: 5,
                name: "Uy uchun",
                subcats: [
                    { name: "Uy tapichkalari", img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=200&auto=format&fit=crop&q=80" },
                    { name: "To'qima buyumlar", img: "https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=200&auto=format&fit=crop&q=80" },
                    { name: "Idish-tovoqlar", img: "https://images.unsplash.com/photo-1610701596007-11502861dcfa?w=200&auto=format&fit=crop&q=80" }
                ]
            }
        ];

        // Barcha mahsulotlar bazasi (qidiruv uchun)
        const ALL_PRODUCTS_DB = [
            { id: 101, name: "Ayollar uchun zamonaviy oq ko'ylak", subcat: "Ko'ylaklar" },
            { id: 102, name: "Kechki qora libos", subcat: "Ko'ylaklar" },
            { id: 103, name: "Yozgi yengil gulli ko'ylak", subcat: "Ko'ylaklar" },
            { id: 104, name: "Klassik ishbilarmon ko'ylak", subcat: "Ko'ylaklar" },
            { id: 105, name: "Qizil tantanali ko'ylak", subcat: "Ko'ylaklar" },
            { id: 106, name: "Trikotaj kundalik ko'ylak", subcat: "Ko'ylaklar" },
            { id: 201, name: "Ayollar uchun elegante charm sumka", subcat: "Sumkalar" },
            { id: 202, name: "Kichik yelka sumkasi (Clutch)", subcat: "Sumkalar" },
            { id: 203, name: "Kundalik shopper sumka", subcat: "Sumkalar" },
            { id: 204, name: "Sport uslubidagi ruksak-sumka", subcat: "Sumkalar" },
            { id: 205, name: "Klassik qora ish sumkasi", subcat: "Sumkalar" },
            { id: 206, name: "Brendoviy zanjirli sumka", subcat: "Sumkalar" },
            { id: 301, name: "Quyoshdan saqlovchi qora ko'zoynak", subcat: "Ko'zoynaklar" },
            { id: 302, name: "Kvadrat shakldagi imidj ko'zoynagi", subcat: "Ko'zoynaklar" },
            { id: 303, name: "Aviator uslubidagi quyosh ko'zoynagi", subcat: "Ko'zoynaklar" },
            { id: 304, name: "Dumaloq dizaynli retro ko'zoynak", subcat: "Ko'zoynaklar" },
            { id: 305, name: "Sportivniy velosipedchi ko'zoynagi", subcat: "Ko'zoynaklar" },
            { id: 306, name: "Kompyuter uchun nurlar himoyali", subcat: "Ko'zoynaklar" }
        ];

        let activeCatId = parseInt(localStorage.getItem('active_cat_id')) || 1;

        function renderCatalog() {
            const sidebar = document.getElementById('sidebarCategories');
            const panel = document.getElementById('contentPanel');

            sidebar.innerHTML = CATEGORIES_DATA.map(c => `
                <div class="sidebar-item ${c.id === activeCatId ? 'active' : ''}" onclick="selectCategory(${c.id})">
                    ${c.name}
                </div>
            `).join('');

            const currentCat = CATEGORIES_DATA.find(c => c.id === activeCatId) || CATEGORIES_DATA[0];

            panel.innerHTML = `
                <div class="panel-title">${currentCat.name}</div>
                <div class="subcats-grid">
                    ${currentCat.subcats.map(sub => `
                        <a href="products.html?cat_id=${currentCat.id}&sub=${encodeURIComponent(sub.name)}" class="subcat-card" onclick="localStorage.setItem('active_cat_id', ${currentCat.id})">
                            <div class="subcat-img-wrap">
                                <img src="${sub.img}" alt="${sub.name}" class="subcat-img">
                            </div>
                            <span class="subcat-name">${sub.name}</span>
                        </a>
                    `).join('')}
                </div>
            `;
        }

        function selectCategory(id) {
            activeCatId = id;
            localStorage.setItem('active_cat_id', id);
            renderCatalog();
        }

        function getSearchHistory() {
            return JSON.parse(localStorage.getItem('search_history')) || [];
        }

        function saveSearchQuery(q) {
            if (!q) return;
            let history = getSearchHistory();
            history = history.filter(item => item.toLowerCase() !== q.toLowerCase());
            history.unshift(q);
            if (history.length > 5) history = history.slice(0, 5);
            localStorage.setItem('search_history', JSON.stringify(history));
        }

        function showSearchHistory() {
            const val = document.getElementById('searchInput').value.trim();
            const dropdown = document.getElementById('searchDropdown');
            if (val.length > 0) return;

            let history = getSearchHistory();
            if (history.length === 0) {
                dropdown.classList.remove('show');
                return;
            }

            let html = `
                <div class="search-header-row">
                    <span>Oxirgi qidiruvlar</span>
                    <button class="clear-history-btn" onclick="clearAllHistory(event)">Tozalash</button>
                </div>
            `;

            history.forEach((item, index) => {
                html += `
                    <div class="search-suggestion-item" onclick="selectHistoryItem('${item}')">
                        <div class="history-item-left">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            <span>${item}</span>
                        </div>
                        <button class="remove-history-item" onclick="removeHistoryItem(event, ${index})">&times;</button>
                    </div>
                `;
            });

            dropdown.innerHTML = html;
            dropdown.classList.add('show');
        }

        function clearAllHistory(e) {
            e.stopPropagation();
            localStorage.removeItem('search_history');
            document.getElementById('searchDropdown').classList.remove('show');
        }

        function removeHistoryItem(e, index) {
            e.stopPropagation();
            let history = getSearchHistory();
            history.splice(index, 1);
            localStorage.setItem('search_history', JSON.stringify(history));
            showSearchHistory();
        }

        function selectHistoryItem(item) {
            document.getElementById('searchInput').value = item;
            document.getElementById('searchDropdown').classList.remove('show');
            saveSearchQuery(item);
            window.location.href = `search.html?q=${encodeURIComponent(item)}`;
        }

        // BARCHA KATEGORIYA VA MAHSULOTLAR ICHIDAN TEZKOR (LIVE) QIDIRISH
        function handleLiveSearch(e) {
            const val = e.target.value.trim().toLowerCase();
            const dropdown = document.getElementById('searchDropdown');

            if (val.length === 0) {
                showSearchHistory();
                return;
            }

            let matchedSubcats = [];
            let matchedProducts = [];

            // Barcha asosiy va kichik kategoriyalardan qidirish
            CATEGORIES_DATA.forEach(cat => {
                cat.subcats.forEach(sub => {
                    if (sub.name.toLowerCase().includes(val) || cat.name.toLowerCase().includes(val)) {
                        matchedSubcats.push({ catId: cat.id, subName: sub.name, catName: cat.name });
                    }
                });
            });

            // Barcha mahsulotlar bazasidan qidirish
            matchedProducts = ALL_PRODUCTS_DB.filter(p => p.name.toLowerCase().includes(val));

            let html = '';

            if (matchedSubcats.length > 0 || matchedProducts.length > 0) {
                html += `<div class="search-suggestion-item" onclick="saveSearchQuery('${val}'); window.location.href='search.html?q=${encodeURIComponent(val)}'">
                    <span>"${val}" bo'yicha barcha natijalarni ko'rish</span>
                    <span class="suggestion-type">Qidirish</span>
                </div>`;

                matchedSubcats.forEach(item => {
                    html += `<div class="search-suggestion-item" onclick="selectSubcatFromSearch(${item.catId}, '${item.subName}')">
                        <span>${item.subName} <small style="color:var(--muted)">(${item.catName})</small></span>
                        <span class="suggestion-type">Turkum</span>
                    </div>`;
                });

                matchedProducts.forEach(prod => {
                    html += `<div class="search-suggestion-item" onclick="saveSearchQuery('${prod.name}'); window.location.href='product.html?id=${prod.id}'">
                        <span>${prod.name}</span>
                        <span class="suggestion-type">Mahsulot</span>
                    </div>`;
                });
            } else {
                html += `<div class="search-suggestion-item" style="color: var(--muted); justify-content: center;">Hech narsa topilmadi...</div>`;
            }

            dropdown.innerHTML = html;
            dropdown.classList.add('show');
        }

        function selectSubcatFromSearch(catId, subName) {
            localStorage.setItem('active_cat_id', catId);
            window.location.href = `products.html?cat_id=${catId}&sub=${encodeURIComponent(subName)}`;
        }

        function handleSearch(e) {
            if (e.key === 'Enter') {
                const query = document.getElementById('searchInput').value.trim();
                const dropdown = document.getElementById('searchDropdown');
                if (dropdown) dropdown.classList.remove('show');
                if (query) {
                    saveSearchQuery(query);
                    window.location.href = `search.html?q=${encodeURIComponent(query)}`;
                }
            }
        }

        document.addEventListener('click', (e) => {
            const wrapper = document.querySelector('.search-box-wrapper');
            const dropdown = document.getElementById('searchDropdown');
            if (wrapper && !wrapper.contains(e.target)) {
                dropdown.classList.remove('show');
            }
        });

        renderCatalog();
    </script>
</body>
</html>
