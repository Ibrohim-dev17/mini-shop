<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog - Uzum Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        .sticky-header {
            position: sticky;
            top: 0;
            background: var(--card);
            z-index: 999;
            padding: 50px 16px 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            flex-shrink: 0;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--text);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 10px;
            padding: 8px 12px;
            gap: 8px;
            border: 1px solid transparent;
            width: 100%;
            transition: border-color 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--primary);
            background: #ffffff;
        }

        .search-box svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 2;
            flex-shrink: 0;
        }

        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            width: 100%;
            color: var(--text);
        }

        .search-box input::placeholder {
            color: var(--muted);
        }

        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-height: 280px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .search-dropdown.show {
            display: block;
        }

        .search-suggestion-item {
            padding: 10px 14px;
            font-size: 13px;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .search-suggestion-item:last-child {
            border-bottom: none;
        }

        .search-suggestion-item:hover, .search-suggestion-item:active {
            background: var(--primary-bg);
            color: var(--primary);
        }

        .suggestion-type {
            font-size: 11px;
            color: var(--muted);
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* IKKI USTUNLI KATALOG LAYOUTI */
        .catalog-layout {
            display: flex;
            height: calc(100vh - 120px);
            position: relative;
        }

        /* CHAP TARAFDAGI ASOSIY KATEGORIYALAR */
        .sidebar-categories {
            width: 135px;
            background: #ffffff;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            flex-shrink: 0;
            scrollbar-width: none;
        }

        .sidebar-categories::-webkit-scrollbar {
            display: none;
        }

        .sidebar-item {
            padding: 14px 10px;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            line-height: 1.3;
        }

        .sidebar-item.active {
            color: var(--primary);
            font-weight: 700;
            background: var(--primary-bg);
            border-left-color: var(--primary);
        }

        /* O'NG TARAFDAGI ICHKI KATEGORIYALAR VA MAHSULOTLAR */
        .content-panel {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background: var(--bg);
        }

        .panel-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
        }

        .subcats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        @media (max-width: 400px) {
            .subcats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .subcat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
            transition: transform 0.1s;
        }

        .subcat-card:active {
            transform: scale(0.96);
        }

        .subcat-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            background: #eee;
            margin-bottom: 6px;
            border: 1px solid var(--border);
        }

        .subcat-name {
            font-size: 11px;
            font-weight: 600;
            line-height: 1.2;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .bottom-nav {
            position: fixed;
            bottom: calc(40px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            height: 64px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #808080;
            font-size: 10px;
            font-weight: 500;
            width: 20%;
            position: relative;
            cursor: pointer;
            padding: 8px 0;
        }

        .nav-icon-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .nav-item span {
            pointer-events: none;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #808080;
            stroke-width: 1.8;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        .nav-item.active svg {
            stroke: var(--primary);
            fill: var(--primary-bg);
            transform: scale(1.05);
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -8px;
            background: #000;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 17px;
            height: 17px;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .badge-count.show {
            display: flex;
        }
    </style>
</head>
<body>

    <div class="sticky-header">
        <a href="index.html" class="back-btn" title="Orqaga">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </a>
        <div class="search-box-wrapper">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Mahsulotlar va turkumlar izlash..." oninput="handleLiveSearch(event)" onkeypress="handleSearch(event)">
            </div>
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>
    </div>

    <div class="catalog-layout">
        <div class="sidebar-categories" id="sidebarCategories"></div>
        <div class="content-panel" id="contentPanel"></div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
            <span>Bosh sahifa</span>
        </a>
        <a href="categories.html" class="nav-item active">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg></div>
            <span>Katalog</span>
        </a>
        <a href="cart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><div class="badge-count" id="cartBadge">0</div></div>
            <span>Savatcha</span>
        </a>
        <a href="heart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><div class="badge-count" id="favBadge">0</div></div>
            <span>Saralangan</span>
        </a>
        <a href="profil.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
            <span>Profil</span>
        </a>
    </nav>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const CATEGORIES_DATA = [
            {
                id: 1,
                name: "Ayollar kiyimlari",
                subcats: [
                    { name: "Ko'ylaklar", img: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=200&auto=format&fit=crop&q=80" },
                    { name: "Kurtkalar", img: "https://images.unsplash.com/photo-1544441893-675973e31985?w=200&auto=format&fit=crop&q=80" },
                    { name: "Ichki kiyimlar", img: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=200&auto=format&fit=crop&q=80" },
                    { name: "Shapkalar", img: "https://images.unsplash.com/photo-1576871337632-b9aef4c17ab9?w=200&auto=format&fit=crop&q=80" }
                ]
            },
            {
                id: 2,
                name: "Erkaklar kiyimlari",
                subcats: [
                    { name: "Kurtkalar", img: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=200&auto=format&fit=crop&q=80" },
                    { name: "Sportivniy", img: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=200&auto=format&fit=crop&q=80" },
                    { name: "Ichki kiyimlar", img: "https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?w=200&auto=format&fit=crop&q=80" }
                ]
            },
            {
                id: 3,
                name: "Oyoq kiyimlar",
                subcats: [
                    { name: "Tapichka", img: "https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=200&auto=format&fit=crop&q=80" },
                    { name: "Krossovkalar", img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=200&auto=format&fit=crop&q=80" }
                ]
            },
            {
                id: 4,
                name: "Aksessuarlar",
                subcats: [
                    { name: "Shapkalar", img: "https://images.unsplash.com/photo-1534215754734-18e55d134346?w=200&auto=format&fit=crop&q=80" },
                    { name: "Sumkalar", img: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=200&auto=format&fit=crop&q=80" }
                ]
            },
            {
                id: 5,
                name: "Uy uchun",
                subcats: [
                    { name: "Tapichka", img: "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=200&auto=format&fit=crop&q=80" },
                    { name: "To'qima buyumlar", img: "https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=200&auto=format&fit=crop&q=80" }
                ]
            }
        ];

        let activeCatId = 1;

        function renderCatalog() {
            const sidebar = document.getElementById('sidebarCategories');
            const panel = document.getElementById('contentPanel');

            sidebar.innerHTML = CATEGORIES_DATA.map(c => `
                <div class="sidebar-item ${c.id === activeCatId ? 'active' : ''}" onclick="selectCategory(${c.id})">
                    ${c.name}
                </div>
            `).join('');

            const currentCat = CATEGORIES_DATA.find(c => c.id === activeCatId) || CATEGORIES_DATA[0];

            panel.innerHTML = `
                <div class="panel-title">${currentCat.name}</div>
                <div class="subcats-grid">
                    ${currentCat.subcats.map(sub => `
                        <a href="products.html?cat_id=${currentCat.id}&sub=${encodeURIComponent(sub.name)}" class="subcat-card">
                            <img src="${sub.img}" alt="${sub.name}" class="subcat-img">
                            <span class="subcat-name">${sub.name}</span>
                        </a>
                    `).join('')}
                </div>
            `;
        }

        function selectCategory(id) {
            activeCatId = id;
            renderCatalog();
        }

        function handleLiveSearch(e) {
            const query = e.target.value.trim().toLowerCase();
            const dropdown = document.getElementById('searchDropdown');

            if (query.length === 0) {
                dropdown.classList.remove('show');
                dropdown.innerHTML = '';
                return;
            }

            let html = `<div class="search-suggestion-item" onclick="document.getElementById('searchDropdown').classList.remove('show'); window.location.href='search.html?q=${encodeURIComponent(query)}'">
                <span>"${query}" bo'yicha qidirish</span>
                <span class="suggestion-type">Natijalar</span>
            </div>`;

            dropdown.innerHTML = html;
            dropdown.classList.add('show');
        }

        function handleSearch(e) {
            if (e.key === 'Enter') {
                const query = document.getElementById('searchInput').value.trim();
                const dropdown = document.getElementById('searchDropdown');
                if (dropdown) dropdown.classList.remove('show');
                if (query) {
                    window.location.href = `search.html?q=${encodeURIComponent(query)}`;
                }
            }
        }

        document.addEventListener('click', (e) => {
            const wrapper = document.querySelector('.search-box-wrapper');
            const dropdown = document.getElementById('searchDropdown');
            if (wrapper && !wrapper.contains(e.target)) {
                dropdown.classList.remove('show');
            }
        });

        let favs = JSON.parse(localStorage.getItem('fav_products')) || [];
        let cart = JSON.parse(localStorage.getItem('cart_products')) || [];

        if (favs.length > 0) { 
            document.getElementById('favBadge').textContent = favs.length; 
            document.getElementById('favBadge').classList.add('show'); 
        }

        let totalCartCount = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
        if (totalCartCount > 0) { 
            document.getElementById('cartBadge').textContent = totalCartCount; 
            document.getElementById('cartBadge').classList.add('show'); 
        }

        renderCatalog();
    </script>
</body>
</html>
