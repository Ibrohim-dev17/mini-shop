<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog - Uzum Market</title>
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
        }

        [data-theme="dark"] {
            --primary: #9b4dff;
            --primary-bg: #221638;
            --bg: #121316;
            --card: #1c1d22;
            --text: #f4f5f7;
            --muted: #999cb0;
            --border: #2a2c33;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 120px;
            overflow: hidden;
            height: 100vh;
        }

        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: var(--card);
            z-index: 999;
            padding: 12px 16px;
            margin-top: 55px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            max-width: 1300px;
            margin-left: auto;
            margin-right: auto;
        }

        .sticky-header::before {
            content: '';
            position: absolute;
            top: -60px;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--card);
            z-index: -1;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 10px;
            padding: 8px 12px;
            gap: 8px;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
            width: 100%;
        }

        .search-box:focus-within {
            border-color: var(--primary);
        }

        .search-box svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 2;
            flex-shrink: 0;
        }

        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            width: 100%;
            color: var(--text);
        }

        .search-box input::placeholder {
            color: var(--muted);
        }

        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-height: 350px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .search-dropdown.show {
            display: block;
        }

        .search-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            background: var(--bg);
        }

        .clear-history-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }

        .search-suggestion-item {
            padding: 12px 14px;
            font-size: 13px;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--card);
        }

        .search-suggestion-item:last-child {
            border-bottom: none;
        }

        .search-suggestion-item:hover {
            background: var(--primary-bg);
            color: var(--primary);
        }

        .suggestion-type {
            font-size: 11px;
            color: var(--muted);
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .history-item-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .remove-history-item {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 16px;
            padding: 4px 8px;
            cursor: pointer;
        }

        .remove-history-item:hover {
            color: #ff3b30;
        }

        .search-backdrop { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 998; display: none; }
        .search-backdrop.show { display: block; }
        .sidebar-categories { position: relative; }

        /* Asosiy konteyner */
        .catalog-container {
            max-width: 1300px;
            margin: 125px auto 0 auto;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            height: calc(100vh - 130px);
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .catalog-container {
                padding: 6px 8px;
                gap: 8px;
                height: calc(100vh - 110px);
            }
        }

        /* 1. Chap tomon: Qisqartirilgan enli asosiy kategoriyalar (Mustaqil vertical scroll) */
        .sidebar-categories {
            width: 105px; /* Telefon ekranida ko'proq joy qoldirish uchun eni qisqartirildi */
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0;
            padding: 4px;
            height: 100%;
            scrollbar-width: none;
        }

        @media (min-width: 768px) {
            .sidebar-categories {
                width: 180px; /* Planshet va kompyuterlar uchun o'lcham */
                padding: 8px;
            }
        }

        .sidebar-categories::-webkit-scrollbar { display: none; }

        .sidebar-item {
            padding: 10px 8px;
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.3;
            border-radius: 8px;
            position: relative;
            margin-bottom: 4px;
            word-break: break-word;
        }

        @media (min-width: 768px) {
            .sidebar-item {
                padding: 12px 12px;
                font-size: 13px;
            }
        }

        .sidebar-item.active {
            color: var(--primary);
            font-weight: 700;
            background: var(--primary-bg);
        }

        .sidebar-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 16px;
            background: var(--primary);
            border-radius: 0 4px 4px 0;
        }

        /* 2. O'ng tomon: Qat'iy 3 ta ustunli doirali kategoriyalar paneli (Mustaqil vertical scroll) */
        .content-panel {
            flex: 1;
            padding: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            height: 100%;
        }

        @media (min-width: 768px) {
            .content-panel {
                padding: 24px;
                border-radius: 16px;
            }
        }

        .panel-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 14px;
        }

        @media (min-width: 768px) {
            .panel-title { font-size: 18px; margin-bottom: 18px; }
        }

        .subcats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* Qat'iy 3 ta ustun sig'ishi ta'minlandi */
            gap: 14px 6px;
        }

        @media (min-width: 768px) {
            .subcats-grid { grid-template-columns: repeat(3, 1fr); gap: 24px 16px; }
        }
        @media (min-width: 1024px) {
            .subcats-grid { grid-template-columns: repeat(3, 1fr); gap: 28px 20px; }
        }

        .subcat-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--text);
            width: 100%;
        }

        .subcat-img-wrap {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: var(--bg);
            overflow: hidden;
            margin-bottom: 6px;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .subcat-img-wrap { width: 85px; height: 85px; }
        }

        .subcat-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .subcat-name {
            font-size: 10px;
            font-weight: 500;
            line-height: 1.25;
            color: var(--text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            width: 100%;
        }

        @media (min-width: 768px) {
            .subcat-name { font-size: 12px; }
        }

        .bottom-nav {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom, 0px) + var(--nav-extra, 0px));
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            height: 64px;
            background: rgba(255, 255, 255, 0.97);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] .bottom-nav {
            background: rgba(28, 29, 34, 0.95);
            border-color: rgba(255, 255, 255, 0.08);
        }

        @media (min-width: 1024px) { .bottom-nav { max-width: 550px; } }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #808080;
            font-size: 10px;
            font-weight: 500;
            width: 20%;
            position: relative;
            cursor: pointer;
            padding: 8px 0;
            touch-action: manipulation;
        }

        .nav-icon-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .nav-item span { pointer-events: none; }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #808080;
            stroke-width: 1.8;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        .nav-item.active svg {
            stroke: var(--primary);
            fill: var(--primary-bg);
            transform: scale(1.05);
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -8px;
            background: #000;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 17px;
            height: 17px;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .badge-count.show { display: flex; }
    </style>
</head>
<body>

    <div class="search-backdrop" id="searchBackdrop" onclick="closeSearchDropdown()"></div>

    <div class="sticky-header">
        <div class="search-box-wrapper">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Mahsulotlar va turkumlar izlash..." data-i18n-placeholder="search_placeholder" onfocus="showSearchHistory()" oninput="handleLiveSearch(event)" onkeypress="handleSearch(event)" autocomplete="off">
            </div>
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>
    </div>

    <div class="catalog-container">
        <div class="sidebar-categories" id="sidebarCategories"></div>
        <div class="content-panel" id="contentPanel"></div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
            <span data-i18n="nav_home">Bosh sahifa</span>
        </a>
        <a href="categories.html" class="nav-item active">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg></div>
            <span data-i18n="nav_catalog">Katalog</span>
        </a>
        <a href="cart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><div class="badge-count" id="cartBadge">0</div></div>
            <span data-i18n="nav_cart">Savatcha</span>
        </a>
        <a href="heart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><div class="badge-count" id="favBadge">0</div></div>
            <span data-i18n="nav_fav">Saralangan</span>
        </a>
        <a href="profil.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
            <span data-i18n="nav_profile">Profil</span>
        </a>
    </nav>

    <script>
        const translations = {
            uz: {
                search_placeholder: "Mahsulotlar va turkumlar izlash...",
                history_title: "Oxirgi qidiruvlar",
                clear_history: "Tozalash",
                no_results: "Hech narsa topilmadi...",
                search_all_label: "bo'yicha barcha natijalarni ko'rish",
                search_type: "Qidirish",
                category_type: "Bo'lim",
                subcat_type: "Turkum",
                product_type: "Mahsulot",
                nav_home: "Bosh sahifa",
                nav_catalog: "Katalog",
                nav_cart: "Savatcha",
                nav_fav: "Saralangan",
                nav_profile: "Profil"
            },
            ru: {
                search_placeholder: "Поиск товаров и категорий...",
                history_title: "История поиска",
                clear_history: "Очистить",
                no_results: "Ничего не найдено...",
                search_all_label: "посмотреть все результаты для",
                search_type: "Поиск",
                category_type: "Раздел",
                subcat_type: "Категория",
                product_type: "Товар",
                nav_home: "Главная",
                nav_catalog: "Каталог",
                nav_cart: "Корзина",
                nav_fav: "Избранное",
                nav_profile: "Профиль"
            }
        };

        let currentLang = localStorage.getItem('selected_lang') || 'uz';
        let t = translations[currentLang] || translations['uz'];
        let dbData = {};
        try { history.scrollRestoration = 'manual'; } catch (e) {}
        let categoriesData = [];
        let allProducts = [];
        let activeCatId = parseInt(localStorage.getItem('active_cat_id')) || 1;

        function applyThemeAndTranslations() {
            currentLang = localStorage.getItem('selected_lang') || 'uz';
            t = translations[currentLang] || translations['uz'];

            let siteTheme = localStorage.getItem('site_theme') || 'light';
            if (siteTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.textContent = t[key];
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) el.placeholder = t[key];
            });
        }

        function getLocalized(field) {
            if (!field) return '';
            if (typeof field === 'object') {
                return field[currentLang] || field['uz'] || Object.values(field)[0] || '';
            }
            return field;
        }

        function getStrictLocalized(field) {
            if (!field) return '';
            if (typeof field === 'object') {
                return field[currentLang] || '';
            }
            return '';
        }

        /* ---------- Ma'lumotlar: keshdan darhol, fonda yangilash ---------- */
        async function loadDB(onUpdate) {
            const KEY = new URL('database.json', location.href).href;
            let cache = null, cachedText = null;
            try {
                cache = await caches.open('uzum-db-v1');
                const hit = await cache.match(KEY);
                if (hit) cachedText = await hit.text();
            } catch (e) {}
            const fetchFresh = async () => {
                const res = await fetch(KEY, { cache: 'no-cache' });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const text = await res.text();
                if (cache && text !== cachedText) {
                    try { await cache.put(KEY, new Response(text, { headers: { 'Content-Type': 'application/json' } })); } catch (e) {}
                }
                return text;
            };
            if (cachedText) {
                try {
                    const data = JSON.parse(cachedText);
                    fetchFresh().then(text => {
                        if (text !== cachedText && onUpdate) { try { onUpdate(JSON.parse(text)); } catch (e) {} }
                    }).catch(() => {});
                    return data;
                } catch (e) {}
            }
            return JSON.parse(await fetchFresh());
        }

        function setDB(d) {
            dbData = d || {};
            categoriesData = dbData.categories || [];
            allProducts = dbData.products || [];
            if (dbData.settings && dbData.settings.theme && !localStorage.getItem('site_theme')) {
                localStorage.setItem('site_theme', dbData.settings.theme);
            }
        }

        function centerActiveCat() {
            const sidebar = document.getElementById('sidebarCategories');
            const a = sidebar && sidebar.querySelector('.sidebar-item.active');
            if (a) sidebar.scrollTop = Math.max(0, a.offsetTop - sidebar.clientHeight / 2 + a.offsetHeight / 2);
        }

        async function fetchDatabaseAndInit() {
            currentLang = localStorage.getItem('selected_lang') || 'uz';
            applyThemeAndTranslations();
            try {
                setDB(await loadDB(fresh => { setDB(fresh); renderCatalog(); updateBadges(); }));
            } catch (err) {
                try {
                    const res = await fetch('/api/products');
                    if (res.ok) setDB(await res.json());
                } catch (e) { console.error("Bazadan ma'lumotlarni o'qib bo'lmadi:", e); }
            }

            // Banner yoki qidiruvdan kelgan bo'lsa: ?cat_id=... bo'yicha shu kategoriya ochiladi
            const urlCat = parseInt(new URLSearchParams(location.search).get('cat_id'));
            if (!isNaN(urlCat)) {
                activeCatId = urlCat;
                localStorage.setItem('active_cat_id', urlCat);
                localStorage.removeItem('catalog_content_scroll');
            }

            renderCatalog();
            updateBadges();
            centerActiveCat();

            const savedScroll = localStorage.getItem('catalog_content_scroll');
            if (savedScroll) {
                setTimeout(() => {
                    const panel = document.getElementById('contentPanel');
                    if (panel) panel.scrollTop = parseInt(savedScroll);
                }, 50);
            }
        }

        function renderCatalog() {
            applyThemeAndTranslations();
            const sidebar = document.getElementById('sidebarCategories');
            const panel = document.getElementById('contentPanel');

            if (!categoriesData || categoriesData.length === 0) return;

            sidebar.innerHTML = categoriesData.map(c => `
                <div class="sidebar-item ${c.id === activeCatId ? 'active' : ''}" onclick="selectCategory(${c.id})">
                    ${getLocalized(c.name)}
                </div>
            `).join('');

            const currentCat = categoriesData.find(c => c.id === activeCatId) || categoriesData[0];

            panel.innerHTML = `
                <div class="panel-title">${getLocalized(currentCat.name)}</div>
                <div class="subcats-grid">
                    ${currentCat.subcats.map(sub => {
                        const subName = getLocalized(sub.name);
                        return `
                            <a href="products.html?cat_id=${currentCat.id}&sub=${encodeURIComponent(subName)}" class="subcat-card" onclick="saveScrollPosition()">
                                <div class="subcat-img-wrap">
                                    <img src="${sub.img}" alt="${subName}" class="subcat-img">
                                </div>
                                <span class="subcat-name">${subName}</span>
                            </a>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function selectCategory(id) {
            activeCatId = id;
            localStorage.setItem('active_cat_id', id);
            const panel = document.getElementById('contentPanel');
            if (panel) panel.scrollTop = 0;
            localStorage.removeItem('catalog_content_scroll');
            renderCatalog();
        }

        function saveScrollPosition() {
            localStorage.setItem('active_cat_id', activeCatId);
            const panel = document.getElementById('contentPanel');
            if (panel) {
                localStorage.setItem('catalog_content_scroll', panel.scrollTop);
            }
        }

        /* ================= QIDIRUV: index, products va categories sahifalarida bir xil ================= */
        let searchActive = false;
        let searchBackdropTimer = null;
        let kbBaseH = 0;
        let kbShown = false;

        // Faqat sahifaning joriy tilidagi matn bo'yicha qidiriladi (ruscha sahifa = ruscha, o'zbekcha = o'zbekcha)
        function sTxt(f) { if (!f) return ''; if (typeof f === 'string') return f; return f[currentLang] || ''; }
        function sNorm(s) { return String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/[ʻʼ’‘`´ʹ]/g, "'").replace(/\s+/g, ' ').trim(); }
        function sMatch(text, q) { const tx = sNorm(text); if (!tx || !q) return false; return q.split(' ').every(w => tx.includes(w)); }
        function escHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
        function tt(key, fallback) { return (t && t[key]) || fallback; }

        function getSearchHistory() { try { return JSON.parse(localStorage.getItem('search_history')) || []; } catch (e) { return []; } }
        function saveSearchQuery(q) {
            if (!q) return;
            let history = getSearchHistory();
            history = history.filter(item => item.toLowerCase() !== q.toLowerCase());
            history.unshift(q);
            if (history.length > 5) history = history.slice(0, 5);
            localStorage.setItem('search_history', JSON.stringify(history));
        }
        function removeHistoryItem(i) { const h = getSearchHistory(); h.splice(i, 1); localStorage.setItem('search_history', JSON.stringify(h)); renderHistory(); }
        function clearAllHistory() { localStorage.removeItem('search_history'); closeSearchDropdown(); }

        function currentVH() { return window.visualViewport ? window.visualViewport.height : window.innerHeight; }
        function markSearchOpen() {
            clearTimeout(searchBackdropTimer);
            if (!searchActive) { kbBaseH = currentVH(); kbShown = false; }
            searchActive = true;
            const b = document.getElementById('searchBackdrop');
            if (b) b.classList.add('show');
        }
        function closeSearchDropdown() {
            searchActive = false;
            const dd = document.getElementById('searchDropdown');
            if (dd) dd.classList.remove('show');
            const inp = document.getElementById('searchInput');
            if (inp) inp.blur();                                   // klaviatura yopiladi
            clearTimeout(searchBackdropTimer);
            // fon biroz kechikib yopiladi, shunda bosish ostidagi kartaga o'tib ketmaydi
            searchBackdropTimer = setTimeout(() => {
                if (!searchActive) { const b = document.getElementById('searchBackdrop'); if (b) b.classList.remove('show'); }
            }, 300);
        }
        function closeSearchIfOpen() {
            const dd = document.getElementById('searchDropdown');
            if (searchActive || (dd && dd.classList.contains('show'))) { closeSearchDropdown(); return true; }
            return false;
        }

        function renderHistory() {
            const dd = document.getElementById('searchDropdown');
            const history = getSearchHistory();
            if (history.length === 0) { dd.classList.remove('show'); dd.innerHTML = ''; return; }
            let html = `<div class="search-header-row"><span>${tt('history_title', 'Oxirgi qidiruvlar')}</span><button class="clear-history-btn" data-act="clear">${tt('clear_history', 'Tozalash')}</button></div>`;
            history.forEach((item, i) => {
                html += `<div class="search-suggestion-item" data-act="hist" data-q="${escHtml(item)}"><div class="history-item-left"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg><span>${escHtml(item)}</span></div><button class="remove-history-item" data-act="del" data-idx="${i}">&times;</button></div>`;
            });
            dd.innerHTML = html;
            dd.classList.add('show');
        }

        function renderSearchDropdown() {
            const dd = document.getElementById('searchDropdown');
            const raw = document.getElementById('searchInput').value.trim();
            if (!raw) { renderHistory(); return; }
            const q = sNorm(raw);
            const src = getSearchSource();
            const mc = [], ms = [];
            (src.cats || []).forEach(c => {
                if (sMatch(sTxt(c.name), q)) mc.push(c);
                (c.subcats || []).forEach(s => { if (sMatch(sTxt(s.name), q)) ms.push({ c, s }); });
            });
            const mp = (src.prods || []).filter(p => sMatch(sTxt(p.name), q) || sMatch(sTxt(p.subcat), q));

            if (!mc.length && !ms.length && !mp.length) {
                dd.innerHTML = `<div class="search-suggestion-item" style="color: var(--muted); justify-content: center;">${tt('no_results', 'Hech narsa topilmadi...')}</div>`;
                dd.classList.add('show');
                return;
            }
            let html = `<div class="search-suggestion-item" data-act="all" data-q="${escHtml(raw)}"><span>"${escHtml(raw)}" ${tt('search_all_label', "bo'yicha barcha natijalarni ko'rish")}</span><span class="suggestion-type">${tt('search_type', 'Qidirish')}</span></div>`;
            mc.slice(0, 3).forEach(c => {
                html += `<div class="search-suggestion-item" data-act="cat" data-cat="${escHtml(c.id)}"><span>${escHtml(sTxt(c.name))}</span><span class="suggestion-type">${tt('category_type', "Bo'lim")}</span></div>`;
            });
            ms.slice(0, 4).forEach(x => {
                html += `<div class="search-suggestion-item" data-act="sub" data-cat="${escHtml(x.c.id)}" data-sub="${escHtml(sTxt(x.s.name))}"><span>${escHtml(sTxt(x.s.name))} <small style="color:var(--muted)">(${escHtml(sTxt(x.c.name))})</small></span><span class="suggestion-type">${tt('subcat_type', 'Turkum')}</span></div>`;
            });
            mp.slice(0, 6).forEach(p => {
                html += `<div class="search-suggestion-item" data-act="prod" data-id="${escHtml(p.id)}" data-q="${escHtml(sTxt(p.name))}"><div class="history-item-left"><span>${escHtml(sTxt(p.name))}</span></div><span class="suggestion-type">${tt('product_type', 'Mahsulot')}</span></div>`;
            });
            dd.innerHTML = html;
            dd.classList.add('show');
        }

        function goSearch(q) {
            if (!q) return;
            saveSearchQuery(q);
            closeSearchDropdown();
            window.location.href = `products.html?q=${encodeURIComponent(q)}`;
        }
        function pickCategory(id) {
            if (typeof onCategoryPicked === 'function') { onCategoryPicked(id); return; }
            localStorage.setItem('active_cat_id', id);
            window.location.href = `categories.html?cat_id=${encodeURIComponent(id)}`;
        }

        function showSearchHistory() { markSearchOpen(); renderSearchDropdown(); }
        function handleLiveSearch() { markSearchOpen(); renderSearchDropdown(); }
        function handleSearch(e) { if (e.key === 'Enter') { const q = e.target.value.trim(); if (q) goSearch(q); } }

        document.getElementById('searchDropdown').addEventListener('click', (e) => {
            const el = e.target.closest('[data-act]');
            if (!el) return;
            e.stopPropagation();
            const d = el.dataset;
            if (d.act === 'all' || d.act === 'hist') goSearch(d.q);
            else if (d.act === 'cat') { closeSearchDropdown(); pickCategory(d.cat); }
            else if (d.act === 'sub') { window.location.href = `products.html?cat_id=${encodeURIComponent(d.cat)}&sub=${encodeURIComponent(d.sub)}`; }
            else if (d.act === 'prod') { saveSearchQuery(d.q); window.location.href = `product.html?id=${encodeURIComponent(d.id)}`; }
            else if (d.act === 'del') removeHistoryItem(parseInt(d.idx));
            else if (d.act === 'clear') clearAllHistory();
        });

        // Klaviatura yopilsa (orqaga surish), qidiruv ham yopiladi
        function onViewportResize() {
            if (!searchActive) return;
            const h = currentVH();
            if (h < kbBaseH - 100) kbShown = true;
            else if (kbShown && h >= kbBaseH - 60) closeSearchDropdown();
        }
        window.addEventListener('resize', onViewportResize);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', onViewportResize);
        window.addEventListener('DOMContentLoaded', () => {
            const tg = window.Telegram && window.Telegram.WebApp;
            if (tg && tg.onEvent) tg.onEvent('viewportChanged', onViewportResize);
        });

        function isInsideSearch(target) {
            return !!(target && target.closest && (target.closest('#searchBoxContainer') || target.closest('.search-box-wrapper') || target.closest('#searchDropdown')));
        }
        // Ekranga sal tegilsa yoki surilsa, qidiruv va klaviatura yopiladi
        ['touchstart', 'touchmove', 'wheel'].forEach(evName => {
            document.addEventListener(evName, (e) => {
                if (searchActive && !isInsideSearch(e.target)) closeSearchDropdown();
            }, { passive: true });
        });
        document.addEventListener('click', (e) => {
            if (searchActive && !isInsideSearch(e.target)) closeSearchDropdown();
        });

        function getSearchSource() { return { cats: categoriesData, prods: allProducts }; }
        // Qidiruvdan kategoriya tanlansa shu sahifaning o'zida ochiladi
        function onCategoryPicked(id) {
            const n = parseInt(id);
            localStorage.setItem('active_cat_id', n);
            selectCategory(n);
            centerActiveCat();
            document.getElementById('searchInput').value = '';
        }

        function updateBadges() {
            let favs = JSON.parse(localStorage.getItem('fav_products')) || [];
            let cart = JSON.parse(localStorage.getItem('cart_products')) || [];
            const favBadge = document.getElementById('favBadge');
            const cartBadge = document.getElementById('cartBadge');

            if (favs.length > 0) {
                favBadge.textContent = favs.length;
                favBadge.classList.add('show');
            } else {
                favBadge.classList.remove('show');
            }

            let totalCartCount = cart.reduce((sum, item) => sum + (item.qty || 1), 0);
            if (totalCartCount > 0) {
                cartBadge.textContent = totalCartCount;
                cartBadge.classList.add('show');
            } else {
                cartBadge.classList.remove('show');
            }
        }

        /* ---------- Orqaga: telefon tugmasi, chetdan surish va strelka bir xil, ilova yopilmaydi ---------- */
        function pageGoBack() {
            if (closeSearchIfOpen()) return;                       // avval qidiruv oynasi yopiladi
            if (history.length > 1 && document.referrer) history.back();
            else window.location.href = 'index.html';              // tarix bo'sh bo'lsa ham bosh sahifaga qaytadi
        }
        function setupTelegramBack(handler) {
            const tg = window.Telegram && window.Telegram.WebApp;
            if (!tg) return;
            try { tg.ready(); tg.expand(); } catch (e) {}
            if (tg.BackButton) {
                try { tg.BackButton.offClick(handler); } catch (e) {}
                tg.BackButton.onClick(handler);
                tg.BackButton.show();                              // ko'rinib tursa, telefonning "orqaga" tugmasi ilovani yopmaydi
            }
            try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
        }
        /* ---------- Pastki navigatsiya: 3 tugmali telefonlarda yuqoriga ko'tariladi ---------- */
        function updateNavInset() {
            const tg = window.Telegram && window.Telegram.WebApp;
            let sys = 0;
            if (tg && tg.safeAreaInset && tg.safeAreaInset.bottom) sys = tg.safeAreaInset.bottom;
            const cssVar = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tg-safe-area-inset-bottom'));
            if (!isNaN(cssVar)) sys = Math.max(sys, cssVar);

            const probe = document.createElement('div');
            probe.style.cssText = 'position:fixed;left:0;bottom:0;height:0;visibility:hidden;pointer-events:none;padding-bottom:env(safe-area-inset-bottom, 0px);';
            document.body.appendChild(probe);
            const envPx = parseFloat(getComputedStyle(probe).paddingBottom) || 0;
            probe.remove();
            sys = Math.max(sys, envPx);

            let extra = sys >= 32 ? Math.max(0, sys - envPx) : 0;
            const manual = parseFloat(localStorage.getItem('nav_extra'));
            if (!isNaN(manual)) extra = manual;
            document.documentElement.style.setProperty('--nav-extra', extra + 'px');
        }
        window.addEventListener('DOMContentLoaded', () => {
            updateNavInset();
            window.addEventListener('resize', updateNavInset);
            const tg = window.Telegram && window.Telegram.WebApp;
            if (tg && tg.onEvent) {
                tg.onEvent('safeAreaChanged', updateNavInset);
                tg.onEvent('contentSafeAreaChanged', updateNavInset);
                tg.onEvent('viewportChanged', updateNavInset);
            }
        });

        window.addEventListener('pageshow', (e) => {
            if (!e.persisted) return;
            updateBadges();
            setupTelegramBack(pageGoBack);
        });
        window.addEventListener('DOMContentLoaded', () => {
            setupTelegramBack(pageGoBack);
            fetchDatabaseAndInit();
        });
    </script>
</body>
</html>
