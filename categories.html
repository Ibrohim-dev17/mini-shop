<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Katalog - Uzum Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        /* HEADER QIDIRUV SATRI VA AVTO-TAVSIYA (LIVE SEARCH) */
        .sticky-header {
            position: sticky;
            top: 0;
            background: var(--card);
            z-index: 999;
            padding: 50px 16px 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            flex-shrink: 0;
        }

        .back-btn svg {
            width: 20px;
            height: 20px;
            stroke: var(--text);
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-box-wrapper {
            position: relative;
            width: 100%;
            flex: 1;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 10px;
            padding: 8px 12px;
            gap: 8px;
            border: 1px solid transparent;
            width: 100%;
            transition: border-color 0.2s;
        }

        .search-box:focus-within {
            border-color: var(--primary);
            background: #ffffff;
        }

        .search-box svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 2;
            flex-shrink: 0;
        }

        .search-box input {
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            width: 100%;
            color: var(--text);
        }

        .search-box input::placeholder {
            color: var(--muted);
        }

        /* LIVE SEARCH DROPDOWN */
        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-top: 6px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-height: 280px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .search-dropdown.show {
            display: block;
        }

        .search-suggestion-item {
            padding: 10px 14px;
            font-size: 13px;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .search-suggestion-item:last-child {
            border-bottom: none;
        }

        .search-suggestion-item:hover, .search-suggestion-item:active {
            background: var(--primary-bg);
            color: var(--primary);
        }

        .suggestion-type {
            font-size: 11px;
            color: var(--muted);
            background: var(--bg);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* KATEGORIYALAR RO'YXATI */
        .categories-container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .category-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }

        .category-card:active {
            background: var(--primary-bg);
        }

        .cat-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .cat-img {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: cover;
            background: #eee;
            border: 1px solid var(--border);
        }

        .cat-name {
            font-size: 16px;
            font-weight: 600;
        }

        .arrow-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: var(--muted);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* BOTTOM NAVIGATION */
        .bottom-nav {
            position: fixed;
            bottom: calc(45px + env(safe-area-inset-bottom, 0px));
            left: 16px;
            right: 16px;
            max-width: 480px;
            margin: 0 auto;
            height: 64px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            z-index: 1000;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #808080;
            font-size: 10px;
            font-weight: 500;
            width: 20%;
            position: relative;
            cursor: pointer;
            padding: 8px 0;
        }

        .nav-icon-wrap {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .nav-item span {
            pointer-events: none;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #808080;
            stroke-width: 1.8;
            transition: all 0.2s ease;
        }

        .nav-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        .nav-item.active svg {
            stroke: var(--primary);
            fill: var(--primary-bg);
            transform: scale(1.05);
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -8px;
            background: #000;
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 17px;
            height: 17px;
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        .badge-count.show {
            display: flex;
        }
    </style>
</head>
<body>

    <div class="sticky-header">
        <a href="index.html" class="back-btn" title="Orqaga">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </a>
        <div class="search-box-wrapper">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Mahsulotlar va turkumlar izlash..." oninput="handleLiveSearch(event)" onkeypress="handleSearch(event)">
            </div>
            <div class="search-dropdown" id="searchDropdown"></div>
        </div>
    </div>

    <div class="categories-container" id="categoriesList"></div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></div>
            <span>Bosh sahifa</span>
        </a>
        <a href="categories.html" class="nav-item active">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg></div>
            <span>Katalog</span>
        </a>
        <a href="cart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><div class="badge-count" id="cartBadge">0</div></div>
            <span>Savatcha</span>
        </a>
        <a href="heart.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg><div class="badge-count" id="favBadge">0</div></div>
            <span>Saralangan</span>
        </a>
        <a href="profil.html" class="nav-item">
            <div class="nav-icon-wrap"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
            <span>Profil</span>
        </a>
    </nav>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        const DEFAULT_CATEGORIES = [
            { id: 1, name: "Kurtkalar", img: "https://picsum.photos/100/100?random=1" },
            { id: 2, name: "Tapichka", img: "https://picsum.photos/100/100?random=2" },
            { id: 3, name: "Shapkalar", img: "https://picsum.photos/100/100?random=3" },
            { id: 4, name: "Ko'ylaklar", img: "https://picsum.photos/100/100?random=4" },
            { id: 5, name: "Ichki kiyimlar", img: "https://picsum.photos/100/100?random=5" }
        ];

        const PRODUCTS = [
            { id: 1, category_id: 1, name: "Qishki issiq qora kurtka", price: "450 000 so'm", oldPrice: "680 000 so'm", discount: "↓ 33%", rating: 4.9, comments: 124, img: "https://picsum.photos/300/300?random=1" },
            { id: 2, category_id: 1, name: "Sportivniy stilimdagi kurtka", price: "380 000 so'm", oldPrice: "500 000 so'm", discount: "↓ 24%", rating: 4.8, comments: 92, img: "https://picsum.photos/300/300?random=2" },
            { id: 3, category_id: 2, name: "Uy uchun yumshoq tapichka", price: "45 000 so'm", oldPrice: "80 000 so'm", discount: "↓ 43%", rating: 5.0, comments: 310, img: "https://picsum.photos/300/300?random=3" },
            { id: 4, category_id: 3, name: "Bahorgi qora shapka", price: "35 000 so'm", oldPrice: "60 000 so'm", discount: "↓ 41%", rating: 4.7, comments: 45, img: "https://picsum.photos/300/300?random=4" },
            { id: 5, category_id: 4, name: "Ayollar uchun zamonaviy ko'ylak", price: "220 000 so'm", oldPrice: "350 000 so'm", discount: "↓ 37%", rating: 4.9, comments: 178, img: "https://picsum.photos/300/300?random=5" },
            { id: 6, category_id: 5, name: "Paxtadan tayyorlangan ichki kiyimlar to'plami", price: "90 000 so'm", oldPrice: "150 000 so'm", discount: "↓ 40%", rating: 4.8, comments: 89, img: "https://picsum.photos/300/300?random=6" }
        ];

        function loadCategories() {
            const container = document.getElementById('categoriesList');
            let categories = JSON.parse(localStorage.getItem('categories')) || DEFAULT_CATEGORIES;
            localStorage.setItem('categories', JSON.stringify(categories));

            container.innerHTML = categories.map(c => `
                <a href="products.html?cat_id=${c.id}&cat_name=${encodeURIComponent(c.name)}" class="category-card">
                    <div class="cat-left">
                        <img src="${c.img}" alt="${c.name}" class="cat-img">
                        <span class="cat-name">${c.name}</span>
                    </div>
                    <svg class="arrow-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
                </a>
            `).join('');
        }

        // --- LIVE SEARCH LOGIKASI ---
        function handleLiveSearch(e) {
            const query = e.target.value.trim().toLowerCase();
            const dropdown = document.getElementById('searchDropdown');

            if (query.length === 0) {
                dropdown.classList.remove('show');
                dropdown.innerHTML = '';
                return;
            }

            let products = JSON.parse(localStorage.getItem('products')) || PRODUCTS;
            let categories = JSON.parse(localStorage.getItem('categories')) || DEFAULT_CATEGORIES;

            let matchedProducts = products.filter(p => p.name.toLowerCase().includes(query));
            let matchedCategories = categories.filter(c => c.name.toLowerCase().includes(query));

            let html = '';

            if (matchedCategories.length > 0) {
                matchedCategories.forEach(c => {
                    html += `<div class="search-suggestion-item" onclick="document.getElementById('searchDropdown').classList.remove('show'); window.location.href='products.html?cat_id=${c.id}&cat_name=${encodeURIComponent(c.name)}'">
                        <span>${c.name}</span>
                        <span class="suggestion-type">Kategoriya</span>
                    </div>`;
                });
            }

            if (matchedProducts.length > 0) {
                html += `<div class="search-suggestion-item" onclick="document.getElementById('searchDropdown').classList.remove('show'); window.location.href='search.html?q=${encodeURIComponent(query)}'">
                    <span>"${query}" bo'yicha barcha turlarni ko'rish</span>
                    <span class="suggestion-type">Natijalar</span>
                </div>`;

                matchedProducts.forEach(p => {
                    html += `<div class="search-suggestion-item" onclick="document.getElementById('searchDropdown').classList.remove('show'); window.location.href='search.html?q=${encodeURIComponent(p.name)}'">
                        <span>${p.name}</span>
                        <span class="suggestion-type">Mahsulot</span>
                    </div>`;
                });
            }

            if (matchedCategories.length === 0 && matchedProducts.length === 0) {
                html += `<div class="search-suggestion-item" style="color: var(--muted); justify-content: center;">Bunday mahsulot topilmadi...</div>`;
            }

            dropdown.innerHTML = html;
            dropdown.classList.add('show');
        }

        function handleSearch(e) {
            if (e.key === 'Enter') {
                const query = document.getElementById('searchInput').value.trim();
                const dropdown = document.getElementById('searchDropdown');
                if (dropdown) dropdown.classList.remove('show');
                if (query) {
                    window.location.href = `search.html?q=${encodeURIComponent(query)}`;
                }
            }
        }

        document.addEventListener('click', (e) => {
            const wrapper = document.querySelector('.search-box-wrapper');
            const dropdown = document.getElementById('searchDropdown');
            if (wrapper && !wrapper.contains(e.target)) {
                dropdown.classList.remove('show');
            }
        });

        let favs = JSON.parse(localStorage.getItem('fav_products')) || [];
        let cart = JSON.parse(localStorage.getItem('cart_products')) || [];
        if (favs.length > 0) { document.getElementById('favBadge').textContent = favs.length; document.getElementById('favBadge').classList.add('show'); }
        if (cart.length > 0) { document.getElementById('cartBadge').textContent = cart.length; document.getElementById('cartBadge').classList.add('show'); }

        loadCategories();
    </script>
</body>
</html>
