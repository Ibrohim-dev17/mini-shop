<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hafta aksiyalari - Uzum Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #7000ff;
            --primary-bg: #eef0ff;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2026;
            --muted: #8b8e99;
            --border: #e2e5eb;
            --star: #ffb800;
            --discount-bg: #f1e5ff;
            --discount-text: #7000ff;
            --danger: #ff3b30;
        }
        [data-theme="dark"] {
            --primary: #9b4dff;
            --primary-bg: #221638;
            --bg: #121316;
            --card: #1c1d22;
            --text: #f4f5f7;
            --muted: #999cb0;
            --border: #2a2c33;
            --discount-bg: #2e1a47;
            --discount-text: #b17dff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; }
        .header { position: sticky; top: 0; background: var(--card); padding: 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); z-index: 100; }
        .back-btn { width: 36px; height: 36px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); text-decoration: none; }
        .title { font-size: 18px; font-weight: 850; }
        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; max-width: 1300px; margin: 0 auto; }
        @media(min-width: 768px) { .products-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
        .product-card { background: var(--card); border-radius: 16px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; position: relative; }
        .product-img { width: 100%; height: 200px; object-fit: cover; cursor: pointer; }
        .product-info { padding: 12px; display: flex; flex-direction: column; justify-content: space-between; flex: 1; }
        .main-price { font-size: 16px; font-weight: 800; color: var(--text); }
        .price-old { font-size: 12px; color: var(--muted); text-decoration: line-through; }
        .product-title { font-size: 13px; line-height: 1.3; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin: 6px 0; cursor: pointer; }
        .cart-btn { width: 100%; height: 36px; background: var(--primary-bg); color: var(--primary); border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg></a>
        <h1 class="title" data-i18n="sales_title">Hafta aksiyalari</h1>
    </div>

    <div class="products-grid" id="salesGrid"></div>

    <script>
        let currentLang = localStorage.getItem('selected_lang') || 'uz';
        let siteTheme = localStorage.getItem('site_theme') || 'light';
        if (siteTheme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

        const translations = {
            uz: { sales_title: "Hafta aksiyalari", cart_btn: "Savatga" },
            ru: { sales_title: "Скидки недели", cart_btn: "В корзину" }
        };

        async function initSales() {
            let res = await fetch('database.json');
            let db = await res.json();
            let section = db.home_sections.find(s => s.id === 'weekly_discounts');
            let promoProds = db.products.filter(p => section.product_ids.includes(p.id));

            document.getElementById('salesGrid').innerHTML = promoProds.map(p => `
                <div class="product-card" onclick="location.href='product.html?id=${p.id}'">
                    <img class="product-img" src="${p.images[0]}">
                    <div class="product-info">
                        <div>
                            <div class="main-price">${p.price}</div>
                            <div class="price-old">${p.oldPrice}</div>
                            <div class="product-title">${p.name[currentLang] || p.name['uz']}</div>
                        </div>
                        <button class="cart-btn" onclick="event.stopPropagation(); addToCart(${p.id})">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                            ${translations[currentLang].cart_btn}
                        </button>
                    </div>
                </div>
            `).join('');
        }
        function addToCart(id) {
            let cart = JSON.parse(localStorage.getItem('cart_products')) || [];
            // qo'shish mantiqi
        }
        window.addEventListener('DOMContentLoaded', initSales);
    </script>
</body>
</html>
